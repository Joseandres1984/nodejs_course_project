name = "lumen-zero-dashboard"
main = "decision_truth_sync_worker.js"
compatibility_date = "2026-09-20"
workers_dev = true

[vars]
LUMEN_DASHBOARD_USER = "socio"

[[services]]
binding = "A2A"
service = "lumen-zero-a2a"

[[services]]
binding = "PUBLIC"
service = "lumen-zero-public"

[[services]]
binding = "X402"
service = "lumen-zero-x402"

[[d1_databases]]
binding = "DB"
database_name = "lumen-zero"
database_id = "e872694a-ed14-4a7f-b2c3-38b8e1bb498b"
