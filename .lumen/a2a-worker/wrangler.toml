name = "lumen-zero-a2a"
main = "opportunity-entry.js"
compatibility_date = "2026-09-21"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "lumen-zero"
database_id = "e872694a-ed14-4a7f-b2c3-38b8e1bb498b"

[vars]
A2A_AUTONOMOUS_OUTREACH = "true"
A2A_AUTONOMOUS_FOLLOWUP = "true"
A2A_AUTONOMOUS_COMMERCIAL_REPLY = "true"
A2A_AUTONOMOUS_CONVERSION_CLOSE = "true"
A2A_AUTONOMOUS_RECRUITMENT = "false"
A2A_AUTONOMOUS_DELEGATION = "false"
LUMEN_FIRST_CASH_MODE = "true"

[triggers]
crons = ["7,22,37,52 * * * *"]
