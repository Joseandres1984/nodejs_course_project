# PRIVATE fulfillment Worker. Buyer download requires verified checkout, merchant, payer, order and signed expiring link.
name = "calculafacil-pro-fulfillment"
main = "worker.mjs"
compatibility_date = "2026-10-11"
workers_dev = true

[vars]
# Public, non-secret configuration.
FULFILLMENT_ENABLED = "true" # Strict provider-verified purchase only; site remains disabled until health passes
EXPECTED_AMOUNT_ARS = "9900"
EXPECTED_PREFERENCE_ID = "59348768-483e73d1-8b3f-450c-a610-b7ce39d70da9"
PRO_KIT_OBJECT_KEY = "calculafacil-pro/CalculaFacil_PRO_Kit_v1.xlsx"

[[r2_buckets]]
binding = "PRO_KIT"
bucket_name = "calculafacil-pro-private"

[[ratelimits]]
name = "CLAIM_LIMITER"
namespace_id = "50131"

  [ratelimits.simple]
  limit = 4
  period = 60
