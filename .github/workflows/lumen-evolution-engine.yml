name: LUMEN Evolution Engine
# LUMEN swarm redeploy: optimized 120-scout runtime 2026-10-07

on:
  pull_request:
    paths:
      - '.github/workflows/lumen-evolution-engine.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumen-evolution-engine.yml'
  schedule:
    # Twelve bounded evolution cycles per UTC day: one every two hours.
    - cron: '47 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-evolution-engine
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout LUMEN production source
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate evolution primitives
        shell: bash
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/adaptive-entry.js
          node --check .lumen/a2a-worker/adaptive-core-entry.js
          node --check .lumen/a2a-worker/adaptive-market-hunter.js
          node --check .lumen/a2a-worker/a2a-outreach.js
          node --check .lumen/a2a-worker/autonomous-growth-loop-v11.js
          node --check .lumen/a2a-worker/growth-multiplier-v2.js
          node --check .lumen/a2a-worker/growth-engine-foundry-v2.js
          node .lumen/a2a-worker/test-autonomous-growth-loop-v11.mjs
          node .lumen/a2a-worker/test-growth-multiplier-v2.mjs
          node .lumen/a2a-worker/test-growth-engine-foundry-v2.mjs

      - name: Prove bounded evolution guardrails statically
        shell: bash
        run: |
          set -euo pipefail
          foundry=.lumen/a2a-worker/growth-engine-foundry-v2.js
          multiplier=.lumen/a2a-worker/growth-multiplier-v2.js
          growth=.lumen/a2a-worker/autonomous-growth-loop-v11.js
          entry=.lumen/a2a-worker/adaptive-entry.js

          grep -q 'autonomousSpendUsd:0' "$foundry"
          grep -q 'createsExternalMessages:false' "$foundry"
          grep -q 'executesGeneratedCode:false' "$foundry"
          grep -q 'selfModifyingCode:false' "$foundry"
          grep -q 'bindingActionsHumanGated:true' "$foundry"
          grep -q 'verifiedRevenueOnly:true' "$foundry"
          grep -q 'maxConcurrentExperiments:1' "$foundry"
          grep -q 'autonomousSpendUsd:0' "$multiplier"
          grep -q 'createsExternalMessages:false' "$multiplier"
          grep -q 'selfModifyingCode:false' "$multiplier"
          grep -q 'handleAutonomousGrowthLoop' "$entry"
          grep -q 'handleGrowthMultiplierV2' "$entry"
          grep -q 'handleGrowthEngineFoundryV2' "$entry"
          grep -q 'codeSelfDeployment:false' "$growth"
          grep -q 'const MAX_ACTIVE_STRATEGIES = 120' .lumen/a2a-worker/adaptive-market-hunter.js
          grep -q 'const MAX_QUERIES_PER_RUN = 24' .lumen/a2a-worker/adaptive-market-hunter.js
          grep -q 'const SCOUT_CONCURRENT_WAVE = 6' .lumen/a2a-worker/adaptive-market-hunter.js
          grep -q 'const MAX_CLOSERS_PER_CYCLE = 30' .lumen/a2a-worker/a2a-outreach.js
          grep -q 'const MAX_NEW_OUTREACH_24H = 120' .lumen/a2a-worker/a2a-outreach.js
          grep -q 'const DOMAIN_COOLDOWN_HOURS = 24' .lumen/a2a-worker/a2a-outreach.js
          echo 'LUMEN_SWARM_STATIC_GUARDRAILS=green'
          echo 'LUMEN_EVOLUTION_STATIC_GUARDRAILS=green'

      - name: Dry-run adaptive production bundle
        working-directory: .lumen/a2a-worker
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.evolution-dry-run.toml
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.evolution-dry-run.toml
          grep -q '^main = "adaptive-entry.js"$' wrangler.evolution-dry-run.toml
          npx --yes wrangler@4 deploy --dry-run --config wrangler.evolution-dry-run.toml

  evolve-production:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 'https://lumen-zero-a2a.lumen-b2b.workers.dev'
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      EVOLUTION_CYCLES_PER_DAY_TARGET: '12'
    steps:
      - name: Checkout LUMEN production source
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Production authority preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "EVOLUTION_TARGET_CYCLES_PER_DAY=$EVOLUTION_CYCLES_PER_DAY_TARGET"
          echo 'EVOLUTION_AUTONOMOUS_SPEND_USD=0'
          echo 'EVOLUTION_AUTONOMOUS_CONTRACT=false'
          echo 'EVOLUTION_AUTONOMOUS_PURCHASE=false'
          echo 'EVOLUTION_SELF_MODIFYING_CODE=false'

      - name: Deploy adaptive evolution plane
        id: deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .lumen/a2a-worker
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.evolution-production.toml
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.evolution-production.toml
          grep -q '^main = "adaptive-entry.js"$' wrangler.evolution-production.toml
          npx --yes wrangler@4 deploy --config wrangler.evolution-production.toml
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
          echo 'LUMEN_EVOLUTION_DEPLOY=success'

      - name: Verify live evolution plane and guardrails
        shell: bash
        run: |
          set -euo pipefail

          get_retry() {
            endpoint="$1"
            output="$2"
            for attempt in $(seq 1 15); do
              code=$(curl --show-error --silent --max-time 30 -o "$output" -w '%{http_code}' \
                -H 'cache-control: no-cache' "$BASE/$endpoint" || true)
              if [ "$code" = '200' ]; then
                return 0
              fi
              echo "VERIFY_RETRY endpoint=$endpoint attempt=$attempt http=$code"
              sleep 4
            done
            cat "$output" 2>/dev/null || true
            return 1
          }

          get_retry health /tmp/health.json
          get_retry growth-multiplier/policy /tmp/multiplier-policy.json
          get_retry growth-foundry/policy /tmp/foundry-policy.json
          get_retry growth/policy /tmp/growth-policy.json
          get_retry market-hunter/policy /tmp/scout-policy.json
          get_retry outreach/stats /tmp/closer-policy.json

          jq -e '.ok == true' /tmp/health.json >/dev/null
          jq -e '
            .ok == true and
            .guardrails.autonomousSpendUsd == 0 and
            .guardrails.autonomousPurchase == false and
            .guardrails.autonomousContract == false and
            .guardrails.createsExternalMessages == false and
            .guardrails.bindingActionsHumanGated == true and
            .guardrails.verifiedRevenueOnly == true and
            .guardrails.selfModifyingCode == false
          ' /tmp/multiplier-policy.json >/dev/null
          jq -e '
            .version == "2.0-scout-swarm" and
            .scoutSwarmTarget >= 120 and
            .maxQueriesPerRun >= 24 and
            .concurrentScoutWave >= 6 and
            .autonomousSpend == false and
            .autonomousPurchase == false and
            .autonomousContract == false and
            .bindingActionsHumanGated == true
          ' /tmp/scout-policy.json >/dev/null
          jq -e '
            .version == "2.3-qualified-outreach-idle-truth" and
            .closerCapacity >= 30 and
            .concurrentCloserWave >= 5 and
            .dailyNewOutreachCap == 120 and
            .domainCooldownHours == 24 and
            .autonomousOutgoingSpend == false and
            .autonomousContract == false
          ' /tmp/closer-policy.json >/dev/null
          jq -e '
            .ok == true and
            .guardrails.autonomousSpendUsd == 0 and
            .guardrails.autonomousPurchase == false and
            .guardrails.autonomousContract == false and
            .guardrails.createsExternalMessages == false and
            .guardrails.executesGeneratedCode == false and
            .guardrails.selfModifyingCode == false and
            .guardrails.maxConcurrentExperiments == 1 and
            .guardrails.bindingActionsHumanGated == true and
            .guardrails.verifiedRevenueOnly == true
          ' /tmp/foundry-policy.json >/dev/null

          echo 'LUMEN_EVOLUTION_LIVE_GUARDRAILS=green'

      - name: Execute one measured evolution cycle
        shell: bash
        run: |
          set -euo pipefail

          post() {
            endpoint="$1"
            output="$2"
            code=$(curl --show-error --silent --max-time 90 -o "$output" -w '%{http_code}' \
              -X POST "$BASE/$endpoint" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json' \
              -H 'cache-control: no-cache')
            echo "EVOLUTION_POST endpoint=$endpoint http=$code"
            cat "$output"; echo
            case "$code" in
              200|201|202|204) ;;
              *) return 1 ;;
            esac
            jq -e '.ok == true' "$output" >/dev/null
          }

          post growth-multiplier/run /tmp/multiplier-run.json
          post growth-foundry/run /tmp/foundry-run.json
          post growth/run /tmp/growth-run.json

          jq -e '
            .guardrails.autonomousSpendUsd == 0 and
            .guardrails.createsExternalMessages == false and
            .guardrails.executesGeneratedCode == false and
            .guardrails.selfModifyingCode == false and
            .guardrails.bindingActionsHumanGated == true
          ' /tmp/foundry-run.json >/dev/null

          echo 'LUMEN_EVOLUTION_CYCLE=success'

      - name: Activate and prove scout swarm
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --show-error --silent --max-time 120 -o /tmp/scout-run.json -w '%{http_code}'             -X POST "$BASE/market-hunter/run"             -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN"             -H 'accept: application/json'             -H 'cache-control: no-cache')
          echo "SCOUT_SWARM_RUN_HTTP=$code"
          cat /tmp/scout-run.json; echo
          case "$code" in 200|201|202|204) ;; *) exit 1 ;; esac
          jq -e '
            .version == "2.0-scout-swarm" and
            (.selectedStrategies | type == "array") and
            (.selectedStrategies | length) == 24 and
            .guardrails.scoutSwarmTarget >= 120 and
            .guardrails.concurrentScoutWave >= 6
          ' /tmp/scout-run.json >/dev/null
          echo 'LUMEN_SCOUT_SWARM_LIVE=green'
          echo 'LUMEN_SCOUTS_OUT_IN_MARKET=24_this_cycle'

      - name: Read live evolution evidence
        shell: bash
        run: |
          set -euo pipefail
          get() {
            endpoint="$1"
            output="$2"
            curl --fail --show-error --silent --max-time 30 \
              -H 'cache-control: no-cache' "$BASE/$endpoint" > "$output"
            echo "===== GET /$endpoint ====="
            cat "$output"; echo
          }

          get growth-multiplier/status /tmp/multiplier-status.json
          get growth-foundry/status /tmp/foundry-status.json
          get growth/status /tmp/growth-status.json
          get growth/history?limit=12 /tmp/growth-history.json
          get market-hunter/state /tmp/scout-state.json
          get outreach/stats /tmp/closer-state.json

          # Evolution truth: a green scheduler is not enough. Prove that LUMEN
          # retains strategy memory, evaluates mature cycles and exposes the
          # latest learned outcome/priority used by the next decision.
          jq -e '
            .initialized == true and
            (.memory | type == "array") and
            (.memory | length) >= 1 and
            (.memory | any((.evaluated_cycles // 0) >= 1))
          ' /tmp/growth-status.json >/dev/null
          jq -e '
            (.cycles | type == "array") and
            (.cycles | length) >= 1
          ' /tmp/growth-history.json >/dev/null

          learned_lane=$(jq -r '[.memory[] | select((.evaluated_cycles // 0) >= 1)] | sort_by(-(.learned_priority // 0)) | .[0].lane // "NONE"' /tmp/growth-status.json)
          learned_priority=$(jq -r '[.memory[] | select((.evaluated_cycles // 0) >= 1)] | sort_by(-(.learned_priority // 0)) | .[0].learned_priority // 0' /tmp/growth-status.json)
          learned_outcome=$(jq -r '[.memory[] | select((.evaluated_cycles // 0) >= 1)] | sort_by(-(.learned_priority // 0)) | .[0].last_outcome // "NONE"' /tmp/growth-status.json)
          current_lane=$(jq -r '.guidance.selected_lane // .latest.selected_lane // "NONE"' /tmp/growth-status.json)
          current_reason=$(jq -r '.guidance.reason // .latest.decision_reason // "NONE"' /tmp/growth-status.json)
          echo "LUMEN_EVOLUTION_LEARNED_LANE=$learned_lane"
          echo "LUMEN_EVOLUTION_LEARNED_PRIORITY=$learned_priority"
          echo "LUMEN_EVOLUTION_LEARNED_OUTCOME=$learned_outcome"
          echo "LUMEN_EVOLUTION_CURRENT_LANE=$current_lane"
          echo "LUMEN_EVOLUTION_CURRENT_REASON=$current_reason"
          echo 'LUMEN_EVOLUTION_MEMORY_PROOF=green'

          jq -e '.ok == true and .initialized == true and (.cycle | tonumber) >= 1' /tmp/multiplier-status.json >/dev/null
          jq -e '.ok == true and .initialized == true and (.cycle | tonumber) >= 1' /tmp/foundry-status.json >/dev/null
          jq -e '.guardrails.autonomousSpendUsd == 0 and .guardrails.bindingActionsHumanGated == true' /tmp/foundry-status.json >/dev/null
          jq -e '.initialized == true and .guardrails.autonomousOutgoingSpend == false and .guardrails.bindingActionsHumanGated == true' /tmp/growth-status.json >/dev/null

          verified_revenue=$(jq -r '.snapshot.B2B.verifiedRevenueUsd30d // 0' /tmp/multiplier-status.json)
          verified_settlements=$(jq -r '.snapshot.B2B.verifiedSettlements30d // 0' /tmp/multiplier-status.json)
          echo "LUMEN_EVOLUTION_VERIFIED_REVENUE_USD_30D=$verified_revenue"
          echo "LUMEN_EVOLUTION_VERIFIED_SETTLEMENTS_30D=$verified_settlements"
          jq -e '
            .version == "2.0-scout-swarm" and
            .totals.activeStrategies >= 120 and
            (.lastRun.selected | length) == 24
          ' /tmp/scout-state.json >/dev/null
          jq -e '
            .version == "2.3-qualified-outreach-idle-truth" and
            .closerCapacity >= 30 and
            .dailyNewOutreachCap == 120 and
            .domainCooldownHours == 24
          ' /tmp/closer-state.json >/dev/null
          echo "LUMEN_SCOUTS_ACTIVE=$(jq -r '.totals.activeStrategies' /tmp/scout-state.json)"
          echo "LUMEN_SCOUTS_LAST_CYCLE=$(jq -r '.lastRun.selected | length' /tmp/scout-state.json)"
          echo "LUMEN_CLOSER_CAPACITY=$(jq -r '.closerCapacity' /tmp/closer-state.json)"
          echo 'LUMEN_SWARM_RUNTIME=green'
          echo 'LUMEN_EVOLUTION_ENGINE=green_with_learning_proof'
          echo "EVOLUTION_TARGET_CYCLES_PER_DAY=$EVOLUTION_CYCLES_PER_DAY_TARGET"

      - name: Roll back adaptive plane if activation failed
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: .lumen/a2a-worker
        shell: bash
        run: |
          set -euo pipefail
          echo 'LUMEN_EVOLUTION_ROLLBACK=starting'
          npx --yes wrangler@4 rollback --name lumen-zero-a2a --message 'LUMEN Evolution Engine automatic rollback after failed activation'
          echo 'LUMEN_EVOLUTION_ROLLBACK=completed'
