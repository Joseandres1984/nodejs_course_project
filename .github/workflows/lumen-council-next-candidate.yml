name: LUMEN Council Next Candidate

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-council-next-candidate.yml'
  workflow_dispatch:

jobs:
  next-candidate:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Replace current failed council member once
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            -X POST "$BASE_URL/council-runtime/replace-failed" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/replace.json
          cat /tmp/replace.json
          echo
          jq -e '.ok == true and .replaced == true' /tmp/replace.json >/dev/null
          jq -r '.roomId' /tmp/replace.json > /tmp/room_id

      - name: Invite exactly one replacement candidate
        run: |
          set -euo pipefail
          room=$(cat /tmp/room_id)
          payload=$(jq -nc --arg room "$room" '{roomId:$room,forceGuest:true}')
          code=$(curl --show-error --silent --max-time 45 -o /tmp/invite.json -w '%{http_code}' \
            -X POST "$BASE_URL/council-runtime/invite-next" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d "$payload" || true)
          echo "invite HTTP $code"
          cat /tmp/invite.json
          echo
          test "$code" = '202'
          jq -e '.sent == true or .sent == false' /tmp/invite.json >/dev/null

      - name: Read council state
        if: always()
        run: |
          set -euo pipefail
          room=$(cat /tmp/room_id 2>/dev/null || true)
          echo '===== stats ====='
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/council-runtime/stats"
          echo
          if [ -n "$room" ]; then
            echo '===== room ====='
            curl --fail --show-error --silent --max-time 20 \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              "$BASE_URL/council-runtime/room?id=$room"
            echo
          fi
