name: LUMEN Trust Layer Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-trust-layer-smoke.yml'
  workflow_dispatch:

jobs:
  trust-layer-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Trust Layer v1
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/trust/stats" || true)
            echo "$body"
            if echo "$body" | grep -q '1.0-trust-layer'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Assess six partners with retry
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl --show-error --silent --max-time 90 -o /tmp/trust.json -w '%{http_code}' \
              -X POST "$BASE_URL/trust/recompute" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'content-type: application/json' \
              -d '{"limit":6}' || true)
            cat /tmp/trust.json 2>/dev/null || true
            echo
            if [ "$code" = '202' ] && grep -q '1.0-trust-layer' /tmp/trust.json; then break; fi
            sleep 3
          done
          jq -e '.ok == true and .version == "1.0-trust-layer" and .assessed >= 1 and .policy.unsignedCardsAllowed == true and .policy.verifiedSignaturesIncreaseTrust == true and .policy.presentButUnverifiedSignaturesDoNotClaimValidity == true and .policy.manipulationSignalsCanQuarantine == true and .policy.privateJwksHostsBlocked == true and .policy.autonomousSpend == false' /tmp/trust.json >/dev/null
          jq -e '[.results[] | select((.trustLevel != "ALLOW") and (.trustLevel != "CAUTION") and (.trustLevel != "RESTRICTED") and (.trustLevel != "QUARANTINE"))] | length == 0' /tmp/trust.json >/dev/null

      - name: Verify live trust state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/trust/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.0-trust-layer" and .totalAssessed >= 1 and .unsignedCardsAllowed == true and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null
