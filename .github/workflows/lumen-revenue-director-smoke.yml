name: LUMEN Revenue Director Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-revenue-director-smoke.yml'
  workflow_dispatch:

jobs:
  revenue-director-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Revenue Director v1.1 and Proposal Engine v1.3
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            policy=$(curl --show-error --silent --max-time 10 "$BASE_URL/revenue-director/policy" || true)
            proposal=$(curl --show-error --silent --max-time 10 "$BASE_URL/proposals/next" || true)
            echo "$policy"
            echo "$proposal"
            if echo "$policy" | grep -q '1.1-first-cash-revenue-director' && echo "$proposal" | grep -q '1.3-director-aware-proposal-engine'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify elite Director guardrails and response truth
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/revenue-director/policy" > /tmp/policy.json
          cat /tmp/policy.json
          echo
          jq -e '
            .version == "1.1-first-cash-revenue-director" and
            .objective == "maximize_probability_of_first_verified_settlement_with_bounded_reversible_tactics" and
            (.responseQualificationRule | contains("raw_response_is_not_commercial_intent")) and
            .selectionPriorityOnly == true and
            .priorityAdjustmentRange == [-4,8] and
            .addsExternalMessages == false and
            .autonomousPriceChange == false and
            .autonomousSpend == false and
            .autonomousContract == false and
            .bindingActionsHumanGated == true
          ' /tmp/policy.json >/dev/null

      - name: Recompute real first-cash strategy
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            -X POST "$BASE_URL/revenue-director/recompute" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/director.json
          cat /tmp/director.json
          echo
          jq -e '
            .ok == true and
            .version == "1.1-first-cash-revenue-director" and
            (.cycle >= 1) and
            (.preferredOffers | type) == "array" and
            (.focus | type) == "array" and
            ([.focus[] | select(.priorityAdjustment < -4 or .priorityAdjustment > 8)] | length) == 0 and
            (if ((.metrics.responded // 0) > 0 and (.metrics.qualifiedCommercialResponses // 0) == 0) then (.tactic == "QUALIFY_RESPONSE_OR_MOVE_ON" and .bottleneck == "response_qualification") else true end) and
            .guardrails.selectionPriorityOnly == true and
            .guardrails.rawResponseIsNotCommercialIntent == true and
            .guardrails.priorityAdjustmentRange == [-4,8] and
            .guardrails.priceChanges == false and
            .guardrails.externalMessagesAddedPerCycle == 0 and
            .guardrails.autonomousSpend == false and
            .guardrails.autonomousContract == false and
            .guardrails.bindingActionsHumanGated == true
          ' /tmp/director.json >/dev/null

      - name: Verify persisted Director state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/revenue-director/state" > /tmp/state.json
          cat /tmp/state.json
          echo
          jq -e '
            .version == "1.1-first-cash-revenue-director" and
            .initialized == true and
            (.cycle >= 1) and
            (.focus | length) >= 3 and
            ([.focus[] | select((.priority_adjustment|tonumber) < -4 or (.priority_adjustment|tonumber) > 8)] | length) == 0
          ' /tmp/state.json >/dev/null

      - name: Verify Proposal Engine consumes Director safely
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/proposals/next" > /tmp/proposal.json
          cat /tmp/proposal.json
          echo
          jq -e '.version == "1.3-director-aware-proposal-engine" and .guardrails.autonomousPriceChange == false and .guardrails.autonomousOutgoingSpend == false and .guardrails.autonomousContract == false and .guardrails.bindingActionsHumanGated == true' /tmp/proposal.json >/dev/null

      - name: Prepare safe Revenue Director snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/revenue-director
          jq '{version,cycle,verifiedProgress,noProgressCycles,bottleneck,tactic,targetMetric,preferredOffers,reason,metrics,focus,guardrails}' /tmp/director.json > /tmp/revenue-director/director.json
          jq '{version,initialized,updatedAt,cycle,noProgressCycles,bottleneck,tactic,targetMetric,metrics,preferredOffers,focus}' /tmp/state.json > /tmp/revenue-director/state.json
          jq '{version,proposal:{offerId:.proposal.offerId,amountUsd:.proposal.amountUsd,status:.proposal.status,qualityGateStatus:.proposal.qualityGateStatus,metadata:.proposal.metadata.revenue_director},guardrails}' /tmp/proposal.json > /tmp/revenue-director/proposal.json

      - name: Upload safe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: revenue-director-snapshot
          path: /tmp/revenue-director
          retention-days: 1
