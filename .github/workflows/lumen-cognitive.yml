name: LUMEN Cognitive Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-cognitive.yml"

permissions:
  contents: read

concurrency:
  group: lumen-cognitive-deploy
  cancel-in-progress: true

jobs:
  deploy-cognitive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      SHADOW_URL: "https://lumen-zero-cognitive-shadow.lumen-b2b.workers.dev"
      OLD_PUBLIC_URL: "https://lumen-zero-cognitive.lumen-b2b.workers.dev"
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Worker syntax
        working-directory: .lumen/cognitive-worker
        run: node --check worker.js

      - name: Deploy private Cognitive Worker
        working-directory: .lumen/cognitive-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify cognitive engine through Service Binding
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..15}; do
            code=$(curl -sS -H 'cache-control: no-cache' -o /tmp/shadow-health.json -w '%{http_code}' "$SHADOW_URL/health?cognitive_deploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i" || true)
            version=$(jq -r '.cognitive.version // ""' /tmp/shadow-health.json 2>/dev/null || true)
            model=$(jq -r '.cognitive.model // ""' /tmp/shadow-health.json 2>/dev/null || true)
            echo "SERVICE_BINDING_ATTEMPT=$i HTTP=$code VERSION=$version MODEL=$model"
            if [[ "$code" == "200" && "$version" == "1.1-zero-cognitive-engine" && "$model" == "@cf/google/gemma-4-26b-a4b-it" ]]; then
              ok=1
              break
            fi
            sleep 4
          done
          [[ "$ok" == "1" ]]
          cat /tmp/shadow-health.json
          jq -e '
            .ok == true and
            .mode == "shadow_only" and
            .cognitive.connected == true and
            .cognitive.version == "1.1-zero-cognitive-engine" and
            .cognitive.model == "@cf/google/gemma-4-26b-a4b-it" and
            .cognitive.paid_ai_allowed == false and
            .cognitive.monetary_budget_usd == 0 and
            .cognitive.outgoing_spend_enabled == false and
            .actions_executed == false and
            .outgoing_spend_enabled == false and
            .governor_required == true
          ' /tmp/shadow-health.json >/dev/null

      - name: Prove private Workers AI reasoning through LUMEN
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -X POST -o /tmp/private-ai-canary.json -w '%{http_code}' "$SHADOW_URL/canary")
          echo "PRIVATE_AI_CANARY_HTTP=$code"
          cat /tmp/private-ai-canary.json
          [[ "$code" == "200" ]]
          jq -e '
            .ok == true and
            .stored == true and
            .provider == "cloudflare_ai" and
            .model == "@cf/google/gemma-4-26b-a4b-it" and
            .mode == "shadow_only" and
            .paid_ai_used == false and
            .monetary_cost_usd == 0 and
            .actions_executed == false and
            .outgoing_spend_enabled == false and
            .governor_required == true
          ' /tmp/private-ai-canary.json >/dev/null

      - name: Verify direct cognitive workers.dev route is closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/old-public-body.txt -w '%{http_code}' "$OLD_PUBLIC_URL/health?private_check=${GITHUB_RUN_ID}" || true)
          echo "DIRECT_COGNITIVE_PUBLIC_HTTP=$code"
          if [[ "$code" == "200" ]]; then
            echo "ERROR: cognitive engine is still publicly reachable"
            cat /tmp/old-public-body.txt || true
            exit 1
          fi
          echo "COGNITIVE_PRIVATE_ROUTE=success"

      - name: Zero-cost policy summary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SHADOW_URL/health" -o /tmp/final-health.json
          jq -e '
            .cognitive.connected == true and
            .cognitive.paid_ai_allowed == false and
            .cognitive.monetary_budget_usd == 0 and
            .actions_executed == false and
            .outgoing_spend_enabled == false
          ' /tmp/final-health.json >/dev/null
          echo "LUMEN_PRIVATE_COGNITIVE_ZERO_COST_CANARY=success"
