name: LUMEN Cognitive Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-cognitive.yml"

permissions:
  contents: read

concurrency:
  group: lumen-cognitive-deploy
  cancel-in-progress: true

jobs:
  deploy-cognitive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing Cloudflare deployment credentials"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy Cognitive Worker
        working-directory: .lumen/cognitive-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify hard-zero health policy
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-cognitive.lumen-b2b.workers.dev'
          ok=0
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/cognitive-health.json -w '%{http_code}' "$base/health" || true)
            echo "HEALTH_ATTEMPT=$i HTTP=$code"
            if [[ "$code" == "200" ]]; then ok=1; break; fi
            sleep 4
          done
          [[ "$ok" == "1" ]]
          cat /tmp/cognitive-health.json
          jq -e '
            .status == "ok" and
            .primary_provider == "cloudflare_ai" and
            .ai_binding_available == true and
            .paid_ai_allowed == false and
            .monetary_budget_usd == 0 and
            .paid_ai_used == false and
            .outgoing_spend_enabled == false and
            .actions_executed == false and
            .governor_required == true and
            .free_guard.cloudflare_calls_per_utc_day <= 50
          ' /tmp/cognitive-health.json >/dev/null

      - name: Prove Workers AI reasoning without side effects
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-cognitive.lumen-b2b.workers.dev'
          cat >/tmp/cognitive-ai.json <<'JSON'
          {
            "task":"sales_triage",
            "technical_canary":true,
            "subject":{
              "company":"LUMEN Canary Industrial",
              "country":"Argentina",
              "sector":"industrial pumps",
              "signals":[
                "The company published a new export page",
                "The page explicitly mentions looking for distributors in Chile"
              ],
              "history":{"contacted":false,"recent_contact":false}
            },
            "context":{"instruction":"Choose the best LUMEN microproduct using only these facts."}
          }
          JSON
          code=$(curl -sS -o /tmp/cognitive-ai-out.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/cognitive-ai.json "$base/decide")
          echo "AI_CANARY_HTTP=$code"
          cat /tmp/cognitive-ai-out.json
          [[ "$code" == "200" ]]
          jq -e '
            .provider == "cloudflare_ai" and
            .model == "@cf/zai-org/glm-4.7-flash" and
            (.decision | IN("contact","research","hold","prioritize")) and
            (.priority | IN("low","medium","high")) and
            (.confidence >= 0 and .confidence <= 1) and
            .paid_ai_used == false and
            .monetary_cost_usd == 0 and
            .actions_executed == false and
            .governor_required == true and
            .outgoing_spend_enabled == false
          ' /tmp/cognitive-ai-out.json >/dev/null

      - name: Prove deterministic fallback
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-cognitive.lumen-b2b.workers.dev'
          cat >/tmp/cognitive-det.json <<'JSON'
          {
            "task":"sales_triage",
            "technical_canary":true,
            "use_ai":false,
            "subject":{
              "company":"Fallback Canary",
              "signals":["needs supplier sourcing for an industrial component"]
            }
          }
          JSON
          code=$(curl -sS -o /tmp/cognitive-det-out.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/cognitive-det.json "$base/decide")
          echo "DETERMINISTIC_CANARY_HTTP=$code"
          cat /tmp/cognitive-det-out.json
          [[ "$code" == "200" ]]
          jq -e '
            .provider == "deterministic" and
            .paid_ai_used == false and
            .monetary_cost_usd == 0 and
            .actions_executed == false and
            .outgoing_spend_enabled == false
          ' /tmp/cognitive-det-out.json >/dev/null

      - name: Verify daily free guard advanced safely
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-cognitive.lumen-b2b.workers.dev'
          curl -sS "$base/health" -o /tmp/cognitive-health-after.json
          cat /tmp/cognitive-health-after.json
          jq -e '
            .usage_today.cf_calls >= 1 and
            .usage_today.cf_calls <= .free_guard.cloudflare_calls_per_utc_day and
            .paid_ai_allowed == false and
            .monetary_budget_usd == 0
          ' /tmp/cognitive-health-after.json >/dev/null
          echo "LUMEN_COGNITIVE_ZERO_COST_CANARY=success"
