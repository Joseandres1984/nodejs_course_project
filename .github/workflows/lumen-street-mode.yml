name: LUMEN Street Mode

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lumen-street-mode.yml'

permissions:
  contents: read

concurrency:
  group: lumen-street-mode
  cancel-in-progress: false

jobs:
  hunt-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: 'https://lumen-zero-a2a.lumen-b2b.workers.dev'
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}

    steps:
      - name: Verify production and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          curl --fail --show-error --silent --max-time 30 "$BASE/health" >/tmp/health.json
          cat /tmp/health.json
          echo
          echo 'STREET_MODE_AUTHORITY=non-binding-commercial-outreach-only'
          echo 'AUTONOMOUS_SPEND_USD=0'
          echo 'AUTONOMOUS_CONTRACT=false'

      - name: Run Street Mode commercial cycle
        id: street
        shell: bash
        run: |
          set -euo pipefail

          post() {
            local endpoint="$1"
            local endpoint_path="${endpoint%%\?*}"
            local body="/tmp/${endpoint_path//\//-}.json"
            local code
            code=$(curl --show-error --silent --connect-timeout 10 --max-time 35 --retry 2 --retry-delay 2 --retry-all-errors -o "$body" -w '%{http_code}' \
              -X POST "$BASE/$endpoint" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json' \
              -H 'cache-control: no-cache' || true)
            echo "===== POST /$endpoint HTTP $code ====="
            cat "$body"; echo
            case "$code" in
              200|201|202|204) ;;
              *) echo "endpoint_failed:$endpoint:$code"; return 1 ;;
            esac
          }

          post outreach/poll || true
          post source-intelligence/cycle || true
          post market-hunter/run || true
          post tender-match/run || true
          post commercial/reassess || true
          post revenue-loop-v5/run || true
          # Copy-only rescue of a current actionable draft. No sending, price changes, or bypassed gates.
          post quality/repair-focused || true

          consumed=false
          hot_consumed=false
          for endpoint in first-cash/run commercial-reply/run followup/run; do
            body="/tmp/${endpoint//\//-}.json"
            post "$endpoint" || continue
            if jq -e '(.sent == true) or (.externalAttempted == true) or (.attempted == true) or (.status == "SEND_FAILED") or (.send.sent == true) or (.send.externalAttempted == true) or (.send.status == "SEND_FAILED")' "$body" >/dev/null 2>&1; then
              consumed=true
              hot_consumed=true
              echo "HOT_LANE_SLOT_CONSUMED_BY=$endpoint"
              break
            fi
          done

          ready_probes=0
          # Controlled owner-authorized intervention: reserve one of the ten total prospect slots
          # for the explicit-demand email fallback in LUMEN Zero. Street Mode may consume at most nine.
          for attempt in $(seq 1 9); do
            echo "===== CLOSER SWARM PROSPECT ROTATION $attempt/9 ====="
            post proposals/prepare-top || continue
            post quality/review-next || continue
            post outreach/probe-next || continue
            probe='/tmp/outreach-probe-next.json'
            if jq -e '.status == "READY"' "$probe" >/dev/null 2>&1; then
              ready_probes=$((ready_probes + 1))
              echo "CLOSER_SWARM_READY_PROBES=$ready_probes"
            fi
            if [ "$ready_probes" -ge 9 ]; then
              break
            fi
          done

          # Keep the complete controlled intervention <=10 prospects: one slot is reserved for
          # the explicit-demand email rescue. If a hot lane already used a Street Mode slot,
          # subtract it from the A2A batch as well.
          batch_limit=9
          if [ "$hot_consumed" = 'true' ]; then
            batch_limit=8
          fi
          rm -f /tmp/outreach-send-batch.json
          post "outreach/send-batch?limit=$batch_limit" || true
          batch='/tmp/outreach-send-batch.json'
          batch_attempted=$(jq -r '.attempted // 0' "$batch" 2>/dev/null || echo 0)
          batch_reason=$(jq -r '.reason // ""' "$batch" 2>/dev/null || echo "")
          batch_sent=$(jq -r '.sent // 0' "$batch" 2>/dev/null || echo 0)
          batch_failed=$(jq -r '.failed // 0' "$batch" 2>/dev/null || echo 0)
          if [ "$batch_attempted" -gt 0 ]; then
            consumed=true
          fi
          if [ "$batch_failed" -gt 0 ] && [ "$batch_sent" -eq 0 ]; then
            echo "::warning::Commercial delivery failed: $batch_failed attempts failed and no message was sent. Do not treat this as successful outreach."
            echo "STREET_MODE_DELIVERY=failed"
          elif [ "$batch_sent" -gt 0 ]; then
            echo "STREET_MODE_DELIVERY=sent_unverified_receipt"
          else
            echo "STREET_MODE_DELIVERY=no_batch_send"
          fi
          safe_idle=false
          if [ "$consumed" != 'true' ] && [ "$batch_attempted" -eq 0 ] && [ "$batch_reason" = 'no_current_eligible_target_after_dedupe_cooldown' ]; then
            safe_idle=true
          fi
          echo "CLOSER_SWARM_BATCH attempted=$batch_attempted sent=$batch_sent failed=$batch_failed ready_probes=$ready_probes"
          echo "CLOSER_SWARM_ELIGIBILITY_REASON=$batch_reason"
          echo "HOT_LANE_CONSUMED=$hot_consumed"
          echo "STREET_MODE_EXTERNAL_SLOT_CONSUMED=$consumed"
          echo "batch_sent=$batch_sent" >> "$GITHUB_OUTPUT"
          echo "batch_failed=$batch_failed" >> "$GITHUB_OUTPUT"
          echo "STREET_MODE_SAFE_IDLE=$safe_idle"
          echo "external_slot_consumed=$consumed" >> "$GITHUB_OUTPUT"
          echo "safe_idle=$safe_idle" >> "$GITHUB_OUTPUT"
          post outreach/poll || true
          post revenue-loop-v5/run || true

      - name: Read closing evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          get() {
            local endpoint="$1"
            echo "===== GET /$endpoint ====="
            curl --fail --show-error --silent --max-time 30 \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'cache-control: no-cache' \
              "$BASE/$endpoint" || \
            curl --fail --show-error --silent --max-time 30 \
              -H 'cache-control: no-cache' \
              "$BASE/$endpoint"
            echo
          }

          get revenue-loop-v5/status
          get first-settlement/status
          get outreach/stats
          get outreach/next
          get commercial/stats
          get tender-match/state
          get commercial/next
          get first-cash/stats
          get followup/stats
          get portfolio-governor/state

          echo 'LUMEN_STREET_MODE_CYCLE_OK'

      - name: Enforce commercial effectiveness
        if: always()
        shell: bash
        env:
          EXTERNAL_SLOT_CONSUMED: ${{ steps.street.outputs.external_slot_consumed }}
          SAFE_IDLE: ${{ steps.street.outputs.safe_idle }}
          BATCH_SENT: ${{ steps.street.outputs.batch_sent }}
          BATCH_FAILED: ${{ steps.street.outputs.batch_failed }}
        run: |
          set -euo pipefail
          if [ "${BATCH_FAILED:-0}" -gt 0 ] && [ "${BATCH_SENT:-0}" -eq 0 ]; then
            echo "::error::All batch delivery attempts failed. External attempts are not successful outreach."
            echo "LUMEN_STREET_MODE_EFFECTIVENESS=degraded_delivery_failed"
            exit 1
          fi
          if [ "${EXTERNAL_SLOT_CONSUMED:-false}" = 'true' ]; then
            echo 'LUMEN_STREET_MODE_EFFECTIVENESS=external_attempt_unverified_revenue'
            exit 0
          fi
          if [ "${SAFE_IDLE:-false}" = 'true' ]; then
            echo 'LUMEN_STREET_MODE_EFFECTIVENESS=safe_idle_no_eligible_target'
            echo 'LUMEN_STREET_MODE_ANTI_SPAM=protected'
            exit 0
          fi
          echo "::error::Street Mode ended without an external attempt and without a verified no-eligible-target state."
          exit 1
