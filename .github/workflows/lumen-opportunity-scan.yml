name: LUMEN Opportunity Scan

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-opportunity-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected opportunity scan
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPPORTUNITY_ADMIN_TOKEN:-}" ]; then
            echo 'OPPORTUNITY_ADMIN_TOKEN_MISSING'
            exit 2
          fi
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          body='/tmp/run.json'
          code=$(curl --show-error --silent --max-time 60 -o "$body" -w '%{http_code}' \
            -X POST "$base/opportunities/run" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json')
          echo "===== manual scan HTTP $code ====="
          cat "$body"
          echo
          if [ "$code" != '202' ]; then
            exit 1
          fi

      - name: Read opportunity stats
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '===== /opportunities/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/opportunities/stats"
          echo
          echo '===== /opportunities/next ====='
          curl --fail --show-error --silent --max-time 30 "$base/opportunities/next"
          echo
