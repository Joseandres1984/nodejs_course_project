name: LUMEN Entrepreneur Mode Smoke
# rerun entrepreneur: 2026-10-07 verify hard-pivot selects a fresh strategy

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/entrepreneur-mode.js'
      - '.lumen/a2a-worker/unified-economic-brain-v1.js'
      - '.lumen/a2a-worker/test-unified-economic-brain-v1.mjs'
      - '.lumen/a2a-worker/test-entrepreneur-role-council.mjs'
      - '.lumen/a2a-worker/opportunity-entry.js'
      - '.github/workflows/lumen-entrepreneur-mode-smoke.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/entrepreneur-mode.js'
      - '.lumen/a2a-worker/opportunity-entry.js'
      - '.github/workflows/lumen-entrepreneur-mode-smoke.yml'
  workflow_dispatch:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate entrepreneur source and wiring
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/entrepreneur-mode.js
          node --check .lumen/a2a-worker/unified-economic-brain-v1.js
          node .lumen/a2a-worker/test-unified-economic-brain-v1.mjs
          node .lumen/a2a-worker/test-entrepreneur-role-council.mjs
          node --check .lumen/a2a-worker/opportunity-entry.js
          grep -q 'handleEntrepreneurMode' .lumen/a2a-worker/opportunity-entry.js
          grep -q 'runEntrepreneurMode' .lumen/a2a-worker/opportunity-entry.js
          grep -q 'getUTCMinutes() === 22' .lumen/a2a-worker/opportunity-entry.js
          grep -q 'businessModelsOpenEnded:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'huntBeforeDecision:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'stalledStrategyPivot:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'verifiedWinnerCompounding:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'KILL_STALLED_STRATEGIES' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'autonomousSpendUsd:0' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'multiRoleCouncil:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'roleCouncilNoChainOfThought:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'roleRecommendationsDoNotGrantExternalAuthority:true' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'INTERNAL_RECOMMENDATION_ONLY' .lumen/a2a-worker/entrepreneur-mode.js
          grep -q 'maxExternalMessagesAddedByEntrepreneurMode:0' .lumen/a2a-worker/entrepreneur-mode.js
          echo ENTREPRENEUR_MODE_SOURCE_OK

  live-smoke:
    if: github.event_name != 'pull_request'
    needs: source-validation
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Wait for production entrepreneur endpoint
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            if curl --fail --show-error --silent --max-time 15 "$BASE_URL/entrepreneur/policy" -o /tmp/policy.json; then
              if jq -e '.version == "1.2-entrepreneur-role-council" and .autonomousSpendUsd == 0 and .autonomousExternalPublish == false and .bindingActionsHumanGated == true' /tmp/policy.json >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          cat /tmp/policy.json

      - name: Run one entrepreneur cycle
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          ready=0
          for attempt in $(seq 1 18); do
            code=$(curl --show-error --silent --max-time 90 -o /tmp/run.json -w '%{http_code}'               -X POST "$BASE_URL/entrepreneur/run?rollout=$GITHUB_SHA&attempt=$attempt"               -H "x-lumen-admin: $ADMIN_TOKEN"               -H 'cache-control: no-cache'               -H 'content-type: application/json' -d '{}')
            echo "ENTREPRENEUR_HTTP=$code ATTEMPT=$attempt"
            cat /tmp/run.json; echo
            if [ "$code" = '202' ] && jq -e '
              .ok == true and
              .version == "1.2-entrepreneur-role-council" and
              .mission.businessModel != null and
              .mission.hypothesis != null and
              .cashSprint.pressure != null and
              .cashSprint.strategyDisposition != null and
              (.roleCouncil.roles | length) == 5 and
              .roleCouncil.consensus.executionBoundary == "INTERNAL_RECOMMENDATION_ONLY" and
              .roleCouncil.consensus.smallestTest != null and
              .roleCouncil.consensus.successMetric != null and
              .roleCouncil.consensus.killCondition != null and
              .actionBoundary.huntRunsBeforeEconomicDecision == true and
              .actionBoundary.maxExternalMessagesAddedByEntrepreneurMode == 0 and
              .actionBoundary.autonomousSpendUsd == 0 and
              .actionBoundary.autonomousContract == false and
              .actionBoundary.autonomousPriceMutation == false and
              (.revenueTruth.verifiedRevenueUsd | type) == "number"
            ' /tmp/run.json >/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" -eq 1

      - name: Read persisted entrepreneur state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45             -H "x-lumen-admin: $ADMIN_TOKEN"             "$BASE_URL/entrepreneur/status" -o /tmp/status.json
          cat /tmp/status.json; echo
          jq -e '
            .ok == true and
            .totals.cycles >= 1 and
            .latest.selected_lane != null and
            .policy.verifiedRevenueTruth == "settled_or_provider_verified_payout_only"
          ' /tmp/status.json >/dev/null
