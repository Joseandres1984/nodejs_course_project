name: LUMEN Email Fallback

on:
  pull_request:
    paths:
      - '.lumen/email-fallback-worker/**'
      - '.github/workflows/lumen-email-fallback-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/email-fallback-worker/**'
      - '.github/workflows/lumen-email-fallback-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check isolated fallback worker
        run: |
          node --check .lumen/email-fallback-worker/worker.js
          node --check .lumen/email-fallback-worker/provider-entry.js
      - name: Verify guardrails are present
        run: |
          set -euo pipefail
          grep -q 'EMAIL_FALLBACK_REQUIRE_A2A_FAILURE = "true"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'EMAIL_FALLBACK_MAX_PER_RUN = "1"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'main = "provider-entry.js"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'publicCorporateRoleEmailsOnly: true' .lumen/email-fallback-worker/worker.js
          grep -q 'personalEmailInference: false' .lumen/email-fallback-worker/worker.js
          grep -q 'publicProcurementSolicitation: false' .lumen/email-fallback-worker/worker.js
          grep -q 'maxMessagesPerRun: 1' .lumen/email-fallback-worker/worker.js
          grep -q 'probe_message_sent: false' .lumen/email-fallback-worker/provider-entry.js
          echo 'EMAIL_FALLBACK_STATIC_GUARDRAILS_OK'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare and admin credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}"
          test -n "${CF_ACCOUNT:-}"
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          echo 'EMAIL_FALLBACK_INFRA_CREDENTIALS_PRESENT'
      - name: Verify Brevo sender without sending mail
        env:
          BREVO_API_KEY: ${{ secrets.LUMEN_BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.LUMEN_BREVO_FROM_EMAIL }}
        run: |
          set -euo pipefail
          test -n "${BREVO_API_KEY:-}"
          test -n "${BREVO_FROM_EMAIL:-}"
          curl --fail-with-body --show-error --silent --max-time 25 \
            'https://api.brevo.com/v3/account' \
            -H 'accept: application/json' \
            -H "api-key: ${BREVO_API_KEY}" >/tmp/brevo-account.json
          curl --fail-with-body --show-error --silent --max-time 25 \
            'https://api.brevo.com/v3/senders' \
            -H 'accept: application/json' \
            -H "api-key: ${BREVO_API_KEY}" >/tmp/brevo-senders.json
          jq -e --arg email "$BREVO_FROM_EMAIL" \
            '.senders[]? | select(((.email // "") | ascii_downcase) == ($email | ascii_downcase) and (.active == true))' \
            /tmp/brevo-senders.json >/dev/null
          echo 'EMAIL_FALLBACK_BREVO_SENDER_ACTIVE'
      - name: Deploy isolated fallback worker
        working-directory: .lumen/email-fallback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Restore protected secrets
        working-directory: .lumen/email-fallback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
          BREVO_API_KEY: ${{ secrets.LUMEN_BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.LUMEN_BREVO_FROM_EMAIL }}
        run: |
          set -euo pipefail
          printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
          printf '%s' "$BREVO_API_KEY" | npx --yes wrangler@latest secret put LUMEN_BREVO_API_KEY --config wrangler.toml
          printf '%s' "$BREVO_FROM_EMAIL" | npx --yes wrangler@latest secret put LUMEN_BREVO_FROM_EMAIL --config wrangler.toml
          printf '%s' 'true' | npx --yes wrangler@latest secret put LUMEN_BREVO_SENDER_VERIFIED --config wrangler.toml
      - name: Smoke test policy and provider health without sending mail
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-email-fallback.lumen-b2b.workers.dev'
          for i in $(seq 1 15); do
            if curl -fsS --max-time 15 "$BASE/policy" -o policy.json && curl -fsS --max-time 20 "$BASE/health" -o health.json; then
              if jq -e '.version == "1.0-guarded-corporate-email-fallback" and .a2aFailureRequired == true and .verifiedCorporateRoleEmailOnly == true and .personalEmailInference == false and .generatedEmailGuessing == false and .freeMailDomainsAllowed == false and .maxExternalMessagesPerRun == 1 and .autonomousSpendUsd == 0' policy.json >/dev/null \
                && jq -e '.configured == true and .mailHealth.fresh == true and .mailHealth.outboundLive == true' health.json >/dev/null; then
                cat policy.json; echo
                cat health.json; echo
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'EMAIL_FALLBACK_SMOKE_FAILED'
          cat policy.json 2>/dev/null || true; echo
          cat health.json 2>/dev/null || true; echo
          exit 1
