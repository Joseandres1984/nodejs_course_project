name: LUMEN Email Fallback

on:
  pull_request:
    paths:
      - '.lumen/email-fallback-worker/**'
      - '.github/workflows/lumen-email-fallback-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/email-fallback-worker/**'
      - '.github/workflows/lumen-email-fallback-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check isolated fallback worker
        run: node --check .lumen/email-fallback-worker/smtp-worker.js
      - name: Verify guardrails are present
        run: |
          set -euo pipefail
          grep -q 'EMAIL_FALLBACK_REQUIRE_A2A_FAILURE = "true"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'EMAIL_FALLBACK_MAX_PER_RUN = "1"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'main = "smtp-worker.js"' .lumen/email-fallback-worker/wrangler.toml
          grep -q 'publicCorporateRoleEmailsOnly: true' .lumen/email-fallback-worker/smtp-worker.js
          grep -q 'personalEmailInference: false' .lumen/email-fallback-worker/smtp-worker.js
          grep -q 'generatedEmailGuessing: false' .lumen/email-fallback-worker/smtp-worker.js
          grep -q 'publicProcurementSolicitation: false' .lumen/email-fallback-worker/smtp-worker.js
          grep -q 'maxMessagesPerHour: 1' .lumen/email-fallback-worker/smtp-worker.js
          grep -q 'autonomousSpendUsd: 0' .lumen/email-fallback-worker/smtp-worker.js
          echo 'EMAIL_FALLBACK_STATIC_GUARDRAILS_OK'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare and admin credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}"
          test -n "${CF_ACCOUNT:-}"
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          echo 'EMAIL_FALLBACK_INFRA_CREDENTIALS_PRESENT'
      - name: Authenticate SMTP without sending
        env:
          SMTP_HOST: ${{ secrets.LUMEN_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.LUMEN_SMTP_PORT }}
          SMTP_USER: ${{ secrets.LUMEN_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.LUMEN_SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.LUMEN_SMTP_SSL }}
        run: |
          set -euo pipefail
          test -n "${SMTP_HOST:-}"
          test -n "${SMTP_USER:-}"
          test -n "${SMTP_PASSWORD:-}"
          python - <<'PY'
          import os, smtplib, ssl
          host=os.environ['SMTP_HOST'].strip()
          port=int((os.getenv('SMTP_PORT') or '587').strip() or '587')
          if port not in (465,587):
              raise SystemExit('SMTP_PORT_MUST_BE_465_OR_587')
          use_ssl=port == 465 or (os.getenv('SMTP_SSL') or 'false').lower() == 'true'
          if use_ssl:
              client=smtplib.SMTP_SSL(host,port,timeout=20,context=ssl.create_default_context())
          else:
              client=smtplib.SMTP(host,port,timeout=20)
              client.ehlo(); client.starttls(context=ssl.create_default_context()); client.ehlo()
          client.login(os.environ['SMTP_USER'],os.environ['SMTP_PASSWORD'])
          client.quit()
          print('EMAIL_FALLBACK_SMTP_AUTH_OK_NO_MESSAGE_SENT')
          PY
      - name: Deploy isolated fallback worker
        working-directory: .lumen/email-fallback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Restore protected secrets
        working-directory: .lumen/email-fallback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
          SMTP_HOST: ${{ secrets.LUMEN_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.LUMEN_SMTP_PORT }}
          SMTP_USER: ${{ secrets.LUMEN_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.LUMEN_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.LUMEN_SMTP_FROM }}
          SMTP_SSL: ${{ secrets.LUMEN_SMTP_SSL }}
        run: |
          set -euo pipefail
          SMTP_PORT="${SMTP_PORT:-587}"
          SMTP_FROM="${SMTP_FROM:-$SMTP_USER}"
          SMTP_SSL="${SMTP_SSL:-false}"
          printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
          printf '%s' "$SMTP_HOST" | npx --yes wrangler@latest secret put LUMEN_SMTP_HOST --config wrangler.toml
          printf '%s' "$SMTP_PORT" | npx --yes wrangler@latest secret put LUMEN_SMTP_PORT --config wrangler.toml
          printf '%s' "$SMTP_USER" | npx --yes wrangler@latest secret put LUMEN_SMTP_USER --config wrangler.toml
          printf '%s' "$SMTP_PASSWORD" | npx --yes wrangler@latest secret put LUMEN_SMTP_PASSWORD --config wrangler.toml
          printf '%s' "$SMTP_FROM" | npx --yes wrangler@latest secret put LUMEN_SMTP_FROM --config wrangler.toml
          printf '%s' "$SMTP_SSL" | npx --yes wrangler@latest secret put LUMEN_SMTP_SSL --config wrangler.toml
      - name: Smoke test policy and SMTP health without sending mail
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-email-fallback.lumen-b2b.workers.dev'
          for i in $(seq 1 15); do
            if curl -fsS --max-time 15 "$BASE/policy" -o policy.json && curl -fsS --max-time 30 "$BASE/health" -o health.json; then
              if jq -e '.version == "1.0-guarded-smtp-corporate-email-fallback" and .provider == "smtp_tls" and .configured == true and .a2aFailureRequired == true and .publicCorporateRoleEmailsOnly == true and .personalEmailInference == false and .generatedEmailGuessing == false and .freeMailDomainsAllowed == false and .maxMessagesPerHour == 1 and .autonomousSpendUsd == 0' policy.json >/dev/null \
                && jq -e '.version == "1.0-guarded-smtp-corporate-email-fallback" and .configured == true and .authenticated == true' health.json >/dev/null; then
                cat policy.json; echo
                cat health.json; echo
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'EMAIL_FALLBACK_SMOKE_FAILED'
          cat policy.json 2>/dev/null || true; echo
          cat health.json 2>/dev/null || true; echo
          exit 1
