name: CalculaFácil PRO — audit secret presence only

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/calculafacil-mp-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-current-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Mercado Pago secret name without reading value
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" && test -n "${CF_ACCOUNT:-}"
          status=$(curl -sS --max-time 20 -o /tmp/mp-worker-secrets.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/calculafacil-pro-fulfillment/secrets" || true)
          if [[ "$status" != "200" ]]; then
            echo "SECRET_LIST_PERMISSION_OR_API_ERROR_HTTP=$status"
            exit 2
          fi
          if ! jq -e '.success==true and (.result | type=="array")' /tmp/mp-worker-secrets.json >/dev/null; then
            echo 'SECRET_LIST_API_UNEXPECTED_RESPONSE'
            exit 2
          fi
          echo "MP_ACCESS_TOKEN_PRESENT=$(jq -r '[.result[].name] | index("MP_ACCESS_TOKEN") != null' /tmp/mp-worker-secrets.json)"
          echo "DOWNLOAD_SIGNING_KEY_PRESENT=$(jq -r '[.result[].name] | index("DOWNLOAD_SIGNING_KEY") != null' /tmp/mp-worker-secrets.json)"
          if jq -e '[.result[].name] | index("MP_ACCESS_TOKEN") != null' /tmp/mp-worker-secrets.json >/dev/null; then
            echo 'MERCADOPAGO_SECRET_IS_REGISTERED'
          else
            echo 'MERCADOPAGO_SECRET_NOT_REGISTERED'
            exit 1
          fi
      - name: Confirm public private-file health (no download)
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/fulfillment-health.json -w '%{http_code}' \
            'https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev/health' || true)
          if [[ "$status" != "200" ]]; then
            echo "HEALTH_HTTP=$status"
            exit 2
          fi
          jq -c '{privateWorkbookPresent, enabled, ready, storagePrivate}' /tmp/fulfillment-health.json
          jq -e '.privateWorkbookPresent == true and .enabled == false and .ready == false and .storagePrivate == true' /tmp/fulfillment-health.json >/dev/null
