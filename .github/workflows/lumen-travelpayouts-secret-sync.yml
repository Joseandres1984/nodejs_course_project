name: LUMEN Travelpayouts secret sync

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-travelpayouts-secret-sync.yml'
      - '.lumen/a2a-worker/wrangler.toml'
      - '.lumen/a2a-worker/travel-external-providers.js'
  workflow_dispatch:

jobs:
  sync-travelpayouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          test -n "$TRAVELPAYOUTS_API_TOKEN"
          echo 'TRAVELPAYOUTS_SECRET_SYNC_INPUTS_PRESENT'
      - name: Sync Travelpayouts API token to Cloudflare Worker
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: |
          set -euo pipefail
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.toml
          printf '%s' "$TRAVELPAYOUTS_API_TOKEN" | npx --yes wrangler@latest secret put TRAVELPAYOUTS_API_TOKEN --config wrangler.toml
          echo 'TRAVELPAYOUTS_SECRET_SYNCED'
      - name: Verify live provider configuration without exposing secret
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for i in $(seq 1 12); do
            curl -fsS --max-time 20 "$BASE/travel/providers" -o providers.json || true
            if jq -e '.externalProviderStatus.providers[] | select(.id == "aviasales-data-v2") | .configured == true and .dynamicDeepLinksConfigured == true' providers.json >/dev/null 2>&1; then
              echo 'AVIASALES_DYNAMIC_PROVIDER_CONFIGURED'
              exit 0
            fi
            sleep 3
          done
          jq '{externalProviderStatus}' providers.json
          echo 'AVIASALES_DYNAMIC_PROVIDER_NOT_CONFIGURED'
          exit 1
