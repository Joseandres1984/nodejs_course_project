name: LUMEN Partner Negotiator Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-partner-negotiator-smoke.yml'
  workflow_dispatch:

jobs:
  negotiator-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Partner Negotiator and Terms Planner
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            policy=$(curl --show-error --silent --max-time 10 "$BASE_URL/negotiator/policy" || true)
            terms=$(curl --show-error --silent --max-time 10 "$BASE_URL/negotiator/terms-requests/stats" || true)
            runtime=$(curl --show-error --silent --max-time 10 "$BASE_URL/negotiator/terms-runtime/stats" || true)
            echo "$policy"
            echo "$terms"
            echo "$runtime"
            if echo "$policy" | grep -q '1.0-partner-negotiator' && echo "$terms" | grep -q '1.0-negotiator-terms-planner' && echo "$runtime" | grep -q '1.0-negotiator-terms-runtime'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify negotiation policy guardrails
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/negotiator/policy" > /tmp/policy.json
          jq -e '.version == "1.0-partner-negotiator" and .mode == "non_binding_recommendation" and .unknownPricePolicy == "unknown_price_is_neutral_not_invented_and_prevents_full_commercial_confidence" and .autonomousNegotiationMessages == false and .autonomousHiring == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/policy.json >/dev/null

      - name: Recompute real negotiation cases
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            -X POST "$BASE_URL/negotiator/recompute" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/recompute.json
          cat /tmp/recompute.json
          echo
          jq -e '.ok == true and .version == "1.0-partner-negotiator" and .cases >= 1 and (.topCases | length) >= 1 and ([.topCases[] | select(.candidates >= 2)] | length) >= 1 and ([.topCases[] | select(.status == "READY_FOR_HUMAN_REVIEW" and (.pricedCandidates < 2 or .candidates < 2))] | length) == 0 and ([.topCases[] | select(.pricedCandidates < 2 and .decisionMode != "TECHNICAL_RANKING_ONLY")] | length) == 0 and .guardrails.recommendationOnly == true and .guardrails.pricesDeclaredNotVerified == true and .guardrails.autonomousNegotiationMessages == false and .guardrails.autonomousHiring == false and .guardrails.autonomousSpend == false and .guardrails.bindingActionsHumanGated == true' /tmp/recompute.json >/dev/null

      - name: Plan missing commercial terms without sending
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/negotiator/terms-requests/plan" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/terms-plan.json
          cat /tmp/terms-plan.json
          echo
          jq -e '.ok == true and .version == "1.0-negotiator-terms-planner" and .drafts >= 1 and .guardrails.draftOnly == true and .guardrails.externalMessagesSent == 0 and .guardrails.autonomousNegotiationMessages == false and .guardrails.autonomousSpend == false and .guardrails.bindingActionsHumanGated == true' /tmp/terms-plan.json >/dev/null

      - name: Verify planner remains non-sending
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/negotiator/terms-requests/stats" > /tmp/terms-stats.json
          cat /tmp/terms-stats.json
          echo
          jq -e '.version == "1.0-negotiator-terms-planner" and .total >= 1 and .externalMessagesSent >= 0 and .draftOnly == true and .autonomousNegotiationMessages == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/terms-stats.json >/dev/null

      - name: Verify guarded terms runtime
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/negotiator/terms-runtime/stats" > /tmp/runtime.json
          cat /tmp/runtime.json
          echo
          jq -e '.version == "1.0-negotiator-terms-runtime" and .maxMessagesPerCase == 2 and .autonomousNegotiationMessages == true and .autonomousSpend == false and .autonomousPurchase == false and .autonomousContract == false and .bindingActionsHumanGated == true' /tmp/runtime.json >/dev/null

      - name: Verify negotiator state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/negotiator/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.0-partner-negotiator" and .totalCases >= 1 and .rankedCandidates >= 2 and .recommendationOnly == true and .autonomousNegotiationMessages == false and .autonomousHiring == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null

      - name: Prepare safe negotiator snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/negotiator-snapshot
          jq '{version,cases,readyForHumanReview,incompleteTerms,insufficientCompetition,topCases,guardrails}' /tmp/recompute.json > /tmp/negotiator-snapshot/recompute.json
          jq '{version,totalCases,readyForHumanReview,incompleteTerms,insufficientCompetition,rankedCandidates,pricedCandidates,maxRecommendationConfidence,recommendationOnly,autonomousNegotiationMessages,autonomousHiring,autonomousSpend,bindingActionsHumanGated}' /tmp/stats.json > /tmp/negotiator-snapshot/stats.json
          jq '{version,drafts,requests,guardrails}' /tmp/terms-plan.json > /tmp/negotiator-snapshot/terms-plan.json
          jq '{version,total,drafts,externalMessagesSent,draftOnly,autonomousNegotiationMessages,autonomousSpend,bindingActionsHumanGated}' /tmp/terms-stats.json > /tmp/negotiator-snapshot/terms-stats.json
          jq '{version,total,externalMessagesSent,responsesWithTerms,pricedResponses,timedResponses,pendingTasks,maxMessagesPerCase,autonomousNegotiationMessages,autonomousSpend,autonomousPurchase,autonomousContract,bindingActionsHumanGated}' /tmp/runtime.json > /tmp/negotiator-snapshot/runtime.json

      - name: Upload negotiator snapshot
        uses: actions/upload-artifact@v4
        with:
          name: negotiator-snapshot
          path: /tmp/negotiator-snapshot
          retention-days: 1
