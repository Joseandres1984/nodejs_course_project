name: LUMEN Instagram connector diagnostic

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-instagram-connector-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_USER_ID: ${{ secrets.LUMEN_INSTAGRAM_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.LUMEN_INSTAGRAM_ACCESS_TOKEN }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.LUMEN_META_PAGE_ACCESS_TOKEN }}
      IG_GRAPH_VERSION: ${{ secrets.LUMEN_META_GRAPH_VERSION }}
    steps:
      - name: Check Instagram publishing prerequisites without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$1" ]; then printf 'PRESENT'; else printf 'MISSING'; fi; }
          echo "LUMEN_INSTAGRAM_USER_ID=$(present "${IG_USER_ID:-}")"
          if [ -n "${IG_ACCESS_TOKEN:-}" ]; then
            echo 'INSTAGRAM_TOKEN_SOURCE=LUMEN_INSTAGRAM_ACCESS_TOKEN'
            echo 'INSTAGRAM_ACCESS_TOKEN=PRESENT'
          elif [ -n "${IG_PAGE_ACCESS_TOKEN:-}" ]; then
            echo 'INSTAGRAM_TOKEN_SOURCE=LUMEN_META_PAGE_ACCESS_TOKEN'
            echo 'INSTAGRAM_ACCESS_TOKEN=PRESENT'
          else
            echo 'INSTAGRAM_TOKEN_SOURCE=NONE'
            echo 'INSTAGRAM_ACCESS_TOKEN=MISSING'
          fi
          if [ -n "${IG_GRAPH_VERSION:-}" ]; then
            echo 'INSTAGRAM_GRAPH_VERSION=PRESENT'
          else
            echo 'INSTAGRAM_GRAPH_VERSION=DEFAULT_ALLOWED'
          fi
          if [ -n "${IG_USER_ID:-}" ] && { [ -n "${IG_ACCESS_TOKEN:-}" ] || [ -n "${IG_PAGE_ACCESS_TOKEN:-}" ]; }; then
            echo 'INSTAGRAM_CONNECTOR_PREREQUISITES=READY'
          else
            echo 'INSTAGRAM_CONNECTOR_PREREQUISITES=NOT_READY'
          fi

      - name: Recover Instagram account ID from existing token
        if: ${{ env.IG_USER_ID == '' && (env.IG_ACCESS_TOKEN != '' || env.IG_PAGE_ACCESS_TOKEN != '') }}
        shell: bash
        run: |
          set -euo pipefail
          token="${IG_ACCESS_TOKEN:-${IG_PAGE_ACCESS_TOKEN:-}}"
          version="${IG_GRAPH_VERSION:-v26.0}"
          case "$version" in v*) ;; *) version="v$version" ;; esac

          # Route 1: Instagram Graph API through Facebook Login / linked Page.
          fb_code=$(curl --silent --show-error --max-time 30 -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://graph.facebook.com/$version/me/accounts?fields=id%2Cinstagram_business_account%7Bid%2Cusername%7D&limit=100" \
            -o /tmp/accounts.json || true)
          echo "FACEBOOK_GRAPH_PROBE_HTTP=${fb_code:-000}"
          candidate=$(jq -r '[.data[]? | .instagram_business_account? | select(.id != null) | {id:(.id|tostring),username:(.username // "")}] | map(select(.username=="lumen.b2b")) + map(select(.username!="lumen.b2b")) | .[0].id // empty' /tmp/accounts.json 2>/dev/null || true)
          username=$(jq -r --arg id "$candidate" '[.data[]? | .instagram_business_account? | select((.id|tostring)==$id)][0].username // empty' /tmp/accounts.json 2>/dev/null || true)
          if [ -n "$candidate" ]; then
            echo "RECOVERED_INSTAGRAM_USER_ID=$candidate"
            echo "RECOVERED_INSTAGRAM_USERNAME=${username:-UNKNOWN}"
            echo 'INSTAGRAM_API_MODE=FACEBOOK_LOGIN'
            echo 'INSTAGRAM_ID_RECOVERY=SUCCESS'
            exit 0
          fi

          # Route 2: Instagram API with Instagram Login. Token stays only in the Authorization header.
          ig_code=$(curl --silent --show-error --max-time 30 -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://graph.instagram.com/$version/me?fields=user_id%2Cid%2Cusername" \
            -o /tmp/igme.json || true)
          echo "INSTAGRAM_GRAPH_PROBE_HTTP=${ig_code:-000}"
          ig_id=$(jq -r '.user_id // .id // empty' /tmp/igme.json 2>/dev/null || true)
          ig_username=$(jq -r '.username // empty' /tmp/igme.json 2>/dev/null || true)
          if [ -n "$ig_id" ] && { [ "$ig_username" = 'lumen.b2b' ] || [ -n "$ig_username" ]; }; then
            echo "RECOVERED_INSTAGRAM_USER_ID=$ig_id"
            echo "RECOVERED_INSTAGRAM_USERNAME=$ig_username"
            echo 'INSTAGRAM_API_MODE=INSTAGRAM_LOGIN'
            echo 'INSTAGRAM_ID_RECOVERY=SUCCESS'
            exit 0
          fi

          echo 'INSTAGRAM_ID_RECOVERY=NOT_FOUND'
