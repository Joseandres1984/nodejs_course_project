name: LUMEN Owner Commercial Diagnostic

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-owner-d1-commercial-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Sync revenue loop without external send
        run: |
          set -euo pipefail
          test -n "$OPPORTUNITY_ADMIN_TOKEN"
          curl -fsS --max-time 90 -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" -H 'cache-control: no-cache' "$BASE/revenue-loop-v5/run" -o /tmp/revenue-sync.json
          jq '{ok,version,proposal,followup,closer,lifecycle,memory,guardrails}' /tmp/revenue-sync.json
          jq -e '.guardrails.autonomousSpendUsd==0 and .guardrails.createsNewSenderAuthority==false and .guardrails.bindingActionsHumanGated==true' /tmp/revenue-sync.json >/dev/null

      - name: Read current commercial control planes
        run: |
          set -euo pipefail
          test -n "$OPPORTUNITY_ADMIN_TOKEN"
          curl -fsS --max-time 30 -H 'cache-control: no-cache' "$BASE/commercial/next" -o /tmp/commercial.json
          curl -fsS --max-time 30 -H 'cache-control: no-cache' "$BASE/commercial/stats" -o /tmp/commercial-stats.json
          curl -fsS --max-time 30 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" -H 'cache-control: no-cache' "$BASE/commercial/actionable?limit=10" -o /tmp/actionable.json
          curl -fsS --max-time 30 -H 'cache-control: no-cache' "$BASE/proposals/next" -o /tmp/proposal.json
          curl -fsS --max-time 30 -H 'cache-control: no-cache' "$BASE/quality/stats" -o /tmp/quality.json
          curl -fsS --max-time 30 -H 'cache-control: no-cache' "$BASE/followup/pipeline" -o /tmp/pipeline.json
          curl -fsS --max-time 30 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" -H 'cache-control: no-cache' "$BASE/tender-match/state" -o /tmp/matches.json
          curl -fsS --max-time 30 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" -H 'cache-control: no-cache' "$BASE/revenue-loop-v5/status" -o /tmp/revenue.json
          curl -fsS --max-time 30 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" -H 'cache-control: no-cache' "$BASE/first-settlement/status" -o /tmp/settlement.json

          echo '===== COMMERCIAL NEXT ====='
          jq '{version,opportunity:(.opportunity|if .==null then null else {id,name,endpoint,revenue_offer_id,status,discovery_score,commercial_score,commercial_fit,evidence_strength,commercially_actionable,reasons} end),nextAction}' /tmp/commercial.json
          echo '===== COMMERCIAL STATS ====='
          jq '.' /tmp/commercial-stats.json
          echo '===== ACTIONABLE QUEUE ====='
          jq '{version,rows:[.rows[]|{id,source,name,endpoint,revenue_offer_id,status,commercial_score,evidence_strength,commercially_actionable,proposal_id,proposal_status,quality_gate_status,outreach_status,proposal_missing,reasons}]}' /tmp/actionable.json
          echo '===== ACTIONABLE BOTTLENECK SUMMARY ====='
          jq '{actionable_count:(.rows|length),missing_proposal:([.rows[]|select(.proposal_id==null)]|length),by_proposal_status:([.rows[].proposal_status]|group_by(.)|map({status:.[0],count:length})),by_outreach_status:([.rows[].outreach_status]|group_by(.)|map({status:.[0],count:length})),blocked_drafts:[.rows[]|select(.proposal_id!=null and .outreach_status==null)|{id,proposal_id,proposal_status,quality_gate_status,commercial_score,evidence_strength}]}' /tmp/actionable.json
          echo '===== PROPOSAL NEXT ====='
          jq '{proposal:(.proposal|if .==null then null else {proposalId,opportunityId,target,endpoint,offerId,amountUsd,status,qualityGateStatus,metadata} end),nextAction}' /tmp/proposal.json
          echo '===== QUALITY STATS ====='
          jq '.' /tmp/quality.json
          echo '===== ACTIVE FOLLOWUP PIPELINE ====='
          jq '{selected:[.pipeline[]|select(.proposal_id=="PROP-57C73BDF2827" or .proposal_id=="PROP-E8AE31983347" or .proposal_id=="PROP-69A9A1A91E7B")|{proposal_id,opportunity_id,target,stage,response_class,last_contact_at,next_action,next_action_at,followup_count,updated_at,notes}]}' /tmp/pipeline.json
          echo '===== TENDER MATCH STATE ====='
          jq '{version,total,recent:[.recent[]|{match_id,match_opportunity_id,match_score,status,matched_terms}]}' /tmp/matches.json
          echo '===== REVENUE LOOP ====='
          jq '{version,focus,stages,guardrails}' /tmp/revenue.json
          echo '===== FIRST SETTLEMENT ====='
          jq '{mission:{status:.mission.status,focus:.mission.focus,diagnosis:.mission.diagnosis},stalledCount,successCriterion}' /tmp/settlement.json
