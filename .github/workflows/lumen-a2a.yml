name: LUMEN A2A Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-a2a.yml"

permissions:
  contents: read

concurrency:
  group: lumen-a2a-deploy
  cancel-in-progress: true

jobs:
  deploy-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      A2A_BASE_URL: https://lumen-zero-a2a.joseandresceol1-jac.workers.dev
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Validate A2A bridge and seller discovery syntax
        run: |
          python3 -m py_compile .lumen/runtime/zero_a2a_inbound_bridge_runtime.py .lumen/runtime/agent_network_runtime.py .lumen/runtime/agent_network_accelerator_runtime.py .lumen/runtime/zero_entry.py
          python3 -m unittest discover -s .lumen/runtime -p 'test_a2a_machine_store.py'

      - name: Deployment preflight
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate A2A Worker syntax
        working-directory: .lumen/a2a-worker
        run: node --check worker.js

      - name: Deploy A2A Worker
        working-directory: .lumen/a2a-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify health, catalogs and payment truth
        shell: bash
        run: |
          for i in {1..12}; do
            health=$(curl -sS -o /tmp/a2a-health.json -w '%{http_code}' "$A2A_BASE_URL/health" || true)
            card=$(curl -sS -o /tmp/a2a-card.json -w '%{http_code}' "$A2A_BASE_URL/.well-known/agent-card.json" || true)
            services=$(curl -sS -o /tmp/a2a-services.json -w '%{http_code}' "$A2A_BASE_URL/seller/catalog" || true)
            machine=$(curl -sS -o /tmp/a2a-machine.json -w '%{http_code}' "$A2A_BASE_URL/machine/catalog" || true)
            payments=$(curl -sS -o /tmp/a2a-payments.json -w '%{http_code}' "$A2A_BASE_URL/payments/status" || true)
            stats=$(curl -sS -o /tmp/a2a-stats.json -w '%{http_code}' "$A2A_BASE_URL/machine/stats" || true)
            if [[ "$health" == "200" && "$card" == "200" && "$services" == "200" && "$machine" == "200" && "$payments" == "200" && "$stats" == "200" ]]; then
              python3 - <<'PY'
          import json
          health=json.load(open('/tmp/a2a-health.json'))
          card=json.load(open('/tmp/a2a-card.json'))
          catalog=json.load(open('/tmp/a2a-services.json'))
          machine=json.load(open('/tmp/a2a-machine.json'))
          payments=json.load(open('/tmp/a2a-payments.json'))
          stats=json.load(open('/tmp/a2a-stats.json'))
          assert health.get('sellerMode') == 'receive_revenue_only'
          assert health.get('lumenAutonomousSpend') is False
          assert health.get('machineProducts') == 6
          assert health.get('recurringPlans') == 4
          assert card.get('name') == 'LUMEN B2B Agent'
          assert card.get('metadata',{}).get('sellerMode') == 'receive_revenue_only'
          assert card.get('metadata',{}).get('autonomousSpend') is False
          service_prices={x.get('id'):int(x.get('from_usd') or 0) for x in (catalog.get('services') or [])}
          assert service_prices == {
              'SRV-QUOTECHECK':59,
              'SRV-SUPPLIERCHECK':79,
              'SRV-TENDER-HUNTER':99,
              'SRV-SOURCING-EXPRESS':149,
              'SRV-B2B-PROSPECTING':199,
              'SRV-EXPORT-SCOUT':249,
          }, service_prices
          product_prices={x.get('id'):int(x.get('price_usd') or 0) for x in (machine.get('machineProducts') or [])}
          assert product_prices == {
              'MP-SUPPLIER-SNAPSHOT':5,
              'MP-QUOTE-SANITY':7,
              'MP-TENDER-SCAN':9,
              'MP-SOURCING-5':15,
              'MP-BUYER-SIGNALS':19,
              'MP-EXPORT-PULSE':25,
          }, product_prices
          plan_prices={x.get('id'):int(x.get('price_usd') or 0) for x in (machine.get('recurringPlans') or [])}
          assert plan_prices == {'PLAN-TENDER-WATCH':29,'PLAN-SUPPLIER-WATCH':39,'PLAN-BUYER-WATCH':59,'PLAN-EXPORT-RADAR':79}, plan_prices
          assert payments.get('autonomousPurchase') is False
          assert payments.get('autonomousOutgoingPayment') is False
          assert payments.get('chargeCreatedByCatalogOrQuote') is False
          assert payments.get('x402',{}).get('status') in {'READY','SETUP_REQUIRED'}
          assert stats.get('realizedRevenueUsd') is None
          print({'machine_store':{'products':len(product_prices),'plans':len(plan_prices),'x402':payments.get('x402',{}).get('status'),'orders':stats.get('orders'),'quoted_pipeline_usd':stats.get('quotedPipelineUsd')}})
          PY
              exit 0
            fi
            sleep 5
          done
          echo "A2A Machine Store production verification failed."
          for f in /tmp/a2a-health.json /tmp/a2a-card.json /tmp/a2a-services.json /tmp/a2a-machine.json /tmp/a2a-payments.json /tmp/a2a-stats.json; do cat "$f" 2>/dev/null || true; echo; done
          exit 1

      - name: Verify quote RPCs and machine order round trip
        shell: bash
        run: |
          product_quote='{"jsonrpc":"2.0","id":"product-quote-canary","method":"QuoteMachineProduct","params":{"productId":"MP-SUPPLIER-SNAPSHOT","contextId":"deploy-product-quote","metadata":{"purpose":"technical_quote_canary"}}}'
          code=$(curl -sS -o /tmp/a2a-product-quote.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$product_quote")
          [[ "$code" == "200" ]]
          jq -e '.result.quote.itemId == "MP-SUPPLIER-SNAPSHOT" and .result.quote.serviceId == "SRV-SUPPLIERCHECK" and .result.quote.amount == 5 and .result.quote.currency == "USD" and .result.quote.chargeCreated == false' /tmp/a2a-product-quote.json >/dev/null

          plan_quote='{"jsonrpc":"2.0","id":"plan-quote-canary","method":"QuoteRecurringPlan","params":{"planId":"PLAN-TENDER-WATCH","contextId":"deploy-plan-quote","metadata":{"purpose":"technical_quote_canary"}}}'
          code=$(curl -sS -o /tmp/a2a-plan-quote.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$plan_quote")
          [[ "$code" == "200" ]]
          jq -e '.result.quote.itemId == "PLAN-TENDER-WATCH" and .result.quote.amount == 29 and .result.quote.billing == "per_month"' /tmp/a2a-plan-quote.json >/dev/null

          context="machine-order-canary-${GITHUB_RUN_ID}"
          message="machine-order-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -cn --arg context "$context" --arg message "$message" '{jsonrpc:"2.0",id:"machine-order-canary",method:"SendMessage",params:{message:{messageId:$message,contextId:$context,role:"ROLE_USER",parts:[{text:"Technical deployment canary: review supplier example.com for identity signals. This is non-binding and must not create or settle a payment.",mediaType:"text/plain"}],metadata:{source:"lumen_deployment_canary",organization:"LUMEN deployment canary",purpose:"technical_machine_order_canary",productId:"MP-SUPPLIER-SNAPSHOT",domain:"example.com"}}}}')
          code=$(curl -sS -o /tmp/a2a-machine-order.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$payload")
          [[ "$code" == "200" ]]
          jq -e '.result.task.status.message.parts[1].data.commercialItem.itemId == "MP-SUPPLIER-SNAPSHOT" and .result.task.status.message.parts[1].data.commercialItem.priceUsd == 5 and .result.task.status.message.parts[1].data.lumenAutonomousSpend == false' /tmp/a2a-machine-order.json >/dev/null
          echo "A2A_MACHINE_ORDER_CANARY=success product=MP-SUPPLIER-SNAPSHOT quote_usd=5 charge_created=false"

      - name: Register or refresh Global A2A Registry
        id: registry
        continue-on-error: true
        shell: bash
        run: |
          manifest="$A2A_BASE_URL/.well-known/agent-card.json"
          payload=$(jq -cn --arg manifest "$manifest" '{wellKnownURI:$manifest}')
          code=$(curl -sS -o /tmp/a2a-registry.json -w '%{http_code}' -X POST 'https://a2aregistry.org/api/agents/register' -H 'accept: application/json' -H 'content-type: application/json' --data "$payload" || true)
          echo "A2A_REGISTRY_REGISTER_HTTP=$code"
          cat /tmp/a2a-registry.json 2>/dev/null || true
          final_code="$code"
          action="registered"
          if [[ "$code" == "409" ]]; then
            agent_id=$(jq -r '.detail // ""' /tmp/a2a-registry.json | sed -n 's/.*id=\([^)]*\).*/\1/p')
            if [[ -n "$agent_id" ]]; then
              update_code=$(curl -sS -o /tmp/a2a-registry-update.json -w '%{http_code}' -X PUT "https://a2aregistry.org/api/agents/$agent_id" -H 'accept: application/json' -H 'content-type: application/json' --data "$payload" || true)
              echo "A2A_REGISTRY_UPDATE_HTTP=$update_code id=$agent_id"
              cat /tmp/a2a-registry-update.json 2>/dev/null || true
              final_code="$update_code"
              action="refreshed_existing"
            else
              action="already_registered_id_unresolved"
            fi
          fi
          echo "http_status=$final_code" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$final_code" =~ ^2[0-9][0-9]$ || "$code" == "409" ]]; then exit 0; fi
          exit 1

      - name: Diagnose public A2A discovery API
        continue-on-error: true
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/a2a-search.json -w '%{http_code}' 'https://api.a2a-registry.org/public/agents?q=procurement&target=Business' || true)
          echo "A2A_DISCOVERY_HTTP=$code"
          jq -c '.' /tmp/a2a-search.json 2>/dev/null | head -c 5000 || true
          echo
          [[ "$code" == "200" ]]

      - name: A2A deploy summary
        if: always()
        shell: bash
        run: |
          echo "A2A gateway: $A2A_BASE_URL"
          echo "Agent Card: $A2A_BASE_URL/.well-known/agent-card.json"
          echo "Machine Store: $A2A_BASE_URL/machine/catalog"
          echo "Service catalog: $A2A_BASE_URL/seller/catalog"
          echo "Payments status: $A2A_BASE_URL/payments/status"
          echo "Registry action: ${{ steps.registry.outputs.action }}"
          echo "Registry final HTTP: ${{ steps.registry.outputs.http_status }}"

# redeploy trigger after Machine Store regression fix 2026-09-21
