name: LUMEN A2A Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-a2a.yml"

permissions:
  contents: read

concurrency:
  group: lumen-a2a-deploy
  cancel-in-progress: true

jobs:
  deploy-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      A2A_BASE_URL: https://lumen-zero-a2a.joseandresceol1-jac.workers.dev
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Validate A2A bridge and seller discovery syntax
        run: python3 -m py_compile .lumen/runtime/zero_a2a_inbound_bridge_runtime.py .lumen/runtime/agent_network_runtime.py .lumen/runtime/agent_network_accelerator_runtime.py .lumen/runtime/zero_entry.py

      - name: Deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate A2A Worker syntax
        working-directory: .lumen/a2a-worker
        run: node --check worker.js

      - name: Deploy A2A Worker
        working-directory: .lumen/a2a-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify A2A health, Agent Card and seller catalog
        shell: bash
        run: |
          for i in {1..12}; do
            health=$(curl -sS -o /tmp/a2a-health.json -w '%{http_code}' "$A2A_BASE_URL/health" || true)
            card=$(curl -sS -o /tmp/a2a-card.json -w '%{http_code}' "$A2A_BASE_URL/.well-known/agent-card.json" || true)
            catalog=$(curl -sS -o /tmp/a2a-catalog.json -w '%{http_code}' "$A2A_BASE_URL/seller/catalog" || true)
            if [[ "$health" == "200" && "$card" == "200" && "$catalog" == "200" ]]; then
              python3 - <<'PY'
          import json
          health=json.load(open('/tmp/a2a-health.json'))
          card=json.load(open('/tmp/a2a-card.json'))
          catalog=json.load(open('/tmp/a2a-catalog.json'))
          assert health.get('sellerMode') == 'receive_revenue_only'
          assert health.get('lumenAutonomousSpend') is False
          assert card.get('name') == 'LUMEN B2B Agent'
          assert card.get('metadata',{}).get('sellerMode') == 'receive_revenue_only'
          assert card.get('metadata',{}).get('autonomousSpend') is False
          services=catalog.get('services') or []
          prices={x.get('id'):int(x.get('from_usd') or 0) for x in services}
          assert prices == {
              'SRV-QUOTECHECK':59,
              'SRV-SUPPLIERCHECK':79,
              'SRV-TENDER-HUNTER':99,
              'SRV-SOURCING-EXPRESS':149,
              'SRV-B2B-PROSPECTING':199,
              'SRV-EXPORT-SCOUT':249,
          }, prices
          assert catalog.get('settlement',{}).get('automaticBuyerSideSpend') is False
          print({'a2a_seller_catalog':{'services':len(services),'floor_usd':catalog.get('pricing',{}).get('floor_usd'),'ceiling_usd':catalog.get('pricing',{}).get('ceiling_usd'),'sellerMode':catalog.get('sellerMode')}})
          PY
              exit 0
            fi
            sleep 5
          done
          echo "A2A health/card/catalog verification failed."
          cat /tmp/a2a-health.json 2>/dev/null || true
          cat /tmp/a2a-card.json 2>/dev/null || true
          cat /tmp/a2a-catalog.json 2>/dev/null || true
          exit 1

      - name: Verify machine-readable catalog and quote RPC
        shell: bash
        run: |
          catalog_payload='{"jsonrpc":"2.0","id":"catalog-canary","method":"GetServiceCatalog","params":{}}'
          catalog_code=$(curl -sS -o /tmp/a2a-rpc-catalog.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$catalog_payload")
          [[ "$catalog_code" == "200" ]]
          jq -e '.result.catalog.services|length == 6' /tmp/a2a-rpc-catalog.json >/dev/null

          quote_payload='{"jsonrpc":"2.0","id":"quote-canary","method":"QuoteService","params":{"serviceId":"SRV-QUOTECHECK","contextId":"deploy-quote-canary","metadata":{"purpose":"technical_quote_canary"}}}'
          quote_code=$(curl -sS -o /tmp/a2a-rpc-quote.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$quote_payload")
          [[ "$quote_code" == "200" ]]
          jq -e '.result.quote.serviceId == "SRV-QUOTECHECK" and .result.quote.amount == 59 and .result.quote.currency == "USD" and .result.quote.chargeCreated == false and .result.quote.lumenAutonomousSpend == false' /tmp/a2a-rpc-quote.json >/dev/null
          echo "A2A_SELLER_RPC catalog=6 quote=ok amount_usd=59 charge_created=false autonomous_spend=false"

      - name: Register or refresh Global A2A Registry
        id: registry
        continue-on-error: true
        shell: bash
        run: |
          manifest="$A2A_BASE_URL/.well-known/agent-card.json"
          payload=$(jq -cn --arg manifest "$manifest" '{wellKnownURI:$manifest}')
          code=$(curl -sS -o /tmp/a2a-registry.json -w '%{http_code}' -X POST 'https://a2aregistry.org/api/agents/register' -H 'accept: application/json' -H 'content-type: application/json' --data "$payload" || true)
          echo "A2A_REGISTRY_REGISTER_HTTP=$code"
          cat /tmp/a2a-registry.json 2>/dev/null || true
          final_code="$code"
          action="registered"
          if [[ "$code" == "409" ]]; then
            agent_id=$(jq -r '.detail // ""' /tmp/a2a-registry.json | sed -n 's/.*id=\([^)]*\).*/\1/p')
            if [[ -n "$agent_id" ]]; then
              update_code=$(curl -sS -o /tmp/a2a-registry-update.json -w '%{http_code}' -X PUT "https://a2aregistry.org/api/agents/$agent_id" -H 'accept: application/json' -H 'content-type: application/json' --data "$payload" || true)
              echo "A2A_REGISTRY_UPDATE_HTTP=$update_code id=$agent_id"
              cat /tmp/a2a-registry-update.json 2>/dev/null || true
              final_code="$update_code"
              action="refreshed_existing"
            else
              action="already_registered_id_unresolved"
            fi
          fi
          echo "http_status=$final_code" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$final_code" =~ ^2[0-9][0-9]$ || "$code" == "409" ]]; then exit 0; fi
          exit 1

      - name: Diagnose public A2A discovery API
        id: discovery
        continue-on-error: true
        shell: bash
        run: |
          code_target=$(curl -sS -o /tmp/a2a-search-target.json -w '%{http_code}' 'https://api.a2a-registry.org/public/agents?q=procurement&target=Business' || true)
          code_open=$(curl -sS -o /tmp/a2a-search-open.json -w '%{http_code}' 'https://api.a2a-registry.org/public/agents?q=procurement' || true)
          echo "A2A_DISCOVERY_TARGET_HTTP=$code_target"
          echo "A2A_DISCOVERY_OPEN_HTTP=$code_open"
          echo "TARGET_ROOT_TYPE=$(jq -r 'type' /tmp/a2a-search-target.json 2>/dev/null || echo invalid)"
          echo "TARGET_KEYS=$(jq -c 'if type==\"object\" then keys else [] end' /tmp/a2a-search-target.json 2>/dev/null || echo '[]')"
          echo "TARGET_BODY=$(jq -c '.' /tmp/a2a-search-target.json 2>/dev/null | head -c 5000 || true)"
          echo
          echo "OPEN_ROOT_TYPE=$(jq -r 'type' /tmp/a2a-search-open.json 2>/dev/null || echo invalid)"
          echo "OPEN_KEYS=$(jq -c 'if type==\"object\" then keys else [] end' /tmp/a2a-search-open.json 2>/dev/null || echo '[]')"
          echo "OPEN_BODY=$(jq -c '.' /tmp/a2a-search-open.json 2>/dev/null | head -c 5000 || true)"
          echo
          if [[ "$code_target" == "200" || "$code_open" == "200" ]]; then exit 0; fi
          exit 1

      - name: Verify real A2A SendMessage round trip
        shell: bash
        run: |
          context="deploy-canary-${GITHUB_RUN_ID}"
          message="deploy-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -cn --arg context "$context" --arg message "$message" '{jsonrpc:"2.0",id:"deploy-canary",method:"SendMessage",params:{message:{messageId:$message,contextId:$context,role:"ROLE_USER",parts:[{text:"LUMEN deployment capability handshake test. This is a non-binding technical canary only; no purchase, payment, contract, RFQ, commercial offer or acceptance is requested.",mediaType:"text/plain"}],metadata:{source:"lumen_deployment_canary",organization:"LUMEN B2B",purpose:"technical_nonbinding_handshake"}}}}')
          code=$(curl -sS -o /tmp/a2a-canary.json -w '%{http_code}' -X POST "$A2A_BASE_URL/a2a/v1" -H 'accept: application/json' -H 'content-type: application/json' -H 'A2A-Version: 1.0' --data "$payload")
          cat /tmp/a2a-canary.json
          [[ "$code" == "200" ]]
          jq -e '.jsonrpc == "2.0" and .result.task.id != null and .result.task.metadata.nonbinding == true and .result.task.metadata.bindingActionsHumanGated == true and .result.task.metadata.lumenAutonomousSpend == false' /tmp/a2a-canary.json >/dev/null
          echo "A2A_CANARY=success context=$context seller_mode=receive_revenue_only"

      - name: A2A deploy summary
        if: always()
        shell: bash
        run: |
          echo "A2A gateway: $A2A_BASE_URL"
          echo "Agent Card: $A2A_BASE_URL/.well-known/agent-card.json"
          echo "Seller catalog: $A2A_BASE_URL/seller/catalog"
          echo "Registry action: ${{ steps.registry.outputs.action }}"
          echo "Registry final HTTP: ${{ steps.registry.outputs.http_status }}"

# deploy trigger: seller mode + machine-readable pricing 2026-09-21
