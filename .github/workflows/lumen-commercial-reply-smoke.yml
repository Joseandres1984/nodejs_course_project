name: LUMEN Commercial Reply Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/commercial-reply-engine.js'
      - '.lumen/a2a-worker/response-qualification.js'
      - '.github/workflows/lumen-commercial-reply-smoke.yml'
  workflow_dispatch:

jobs:
  commercial-reply-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Commercial Reply Engine v1.2
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            policy=$(curl --show-error --silent --max-time 10 "$BASE_URL/commercial-reply/policy" || true)
            cash=$(curl --show-error --silent --max-time 10 "$BASE_URL/first-cash/policy" || true)
            qualification=$(curl --show-error --silent --max-time 10 "$BASE_URL/response-qualification/policy" || true)
            if echo "$policy" | grep -q '1.2-bounded-commercial-dialogue' && echo "$cash" | grep -q 'shared-response' && echo "$qualification" | grep -q '1.0-commercial-response-qualification'; then
              echo "$policy"
              echo "$cash"
              echo "$qualification"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify reply policy guardrails
        run: |
          set -euo pipefail
          curl --fail --silent "$BASE_URL/commercial-reply/policy" > /tmp/policy.json
          cat /tmp/policy.json
          echo
          jq -e '
            .version == "1.2-bounded-commercial-dialogue" and
            .handles == ["COMMERCIAL_QUESTION"] and
            .purchaseIntentHandledBy == "First Cash Closer" and
            .knownOfferFactsOnly == true and
            .unknownEtaNotInvented == true and
            .asyncConversationPolling == true and
            .maxExternalMessagesPerRun == 1 and
            .maxRepliesPerProposal == 3 and
            .oneExternalReplyPerRun == true and
            .followOnMustReclassifyAsCommercialQuestion == true and
            .autonomousDiscounting == false and
            .autonomousSpend == false and
            .autonomousContract == false and
            .bindingActionsHumanGated == true
          ' /tmp/policy.json >/dev/null

      - name: Verify current reply state without forcing send
        run: |
          set -euo pipefail
          curl --fail --silent "$BASE_URL/commercial-reply/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.2-bounded-commercial-dialogue" and .autonomousEnabled == true and .maxRepliesPerProposal == 3 and (.replyTurns >= 0) and (.total >= 0) and (.asyncPending >= 0)' /tmp/stats.json >/dev/null

      - name: Poll async replies safely
        run: |
          set -euo pipefail
          curl --fail --silent --max-time 45 \
            -X POST "$BASE_URL/commercial-reply/poll" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/poll.json
          cat /tmp/poll.json
          echo
          jq -e '.ok == true and .version == "1.2-bounded-commercial-dialogue" and (.polled >= 0)' /tmp/poll.json >/dev/null

      - name: Verify shared response semantics remain live
        run: |
          set -euo pipefail
          curl --fail --silent "$BASE_URL/response-qualification/policy" > /tmp/qualification.json
          curl --fail --silent "$BASE_URL/first-cash/policy" > /tmp/cash.json
          jq -e '.qualifiedCommercialClasses == ["COMMERCIAL_QUESTION","COMMERCIAL_INTEREST","PURCHASE_INTENT"] and .rawResponseIsNotCommercialIntent == true and .autonomousSpend == false' /tmp/qualification.json >/dev/null
          jq -e '.technicalAckIsNotIntent == true and .echoIsNotIntent == true and .genericResponseIsNotIntent == true and .autonomousSpend == false and .autonomousContract == false' /tmp/cash.json >/dev/null

      - name: One-time bounded commercial nudge
        if: contains(github.event.head_commit.message, '[commercial-nudge]')
        run: |
          set -euo pipefail
          curl --fail --silent --max-time 45 \
            -X POST "$BASE_URL/commercial-reply/run" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/nudge.json
          cat /tmp/nudge.json
          echo
          jq -e '
            .version == "1.2-bounded-commercial-dialogue" and
            .ok == true and
            (.sent == true or .reason == "no_commercial_question_waiting")
          ' /tmp/nudge.json >/dev/null

          curl --fail --silent --max-time 30 \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            "$BASE_URL/first-settlement/status" > /tmp/first-settlement-after-nudge.json
          jq '{
            ok,
            successCriterion,
            mission:{
              status:.mission.status,
              opportunity_id:.mission.focus.opportunity_id,
              stage:.mission.focus.stage,
              response_class:.mission.focus.response_class,
              blocker:.mission.diagnosis.blocker,
              action:.mission.diagnosis.action
            }
          }' /tmp/first-settlement-after-nudge.json
