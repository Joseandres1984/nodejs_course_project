name: LUMEN Referral Network Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/referral-network.js'
      - '.lumen/a2a-worker/opportunity-entry.js'
      - '.github/workflows/lumen-referral-network-smoke.yml'
  workflow_dispatch:

jobs:
  referral-network-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Referral Network v1
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/referrals/policy" || true)
            echo "$body"
            if echo "$body" | grep -q '1.0-referral-network'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify public referral policy
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/referrals/policy" > /tmp/policy.json
          cat /tmp/policy.json
          echo
          jq -e '.version == "1.0-referral-network" and (.directions | index("INBOUND_TO_LUMEN")) != null and (.directions | index("OUTBOUND_TO_PARTNER")) != null and .commissionStatus == "NOT_CONFIGURED" and .autonomousReferralMessages == false and .autonomousPayout == false and .autonomousSpend == false and .bindingActionsHumanGated == true and (.rules | index("verified_payment_settlement_required_before_revenue_credit")) != null' /tmp/policy.json >/dev/null

      - name: Plan outbound referrals from real opportunities
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/referrals/plan-outbound" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/outbound.json
          cat /tmp/outbound.json
          echo
          jq -e '.ok == true and .version == "1.0-referral-network" and .guardrails.outboundMessagesSent == 0 and .guardrails.automaticCommission == false and .guardrails.automaticPayment == false and .guardrails.bindingAllowed == false and .guardrails.autonomousSpend == false' /tmp/outbound.json >/dev/null

      - name: Review inbound queue without contacting anyone
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            -X POST "$BASE_URL/referrals/review" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/review.json
          cat /tmp/review.json
          echo
          jq -e '.ok == true and .guardrails.automaticAcceptance == false and .guardrails.automaticPayment == false and .guardrails.commissionConfigured == false and .guardrails.externalContactSent == false' /tmp/review.json >/dev/null

      - name: Verify settlement attribution gate
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            -X POST "$BASE_URL/referrals/settlements/sync" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/settlement.json
          cat /tmp/settlement.json
          echo
          jq -e '.ok == true and .commissionStatus == "NOT_CONFIGURED" and .guardrails.verifiedSettlementRequired == true and .guardrails.commissionNotPromised == true and .guardrails.automaticPayout == false' /tmp/settlement.json >/dev/null

      - name: Verify referral state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/referrals/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.0-referral-network" and .bidirectional == true and .attributionPreserved == true and .commissionStatus == "NOT_CONFIGURED" and .autonomousReferralMessages == false and .autonomousPayout == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null
