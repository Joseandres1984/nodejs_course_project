name: LUMEN Instagram approved flush

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-instagram-approved-flush.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-instagram-approved-flush
  cancel-in-progress: false

jobs:
  publish-exact-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUMEN_ZERO_COST_MODE: 'true'
      LUMEN_PUBLIC_BASE_URL: 'https://lumen-zero-public.lumen-b2b.workers.dev'
      LUMEN_D1_DATABASE_ID: 'e872694a-ed14-4a7f-b2c3-38b8e1bb498b'
      D1_ACCOUNT_PRIMARY: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      D1_TOKEN_PRIMARY: ${{ secrets.LUMEN_D1_API_TOKEN }}
      D1_ACCOUNT_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEN_INSTAGRAM_USER_ID: '17841427692864676'
      LUMEN_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LUMEN_INSTAGRAM_ACCESS_TOKEN }}
      LUMEN_META_GRAPH_VERSION: 'v26.0'
      LUMEN_INSTAGRAM_API_MODE: 'instagram_login'
      TARGET_JOB_ID: 'IGTHEME-1256E8BD2F2D'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: lumen-zero
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LUMEN runtime dependencies
        run: python -m pip install --disable-pip-version-check -r .lumen/runtime/requirements.txt

      - name: Select D1 credentials without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          account="${D1_ACCOUNT_PRIMARY:-${D1_ACCOUNT_FALLBACK:-}}"
          token="${D1_TOKEN_PRIMARY:-${D1_TOKEN_FALLBACK:-}}"
          test -n "$account" && test -n "$token" && test -n "${LUMEN_INSTAGRAM_ACCESS_TOKEN:-}"
          echo "LUMEN_D1_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "LUMEN_D1_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify exact Instagram account and approved media
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 -w '%{http_code}' \
            -H "Authorization: Bearer $LUMEN_INSTAGRAM_ACCESS_TOKEN" \
            "https://graph.instagram.com/v26.0/me?fields=user_id%2Cid%2Cusername" \
            -o /tmp/igme.json)
          test "$code" = '200'
          test "$(jq -r '.user_id // .id // empty' /tmp/igme.json)" = "$LUMEN_INSTAGRAM_USER_ID"
          test "$(jq -r '.username // empty' /tmp/igme.json)" = 'lumen.b2b'
          curl --fail --silent --show-error --max-time 30 \
            "https://lumen-zero-public.lumen-b2b.workers.dev/media/instagram/$TARGET_JOB_ID.jpg" \
            -o /tmp/approved-post.jpg
          test -s /tmp/approved-post.jpg
          echo 'EXACT_ACCOUNT_AND_MEDIA_VERIFIED'

      - name: Publish only the exact previously approved post
        working-directory: .lumen/runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import d1_persistence_runtime
          import zero_watchdog_runtime
          import zero_instagram_login_runtime
          import app as lumen_app

          target = os.environ['TARGET_JOB_ID']
          if not lumen_app.load_state():
              raise RuntimeError('state_unavailable')

          approvals = lumen_app.STATE.get('instagram_publish_approvals') or {}
          approval = approvals.get(target) if isinstance(approvals, dict) else None
          if not isinstance(approval, dict) or str(approval.get('status') or '') not in {
              'APPROVED', 'APPROVED_WAITING_CONNECTOR', 'APPROVED_RETRY', 'PUBLISHED'
          }:
              raise RuntimeError('target_post_has_no_valid_explicit_approval')

          import instagram_publish_control
          result = instagram_publish_control.attempt_publish_approved(lumen_app.STATE, target)
          if not lumen_app.save_state():
              raise RuntimeError('state_persistence_failed_after_exact_publish')

          receipt = next((
              row for row in lumen_app.STATE.get('distribution_receipts', []) or []
              if isinstance(row, dict)
              and str(row.get('distribution_job_id') or '') == target
              and row.get('external_post_id')
          ), None)
          print({'exact_instagram_publish': {
              'job_id': target,
              'result': result,
              'published': bool(receipt),
              'provider': (receipt or {}).get('provider'),
              'external_post_id': (receipt or {}).get('external_post_id'),
              'approval_required_per_post': True,
          }}, flush=True)
          if not receipt:
              raise RuntimeError('exact_approved_post_not_published')

          import zero_instagram_control_bridge_runtime as bridge
          projection = bridge.export_posts()
          print({'instagram_control_projection': projection}, flush=True)
          PY
