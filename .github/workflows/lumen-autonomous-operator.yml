name: LUMEN Autonomous Operator

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumen-autonomous-operator.yml'
      - '.lumen/a2a-worker/growth-multiplier-v2.js'
      - '.lumen/a2a-worker/growth-engine-foundry.js'
      - '.lumen/a2a-worker/growth-engine-foundry-v2.js'

permissions:
  contents: read

concurrency:
  group: lumen-autonomous-operator
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Verify protected runtime access
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ADMIN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 30 "$base/health" >/dev/null
          echo 'AUTONOMOUS_RUNTIME_READY'

      - name: Wait for Growth Multiplier v2 production endpoint
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 36); do
            if curl --fail --show-error --silent --max-time 15 "$base/growth-multiplier/policy" -o /tmp/multiplier-policy.json; then
              if jq -e '.version == "2.0-growth-multiplier-compounding" and .guardrails.autonomousSpendUsd == 0 and .guardrails.createsExternalMessages == false' /tmp/multiplier-policy.json >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'GROWTH_MULTIPLIER_V2_LIVE'

      - name: Wait for Growth Engine Foundry v2 production endpoint
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 48); do
            if curl --fail --show-error --silent --max-time 15 "$base/growth-foundry/policy" -o /tmp/foundry-policy.json; then
              if jq -e '.version == "2.0-growth-engine-foundry-experiment-optimizer" and .guardrails.autonomousSpendUsd == 0 and .guardrails.createsExternalMessages == false and .guardrails.executesGeneratedCode == false and .guardrails.primitiveExecutionRequiresStaticWhitelist == true and .guardrails.maxConcurrentExperiments == 1 and .guardrails.deterministicAlternatingExperimentArms == true' /tmp/foundry-policy.json >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'GROWTH_ENGINE_FOUNDRY_V2_LIVE'

      - name: Allocate compounding growth attention
        id: multiplier
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          code=$(curl --show-error --silent --max-time 60 -o /tmp/multiplier.json -w '%{http_code}' \
            -X POST "$base/growth-multiplier/run" \
            -H "x-lumen-admin: $ADMIN" \
            -H 'content-type: application/json' -d '{}')
          cat /tmp/multiplier.json
          echo
          case "$code" in 200|202) ;; *) echo "unexpected multiplier HTTP $code"; exit 1 ;; esac
          jq -e '.ok == true and .version == "2.0-growth-multiplier-compounding" and .primaryLane and .guardrails.autonomousSpendUsd == 0 and .guardrails.createsExternalMessages == false and .guardrails.bindingActionsHumanGated == true' /tmp/multiplier.json >/dev/null
          primary=$(jq -r '.primaryLane' /tmp/multiplier.json)
          exploration=$(jq -r '.explorationLane // ""' /tmp/multiplier.json)
          echo "LUMEN_MULTIPLIER_PRIMARY=$primary"
          echo "LUMEN_MULTIPLIER_EXPLORATION=${exploration:-NONE}"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "exploration=$exploration" >> "$GITHUB_OUTPUT"

      - name: Observe decide act and learn
        id: growth
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          code=$(curl --show-error --silent --max-time 60 -o /tmp/growth.json -w '%{http_code}' \
            -X POST "$base/growth/run" \
            -H "x-lumen-admin: $ADMIN" \
            -H 'accept: application/json')
          cat /tmp/growth.json
          echo
          case "$code" in 200|202) ;; *) echo "unexpected growth HTTP $code"; exit 1 ;; esac
          jq -e '.ok == true and .version == "1.2-autonomous-growth-loop-commercial-truth"' /tmp/growth.json >/dev/null
          lane=$(jq -r '.decision.lane' /tmp/growth.json)
          echo "LUMEN_GROWTH_LANE=$lane"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Discover experiment and select one growth motor
        id: foundry
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          code=$(curl --show-error --silent --max-time 90 -o /tmp/foundry.json -w '%{http_code}' \
            -X POST "$base/growth-foundry/run" \
            -H "x-lumen-admin: $ADMIN" \
            -H 'content-type: application/json' -d '{}')
          cat /tmp/foundry.json
          echo
          case "$code" in 200|202) ;; *) echo "unexpected foundry HTTP $code"; exit 1 ;; esac
          jq -e '
            .ok == true and
            .version == "2.0-growth-engine-foundry-experiment-optimizer" and
            (.directive.action == "NONE" or .directive.action == "PROBE_CANDIDATE" or .directive.action == "RUN_PROMOTED_MOTOR" or .directive.action == "RUN_EXPERIMENT_ARM" or .directive.action == "RUN_WINNER") and
            .guardrails.autonomousSpendUsd == 0 and
            .guardrails.createsExternalMessages == false and
            .guardrails.executesGeneratedCode == false and
            .guardrails.primitiveExecutionRequiresStaticWhitelist == true and
            .guardrails.maxConcurrentExperiments == 1 and
            .guardrails.oneFoundryMotorExecutionPerCycle == true and
            .guardrails.bindingActionsHumanGated == true
          ' /tmp/foundry.json >/dev/null
          action=$(jq -r '.directive.action' /tmp/foundry.json)
          candidate=$(jq -r '.directive.candidate.name // "NONE"' /tmp/foundry.json)
          experiment=$(jq -r '.directive.experiment.id // "NONE"' /tmp/foundry.json)
          arm=$(jq -r '.directive.experimentArm // "NONE"' /tmp/foundry.json)
          attention=$(jq -c '.directive.attention // {}' /tmp/foundry.json)
          echo "LUMEN_FOUNDRY_ACTION=$action"
          echo "LUMEN_FOUNDRY_CANDIDATE=$candidate"
          echo "LUMEN_FOUNDRY_EXPERIMENT=$experiment"
          echo "LUMEN_FOUNDRY_ARM=$arm"
          echo "LUMEN_FOUNDRY_ATTENTION=$attention"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Activate selected safe growth lanes
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
          PRIMARY: ${{ steps.multiplier.outputs.primary }}
          EXPLORATION: ${{ steps.multiplier.outputs.exploration }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'

          post_endpoint() {
            local endpoint="$1"
            local timeout="${2:-90}"
            local body="/tmp/gm-${endpoint//\//-}.json"
            local code
            code=$(curl --show-error --silent --max-time "$timeout" -o "$body" -w '%{http_code}' \
              -X POST "$base/$endpoint" \
              -H "x-lumen-admin: $ADMIN" \
              -H 'content-type: application/json' -d '{}')
            echo "===== $endpoint HTTP $code ====="
            cat "$body"; echo
            case "$code" in 200|202) ;; *) echo "unexpected $endpoint HTTP $code"; exit 1 ;; esac
          }

          activate_lane() {
            local lane="$1"
            local role="$2"
            [ -n "$lane" ] || return 0
            echo "===== GROWTH MULTIPLIER $role: $lane ====="
            case "$lane" in
              B2B)
                post_endpoint source-intelligence/cycle 120
                post_endpoint market-hunter/run 120
                post_endpoint commercial/reassess 90
                if [ "$role" = 'PRIMARY' ]; then
                  post_endpoint proposals/prepare-top 60
                  post_endpoint quality/review-next 60
                fi
                ;;
              TRAVEL)
                post_endpoint travel/acquisition/run 90
                ;;
              REFERRAL)
                post_endpoint referrals/commissions/plan 90
                ;;
              PARTNER)
                post_endpoint partners/discover 180
                post_endpoint partners/match 90
                if [ "$role" = 'PRIMARY' ]; then post_endpoint partners/council 90; fi
                ;;
              VENTURE)
                post_endpoint venture-intake/run 90
                ;;
              *)
                echo "UNKNOWN_MULTIPLIER_LANE=$lane"
                exit 1
                ;;
            esac
          }

          activate_lane "$PRIMARY" PRIMARY
          if [ -n "${EXPLORATION:-}" ] && [ "$EXPLORATION" != "$PRIMARY" ]; then
            activate_lane "$EXPLORATION" EXPLORATION
          fi

          echo 'GROWTH_MULTIPLIER_SAFE_ACTIVATION_COMPLETE'
          echo 'NO_NEW_SPEND_OR_BINDING_AUTHORITY_GRANTED'

      - name: Execute exactly one Foundry v2 motor safely
        if: steps.foundry.outputs.action != 'NONE'
        env:
          ADMIN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          test -s /tmp/foundry.json
          jq -e '.directive.candidate and (.directive.candidate.primitives | length) >= 1 and (.directive.candidate.primitives | length) <= 3 and .guardrails.oneFoundryMotorExecutionPerCycle == true' /tmp/foundry.json >/dev/null

          post_endpoint() {
            local endpoint="$1"
            local timeout="${2:-90}"
            local body="/tmp/gf-${endpoint//\//-}.json"
            local code
            code=$(curl --show-error --silent --max-time "$timeout" -o "$body" -w '%{http_code}' \
              -X POST "$base/$endpoint" \
              -H "x-lumen-admin: $ADMIN" \
              -H 'content-type: application/json' -d '{}')
            echo "===== FOUNDRY V2 $endpoint HTTP $code ====="
            cat "$body"; echo
            case "$code" in 200|202) ;; *) echo "unexpected Foundry primitive $endpoint HTTP $code"; exit 1 ;; esac
          }

          while IFS= read -r primitive; do
            echo "===== FOUNDRY V2 STATIC PRIMITIVE: $primitive ====="
            case "$primitive" in
              B2B_DISCOVERY)
                post_endpoint source-intelligence/cycle 120
                post_endpoint market-hunter/run 120
                ;;
              B2B_CONVERSION)
                post_endpoint commercial/reassess 90
                post_endpoint proposals/prepare-top 60
                post_endpoint quality/review-next 60
                ;;
              PARTNER_NETWORK)
                post_endpoint partners/discover 180
                post_endpoint partners/match 90
                ;;
              VENTURE_INTAKE)
                post_endpoint venture-intake/run 90
                ;;
              REFERRAL_MONETIZATION)
                post_endpoint referrals/commissions/plan 90
                ;;
              TRAVEL_ACQUISITION)
                post_endpoint travel/acquisition/run 90
                ;;
              *)
                echo "UNKNOWN_FOUNDRY_PRIMITIVE=$primitive"
                exit 1
                ;;
            esac
          done < <(jq -r '.directive.candidate.primitives[]' /tmp/foundry.json)

          echo 'GROWTH_FOUNDRY_V2_MOTOR_EXECUTED'
          echo 'ONE_MOTOR_PER_CYCLE_STATIC_WHITELIST_ONLY'
          echo 'NO_NEW_SPEND_OR_BINDING_AUTHORITY_GRANTED'

      - name: Read autonomous state
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for endpoint in growth-foundry/status growth-multiplier/status growth/status market-hunter/state commercial/next proposals/next quality/stats travel/acquisition/status partners/ideas/stats venture-intake/stats referrals/commissions/stats; do
            echo "===== /$endpoint ====="
            curl --fail --show-error --silent --max-time 30 "$base/$endpoint" || true
            echo
          done

      - name: Verify persisted learning experiments and guardrails
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 30 "$base/growth-foundry/status" -o /tmp/foundry-status.json
          curl --fail --show-error --silent --max-time 30 "$base/growth-multiplier/status" -o /tmp/multiplier-status.json
          curl --fail --show-error --silent --max-time 30 "$base/growth/status" -o /tmp/growth-status.json
          jq -e '
            .version == "2.0-growth-engine-foundry-experiment-optimizer" and
            .initialized == true and
            (.cycle >= 1) and
            .attention.mode and
            .guardrails.autonomousSpendUsd == 0 and
            .guardrails.createsExternalMessages == false and
            .guardrails.executesGeneratedCode == false and
            .guardrails.primitiveExecutionRequiresStaticWhitelist == true and
            .guardrails.maxConcurrentExperiments == 1 and
            .guardrails.deterministicAlternatingExperimentArms == true and
            .guardrails.bindingActionsHumanGated == true
          ' /tmp/foundry-status.json >/dev/null
          jq -e '.version == "2.0-growth-multiplier-compounding" and .initialized == true and .primaryLane and .guardrails.autonomousSpendUsd == 0 and .guardrails.createsExternalMessages == false and .guardrails.bindingActionsHumanGated == true and .guardrails.verifiedRevenueOnly == true' /tmp/multiplier-status.json >/dev/null
          jq -e '.version == "1.2-autonomous-growth-loop-commercial-truth" and .initialized == true and .latest.selected_lane and .guidance.selected_lane' /tmp/growth-status.json >/dev/null
          jq -e '.guardrails.autonomousOutgoingSpend == false and .guardrails.bindingActionsHumanGated == true' /tmp/growth-status.json >/dev/null
          echo 'AUTONOMOUS_FOUNDRY_V2_EXPERIMENT_CYCLE_PERSISTED_OK'
