name: LUMEN Viator API key sync

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-viator-api-key-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'CLOUDFLARE_SECRETS_MISSING'
            exit 2
          fi
          if [ -z "$VIATOR_API_KEY" ]; then
            echo 'viator_configured=false' >> "$GITHUB_OUTPUT"
            echo 'VIATOR_API_KEY_NOT_CONFIGURED'
            if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              exit 3
            fi
            exit 0
          fi
          echo 'viator_configured=true' >> "$GITHUB_OUTPUT"
          echo 'VIATOR_API_KEY_PRESENT'
      - name: Sync Viator API key to Cloudflare Worker
        if: steps.secrets.outputs.viator_configured == 'true'
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
        run: |
          set -euo pipefail
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.toml
          printf '%s' "$VIATOR_API_KEY" | npx --yes wrangler@latest secret put VIATOR_API_KEY --config wrangler.toml
          echo 'VIATOR_API_KEY_SYNCED'
      - name: Verify runtime sees API configuration
        if: steps.secrets.outputs.viator_configured == 'true'
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "$BASE/viator/api/status" -o status.json && jq -e '.version == "1.0-viator-partner-api" and .configured == true and .secretExposed == false' status.json >/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo 'VIATOR_API_CONFIGURED'
      - name: Report fallback mode
        if: steps.secrets.outputs.viator_configured != 'true'
        run: echo 'VIATOR_FALLBACK_AFFILIATE_MODE_REMAINS_ACTIVE'
