name: LUMEN Travel v1 Smoke

on:
  push:
    branches: [lumen-travel-v1]
    paths:
      - '.lumen/a2a-worker/travel-consumer-engine.js'
      - '.lumen/a2a-worker/travel-demand-bridge.js'
      - '.lumen/a2a-worker/travel-provider-registry.js'
      - '.lumen/a2a-worker/travel-provider-backed-discovery.js'
      - '.lumen/a2a-worker/travel-external-providers.js'
      - '.lumen/a2a-worker/travel-affiliate-registry.js'
      - '.lumen/a2a-worker/travel-consumer-entry.js'
      - '.github/scripts/lumen-travel-v1-test.mjs'
      - '.github/scripts/lumen-travel-provider-backed-test.mjs'
      - '.github/scripts/lumen-travel-external-providers-test.mjs'
      - '.github/workflows/lumen-travel-v1-smoke.yml'
  workflow_dispatch:

jobs:
  travel-v1-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check travel engine
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-consumer-engine.js

      - name: Syntax check Demand-First bridge
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-demand-bridge.js

      - name: Syntax check provider registry
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-provider-registry.js

      - name: Syntax check provider-backed discovery
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-provider-backed-discovery.js

      - name: Syntax check external providers
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-external-providers.js

      - name: Syntax check affiliate registry
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-affiliate-registry.js

      - name: Syntax check wrapper entrypoint
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-consumer-entry.js

      - name: Run deterministic travel tests
        run: node --experimental-default-type=module .github/scripts/lumen-travel-v1-test.mjs

      - name: Run provider-backed discovery tests
        run: node --experimental-default-type=module .github/scripts/lumen-travel-provider-backed-test.mjs

      - name: Run external provider and affiliate tests
        run: node --experimental-default-type=module .github/scripts/lumen-travel-external-providers-test.mjs

      - name: Verify safety invariants
        run: |
          set -euo pipefail
          grep -q 'autonomousSpend: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'createsBooking: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'storesIpAddress: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'realTimeFares: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'automaticCommercialActivation: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'automaticOutreach: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'storesPii: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'activationRequiresAdmin: true' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'createsBooking: false' .lumen/a2a-worker/travel-provider-registry.js
          grep -q 'createsCharge: false' .lumen/a2a-worker/travel-provider-registry.js
          grep -q 'autonomousSpend: false' .lumen/a2a-worker/travel-provider-registry.js
          grep -q 'supportsRealtime: false' .lumen/a2a-worker/travel-external-providers.js
          grep -q 'supportsBooking: false' .lumen/a2a-worker/travel-external-providers.js
          grep -q 'disabledWithoutCredentials: true' .lumen/a2a-worker/travel-external-providers.js
          grep -q 'noSyntheticAffiliateIds: true' .lumen/a2a-worker/travel-affiliate-registry.js
          grep -q 'noBookingAuthority: true' .lumen/a2a-worker/travel-affiliate-registry.js
          grep -q 'autonomousSpend: false' .lumen/a2a-worker/travel-affiliate-registry.js
          grep -q 'searchUsesProviderRegistry: true' .lumen/a2a-worker/travel-provider-backed-discovery.js
          grep -q 'bookingCreated: false' .lumen/a2a-worker/travel-provider-backed-discovery.js
          grep -q 'chargeCreated: false' .lumen/a2a-worker/travel-provider-backed-discovery.js
          grep -q 'autonomousSpend: false' .lumen/a2a-worker/travel-provider-backed-discovery.js