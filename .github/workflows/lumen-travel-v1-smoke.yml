name: LUMEN Travel v1 Smoke

on:
  push:
    branches: [lumen-travel-v1]
    paths:
      - '.lumen/a2a-worker/travel-consumer-engine.js'
      - '.lumen/a2a-worker/travel-demand-bridge.js'
      - '.lumen/a2a-worker/travel-consumer-entry.js'
      - '.github/scripts/lumen-travel-v1-test.mjs'
      - '.github/workflows/lumen-travel-v1-smoke.yml'
  workflow_dispatch:

jobs:
  travel-v1-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check travel engine
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-consumer-engine.js

      - name: Syntax check Demand-First bridge
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-demand-bridge.js

      - name: Syntax check wrapper entrypoint
        run: node --experimental-default-type=module --check .lumen/a2a-worker/travel-consumer-entry.js

      - name: Run deterministic travel tests
        run: node --experimental-default-type=module .github/scripts/lumen-travel-v1-test.mjs

      - name: Verify safety invariants
        run: |
          set -euo pipefail
          grep -q 'autonomousSpend: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'createsBooking: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'storesIpAddress: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'realTimeFares: false' .lumen/a2a-worker/travel-consumer-engine.js
          grep -q 'automaticCommercialActivation: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'automaticOutreach: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'storesPii: false' .lumen/a2a-worker/travel-demand-bridge.js
          grep -q 'activationRequiresAdmin: true' .lumen/a2a-worker/travel-demand-bridge.js