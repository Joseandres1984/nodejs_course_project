name: LUMEN x402 deploy
# Tender Hot Lead deploy trigger 2026-10-07

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/x402-worker/**'
      - '.github/workflows/lumen-x402-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/x402-worker/**'
      - '.github/workflows/lumen-x402-deploy.yml'
  workflow_dispatch:

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check x402 entrypoints and approval logic
        run: |
          node --check .lumen/x402-worker/settlement-approval.js
          node --check .lumen/x402-worker/entry.js
          node --check .lumen/x402-worker/worker-v2.js
          node --check .lumen/x402-worker/discovery.js
          node --check .lumen/x402-worker/commission-checkout.js
      - name: Install x402 Bazaar dependencies for regression
        working-directory: .lumen/x402-worker
        run: npm install --no-audit --no-fund
      - name: Test human authorization and Bazaar discovery (no payments)
        run: |
          node .lumen/x402-worker/test-settlement-approval.mjs
          node .lumen/x402-worker/test-discovery.mjs
          node .lumen/x402-worker/test-bazaar-discovery.mjs
  deploy-x402:
    needs: validate-approval
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'REQUIRED_SECRETS_MISSING'
            exit 2
          fi
          echo 'REQUIRED_SECRETS_PRESENT'
      - name: Install x402 worker dependencies
        working-directory: .lumen/x402-worker
        run: npm install --no-audit --no-fund
      - name: Deploy lumen-zero-x402
        working-directory: .lumen/x402-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify live x402 seller checkout
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-x402.lumen-b2b.workers.dev'
          ready=0
          for i in $(seq 1 20); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$BASE/health" || true)"
            if [ "$code" = '200' ] && jq -e '.ok == true and .x402 == "LIVE" and .recipientConfigured == true and .resourceServerInitialized == true and .outgoingSpendEnabled == false' "$body" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" -eq 1
          curl -fsS --max-time 20 "$BASE/catalog" | jq -e '.settlement.outgoingSpendEnabled == false and (.products | length) >= 1' >/dev/null
          curl -fsS --max-time 20 "$BASE/approvals/policy" | jq -e '
            .humanApprovalRequired == true and
            .defaultDeny == true and
            .oneTime == true and
            .automaticApproval == false and
            (.coveredRoutes | index("/buy/*") != null) and
            (.coveredRoutes | index("/commission/*") != null)
          ' >/dev/null
          owner_code="$(curl -sS --max-time 20 -o /tmp/x402-owner-test.json -w '%{http_code}' -X POST "$BASE/approvals/X402A-FAKE/approve")"
          test "$owner_code" = '403'
          jq -e '.ok == false' /tmp/x402-owner-test.json >/dev/null
          echo 'X402_HUMAN_APPROVAL_FAIL_CLOSED_LIVE_OK'
          discovery_ready=0
          for n in $(seq 1 18); do
            openapi_code=$(curl --silent --show-error --max-time 20 -o /tmp/x402-openapi.json -w '%{http_code}' "$BASE/openapi.json" || true)
            wellknown_code=$(curl --silent --show-error --max-time 20 -o /tmp/x402-discovery.json -w '%{http_code}' "$BASE/.well-known/x402" || true)
            llms_code=$(curl --silent --show-error --max-time 20 -o /tmp/x402-llms.txt -w '%{http_code}' "$BASE/llms.txt" || true)
            echo "DISCOVERY_PROBE attempt=$n openapi=$openapi_code wellknown=$wellknown_code llms=$llms_code"
            if [ "$openapi_code" = '200' ] && [ "$wellknown_code" = '200' ] && [ "$llms_code" = '200' ]; then
              discovery_ready=1
              break
            fi
            sleep 3
          done
          test "$discovery_ready" -eq 1
          jq -e '
            .openapi == "3.1.0" and
            (.paths | length) == 7 and
            (.["x-payment-policy"].ownerApprovalRequired == true) and
            ( [.paths[]?.get["x-payment-info"] | select(.protocols | any(. == "x402" or (type == "object" and has("x402"))))] | length == 7)
          ' /tmp/x402-openapi.json >/dev/null
          jq -e '.version == 1 and .ownerApprovalRequired == true and (.resources | length) == 7' /tmp/x402-discovery.json >/dev/null
          grep -F -q 'owner must' /tmp/x402-llms.txt || grep -F -q 'owner approval' /tmp/x402-llms.txt
          unsigned_status=$(curl --silent --show-error --max-time 20 -o /tmp/x402-unsigned.json -w '%{http_code}' "$BASE/buy/supplier-snapshot")
          test "$unsigned_status" = '402'
          echo 'LUMEN_X402_DISCOVERY_SEVEN_ROUTES_LIVE_OK'
          echo 'X402_SELLER_CHECKOUT_LIVE_OK'
