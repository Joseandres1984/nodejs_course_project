name: LUMEN Click Revenue Live

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-click-revenue-live.yml'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Read click revenue truth
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '===== STATUS ====='
          curl --fail --show-error --silent --max-time 30 "$base/click-revenue/status"
          echo
          echo '===== PROGRAMS ====='
          curl --fail --show-error --silent --max-time 30 "$base/click-revenue/programs"
          echo
          echo '===== POLICY ====='
          curl --fail --show-error --silent --max-time 30 "$base/click-revenue/policy"
          echo
