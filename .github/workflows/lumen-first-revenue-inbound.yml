name: LUMEN First Revenue Inbound

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-first-revenue-inbound.yml'

jobs:
  reply-to-qualified-inbound:
    runs-on: ubuntu-latest
    steps:
      - name: Run one guarded commercial reply
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          body='/tmp/reply.json'
          code=$(curl --show-error --silent --max-time 60 -o "$body" -w '%{http_code}' \
            -X POST "$base/commercial-reply/run" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json')
          echo "===== guarded commercial reply HTTP $code ====="
          cat "$body"
          echo
          test "$code" = '202'

      - name: Read conversion state
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '===== /commercial-reply/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/commercial-reply/stats"
          echo
          echo '===== /first-cash/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/first-cash/stats"
          echo
          echo '===== /outreach/next ====='
          curl --fail --show-error --silent --max-time 30 "$base/outreach/next"
          echo
