name: LUMEN Dashboard v2 deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/dashboard/**'
      - '.github/workflows/lumen-dashboard-v2-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore Secretaria compatibility route
        working-directory: .lumen/dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = 'if (request.method === "GET" && (url.pathname === "/" || url.pathname === "/index.html")) {'
          new = 'if (request.method === "GET" && (url.pathname === "/" || url.pathname === "/index.html" || url.pathname === "/secretaria" || url.pathname === "/secretaria/")) {'
          if old not in s:
              raise SystemExit('SECRETARIA_ROUTE_PATCH_TARGET_NOT_FOUND')
          p.write_text(s.replace(old, new, 1))
          print('SECRETARIA_ROUTE_RESTORED')
          PY
      - name: Validate dashboard bundle
        working-directory: .lumen/dashboard
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
      - name: Verify required secrets before touching live dashboard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASH_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$DASH_PASSWORD" ] || [ -z "$OPPORTUNITY_ADMIN_TOKEN" ]; then
            echo 'DASHBOARD_DEPLOY_SECRETS_MISSING_NO_LIVE_CHANGE'
            exit 2
          fi
          echo 'DASHBOARD_DEPLOY_SECRETS_PRESENT'
      - name: Deploy lumen-zero-dashboard
        working-directory: .lumen/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Restore dashboard password secret
        working-directory: .lumen/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASH_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
        run: printf '%s' "$DASH_PASSWORD" | npx --yes wrangler@latest secret put LUMEN_DASHBOARD_PASSWORD --config wrangler.toml
      - name: Restore dashboard A2A admin bridge secret
        working-directory: .lumen/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
      - name: Smoke live dashboard data plane
        env:
          DASH_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-dashboard.lumen-b2b.workers.dev'
          for path in /health /api/control-tower-v2 /api/network-control-v1 /api/data; do
            body="$(mktemp)"
            code="$(curl -sS --retry 4 --retry-delay 2 -u "socio:${DASH_PASSWORD}" -o "$body" -w '%{http_code}' "${BASE}${path}")"
            if [ "$code" != '200' ]; then
              echo "DASHBOARD_LIVE_SMOKE_FAILED path=${path} http=${code}"
              cat "$body"
              exit 1
            fi
            python -m json.tool < "$body" >/dev/null
            echo "DASHBOARD_LIVE_SMOKE_OK path=${path}"
          done

          data="$(mktemp)"
          curl -fsS --retry 4 --retry-delay 2 -u "socio:${DASH_PASSWORD}" "${BASE}/api/data" -o "$data"
          jq -e '.source == "live_d1_a2a_canonical" and .services.public_web.status == "online" and .services.public_web.probe == "service_binding"' "$data" >/dev/null
          echo 'DASHBOARD_PUBLIC_WEB_SERVICE_BINDING_OK'

          jq -e '.services.gmail.status | type == "string"' "$data" >/dev/null
          jq -e '.services.gmail.probe_message_sent == false' "$data" >/dev/null
          gmail_status="$(jq -r '.services.gmail.status' "$data")"
          gmail_fresh="$(jq -r '.services.gmail.fresh' "$data")"
          if [ "$gmail_status" = 'online' ]; then
            jq -e '.outbound.mail_ready == true and .services.gmail.live == true and .services.gmail.fresh == true and .services.gmail.imap_live == true and .services.gmail.outbound_live == true' "$data" >/dev/null
            echo 'DASHBOARD_GMAIL_CHANNEL_HEALTH_OK'
          else
            echo "DASHBOARD_GMAIL_CHANNEL_TRUTHFUL_NONONLINE status=${gmail_status} fresh=${gmail_fresh}"
          fi

          control="$(mktemp)"
          curl -fsS --retry 4 --retry-delay 2 -u "socio:${DASH_PASSWORD}" "${BASE}/api/control-tower-v2" -o "$control"
          jq -e '.system.x402 == "READY" and .system.x402Live == true and .system.x402StatusSource == "x402_service_binding"' "$control" >/dev/null
          echo 'DASHBOARD_X402_SERVICE_BINDING_READY'

          for page_path in / /secretaria /conversar; do
            page="$(mktemp)"
            code="$(curl -sS --retry 4 --retry-delay 2 -u "socio:${DASH_PASSWORD}" -o "$page" -w '%{http_code}' "${BASE}${page_path}")"
            if [ "$code" != '200' ]; then
              echo "DASHBOARD_HTML_SMOKE_FAILED path=${page_path} http=${code}"
              exit 1
            fi
            if [ "$page_path" != '/conversar' ]; then
              if ! grep -q 'id="ntState">RED ' "$page"; then
                echo "DASHBOARD_NETWORK_NOT_SERVER_HYDRATED path=${page_path}"
                grep -o 'id="ntState">[^<]*' "$page" || true
                exit 1
              fi
              if grep -q 'id="ntState">CARGANDO RED' "$page"; then
                echo "DASHBOARD_NETWORK_STILL_LOADING_IN_INITIAL_HTML path=${page_path}"
                exit 1
              fi
            else
              grep -q 'LUMEN · Conversación operativa' "$page"
              grep -q '¿Cómo vas a mejorar?' "$page"
            fi
            echo "DASHBOARD_HTML_SMOKE_OK path=${page_path}"
          done
          echo 'SECRETARIA_COMPATIBILITY_ROUTE_OK'

      - name: Smoke conversational A2A bridge after deploy
        env:
          DASH_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-dashboard.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 20); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -u "socio:${DASH_PASSWORD}" -o "$body" -w '%{http_code}' "${BASE}/api/lumen-mind")"
            if [ "$code" = '200' ] && jq -e '.ok == true and .version == "1.0-lumen-conversational-mind"' "$body" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "WAITING_FOR_LUMEN_CONVERSATIONAL_A2A attempt=${i} http=${code}"
            sleep 4
          done
          test "$ok" -eq 1
          echo 'DASHBOARD_LUMEN_CONVERSATION_BRIDGE_OK'
