name: LUMEN Reputation Blend Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-reputation-blend-smoke.yml'
  workflow_dispatch:

jobs:
  reputation-blend-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Partner Matching v1.3
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl --show-error --silent --max-time 20 -o /tmp/match.json -w '%{http_code}' \
              -X POST "$BASE_URL/partners/match" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'content-type: application/json' \
              -d '{}' || true)
            cat /tmp/match.json 2>/dev/null || true
            echo
            if [ "$code" = '202' ] && grep -q '1.3-partner-council-quality' /tmp/match.json; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify confidence gate and current zero blend
        run: |
          set -euo pipefail
          jq -e '.ok == true and .observedReputationPolicy.minimumConfidence == 30 and .observedReputationPolicy.maxBlendWeightPercent == 45' /tmp/match.json >/dev/null
          jq -e '[.matches[] | select(.observedConfidence < 30 and .reputationBlendWeight != 0)] | length == 0' /tmp/match.json >/dev/null
          echo 'Observed reputation remains non-influential below confidence 30.'
