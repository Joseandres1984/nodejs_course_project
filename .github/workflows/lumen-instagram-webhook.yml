name: LUMEN Instagram Webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lumen-instagram-webhook.yml

permissions:
  contents: read

concurrency:
  group: lumen-instagram-webhook-deploy
  cancel-in-progress: true

jobs:
  deploy-instagram-webhook:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      LUMEN_INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${{ secrets.LUMEN_INSTAGRAM_WEBHOOK_VERIFY_TOKEN }}
      LUMEN_INSTAGRAM_APP_SECRET: ${{ secrets.LUMEN_INSTAGRAM_APP_SECRET }}
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Webhook deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$LUMEN_INSTAGRAM_WEBHOOK_VERIFY_TOKEN" && -n "$LUMEN_INSTAGRAM_APP_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Instagram webhook deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Instagram webhook is prepared but waiting for verify token and app secret."
          fi

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy Instagram webhook Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-webhook
        run: npx --yes wrangler@4 deploy

      - name: Install webhook verify token
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-webhook
        shell: bash
        run: printf '%s' "$LUMEN_INSTAGRAM_WEBHOOK_VERIFY_TOKEN" | npx --yes wrangler@4 secret put LUMEN_INSTAGRAM_WEBHOOK_VERIFY_TOKEN

      - name: Install Instagram app secret
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-webhook
        shell: bash
        run: printf '%s' "$LUMEN_INSTAGRAM_APP_SECRET" | npx --yes wrangler@4 secret put LUMEN_INSTAGRAM_APP_SECRET

      # Deploy trigger: Instagram credentials configured by operator.
