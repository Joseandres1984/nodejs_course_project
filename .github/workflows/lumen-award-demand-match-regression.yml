name: LUMEN Award-to-Demand Evidence Test

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/source-intelligence.js'
      - '.lumen/a2a-worker/test-award-to-active-demand.mjs'
      - '.github/workflows/lumen-award-demand-match-regression.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/source-intelligence.js'
      - '.lumen/a2a-worker/test-award-to-active-demand.mjs'
      - '.github/workflows/lumen-award-demand-match-regression.yml'

permissions:
  contents: read
jobs:
  evidence-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify precise public award/tender matching and read-only boundaries
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/source-intelligence.js
          node .lumen/a2a-worker/test-official-procurement-network.mjs
          node .lumen/a2a-worker/test-procurement-buyer-contact-bridge.mjs
          node .lumen/a2a-worker/test-award-to-active-demand.mjs
