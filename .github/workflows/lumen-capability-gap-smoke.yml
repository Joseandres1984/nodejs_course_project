name: LUMEN Capability Gap Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-capability-gap-smoke.yml'
  workflow_dispatch:

jobs:
  capability-gap-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Capability Gap Engine v1
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/capability-gaps/stats" || true)
            echo "$body"
            if echo "$body" | grep -q '1.0-capability-gap-engine'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Recompute real capability gaps
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            -X POST "$BASE_URL/capability-gaps/recompute" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/gaps.json
          cat /tmp/gaps.json
          echo
          jq -e '.ok == true and .version == "1.0-capability-gap-engine" and .guardrails.autonomousRecruitmentContact == false and .guardrails.autonomousSpend == false and .guardrails.bindingActionsHumanGated == true' /tmp/gaps.json >/dev/null

      - name: Verify live gap state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/capability-gaps/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.0-capability-gap-engine" and .autonomousRecruitmentContact == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null
