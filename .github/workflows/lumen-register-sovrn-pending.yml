name: LUMEN Register Sovrn Pending

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-register-sovrn-pending.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Register Sovrn tracking URL as pending only
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          code=$(curl --show-error --silent --max-time 30 -o /tmp/register.json -w '%{http_code}'             -X POST "$BASE_URL/click-revenue/programs/register"             -H "x-lumen-admin: $ADMIN_TOKEN"             -H 'content-type: application/json'             -d '{"id":"sovrn-commerce-cpc","provider":"Sovrn Commerce","name":"Sovrn Commerce CPC","model":"CPC","trackingUrl":"https://sovrn.co/yj7fjei","sourceUrl":"https://www.sovrn.com/sovrn-for-creators/","currency":"USD","status":"PENDING_APPROVAL"}')
          echo "REGISTER_HTTP=$code"
          cat /tmp/register.json; echo
          test "$code" = '202'
          jq -e '.ok == true and .status == "PENDING_APPROVAL" and .active == false and .enrollmentExecuted == false and .contractCreated == false and .spendExecuted == false' /tmp/register.json >/dev/null

      - name: Read protected config state
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30             -H "x-lumen-admin: $ADMIN_TOKEN"             "$BASE_URL/click-revenue/config"
          echo
