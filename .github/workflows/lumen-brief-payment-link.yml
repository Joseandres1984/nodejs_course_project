name: LUMEN Brief to Payment Traceability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-brief-payment-link.yml"

permissions:
  contents: write

concurrency:
  group: lumen-brief-payment-link
  cancel-in-progress: true

jobs:
  brief-payment-link:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      CONVERSION_BASE_URL: "https://lumen-zero-conversion.lumen-b2b.workers.dev"
      X402_BASE_URL: "https://lumen-zero-x402.lumen-b2b.workers.dev"
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero
          fetch-depth: 0

      - name: Apply traceability migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .lumen/migrations/apply_brief_payment_link.py
          node --check .lumen/conversion-worker/worker.js
          node --check .lumen/x402-worker/worker-v2.js

      - name: Commit traceability source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .lumen/conversion-worker/worker.js .lumen/x402-worker/worker-v2.js
          if git diff --cached --quiet; then
            echo 'Traceability source already current.'
          else
            git commit -m 'Link customer briefs to settled x402 fulfillment'
            git push origin HEAD:lumen-zero
          fi

      - name: Deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy Conversion Loop
        working-directory: .lumen/conversion-worker
        run: npx --yes wrangler@4 deploy

      - name: Install and deploy x402
        working-directory: .lumen/x402-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy

      - name: Verify brief to checkout trace without payment
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for i in {1..18}; do
            ch=$(curl -sS -o /tmp/ch.json -w '%{http_code}' "$CONVERSION_BASE_URL/health?brief_link=${GITHUB_RUN_ID}-${i}" || true)
            xh=$(curl -sS -o /tmp/xh.json -w '%{http_code}' "$X402_BASE_URL/health?brief_link=${GITHUB_RUN_ID}-${i}" || true)
            cflag=$(jq -r '.briefLinkedCheckout // false' /tmp/ch.json 2>/dev/null || echo false)
            xflag=$(jq -r '.briefLinkedFulfillment // false' /tmp/xh.json 2>/dev/null || echo false)
            if [[ "$ch" == "200" && "$xh" == "200" && "$cflag" == "true" && "$xflag" == "true" ]]; then
              ready=1
              break
            fi
            sleep 4
          done
          if [[ "$ready" != "1" ]]; then
            echo 'Conversion health:'
            cat /tmp/ch.json || true
            echo
            echo 'x402 health:'
            cat /tmp/xh.json || true
            echo
            echo 'ERROR_STAGE=edge_readiness'
            exit 1
          fi

          CJ=/tmp/lumen-brief-cookies.txt
          Q='src=technical-canary&medium=deploy&campaign=brief-link-canary&technical_canary=1'

          offer_code=$(curl -sS -c "$CJ" -b "$CJ" -o /tmp/offer.html -w '%{http_code}' "$CONVERSION_BASE_URL/offer/supplier-snapshot?$Q" || true)
          if [[ "$offer_code" != "200" ]]; then
            echo "ERROR_STAGE=offer status=$offer_code"
            head -c 1200 /tmp/offer.html || true
            exit 1
          fi

          intent_code=$(curl -sS -c "$CJ" -b "$CJ" -D /tmp/intent.headers -o /tmp/intent.body -w '%{http_code}' -X POST \
            -F 'email=technical-brief-link@example.invalid' \
            -F 'company=LUMEN Brief Link Canary' \
            -F 'details=Technical canary requirement for brief-to-payment trace verification only.' \
            -F 'next=checkout' \
            "$CONVERSION_BASE_URL/intent/supplier-snapshot?$Q" || true)
          if [[ "$intent_code" != "303" ]]; then
            echo "ERROR_STAGE=intent status=$intent_code"
            sed -n '1,30p' /tmp/intent.headers || true
            head -c 1200 /tmp/intent.body || true
            exit 1
          fi

          GO=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/intent.headers').read_text(errors='replace')
          m=re.search(r'(?im)^location:\s*(.*?)\r?$', text)
          if not m:
              raise SystemExit('missing Location after intent')
          print(m.group(1).strip())
          PY
          )
          BRIEF_ID=$(python3 - "$GO" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          u=urlparse(sys.argv[1])
          if u.path != '/go/supplier-snapshot':
              raise SystemExit(f'unexpected go path: {u.path}')
          q=parse_qs(u.query)
          brief=(q.get('brief_id') or [''])[0]
          if not brief.startswith('CL-'):
              raise SystemExit('missing/invalid brief_id in go redirect')
          print(brief)
          PY
          )
          echo "TRACE_STAGE=intent_to_go brief_id=$BRIEF_ID"

          go_code=$(curl -sS -c "$CJ" -b "$CJ" -D /tmp/go.headers -o /tmp/go.body -w '%{http_code}' "$CONVERSION_BASE_URL$GO" || true)
          if [[ "$go_code" != "302" ]]; then
            echo "ERROR_STAGE=go status=$go_code brief_id=$BRIEF_ID"
            sed -n '1,30p' /tmp/go.headers || true
            head -c 1200 /tmp/go.body || true
            exit 1
          fi

          XURL=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/go.headers').read_text(errors='replace')
          m=re.search(r'(?im)^location:\s*(.*?)\r?$', text)
          if not m:
              raise SystemExit('missing Location after go')
          print(m.group(1).strip())
          PY
          )
          python3 - "$XURL" "$X402_BASE_URL" "$BRIEF_ID" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          x=urlparse(sys.argv[1])
          base=urlparse(sys.argv[2])
          expected_brief=sys.argv[3]
          if (x.scheme, x.netloc) != (base.scheme, base.netloc):
              raise SystemExit('checkout origin mismatch')
          if x.path != '/buy/supplier-snapshot':
              raise SystemExit(f'unexpected checkout path: {x.path}')
          q=parse_qs(x.query)
          got=(q.get('brief_id') or [''])[0]
          if got != expected_brief:
              raise SystemExit(f'brief_id continuity failed: {got!r} != {expected_brief!r}')
          if not (q.get('conversion_event') and q.get('conversion_session')):
              raise SystemExit('conversion attribution missing from checkout URL')
          print('TRACE_STAGE=go_to_x402 brief_continuity=pass attribution=pass')
          PY

          code=$(curl -sS -H 'Accept: application/json' -D /tmp/x402.headers -o /tmp/x402.body -w '%{http_code}' "$XURL" || true)
          if [[ "$code" != "402" ]]; then
            echo "ERROR_STAGE=x402_challenge status=$code brief_id=$BRIEF_ID"
            sed -n '1,30p' /tmp/x402.headers || true
            head -c 1200 /tmp/x402.body || true
            exit 1
          fi
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          headers=Path('/tmp/x402.headers').read_text(errors='replace').lower()
          body=Path('/tmp/x402.body').read_text(errors='replace')
          header_ok=bool(re.search(r'(?im)^(payment-required|x-payment-required):', headers))
          body_ok=False
          try:
              obj=json.loads(body)
              raw=json.dumps(obj).lower()
              body_ok=any(k in raw for k in ['payment-required','paymentrequired','x402version','accepts','payto'])
          except Exception:
              low=body.lower()
              body_ok='payment' in low and ('x402' in low or 'usdc' in low or 'base' in low)
          if not (header_ok or body_ok):
              raise SystemExit('402 returned without a recognizable x402 payment challenge')
          print('TRACE_STAGE=x402_challenge challenge=pass payment_attempted=false')
          PY

          echo "BRIEF_TO_PAYMENT_TRACE=success brief_id=$BRIEF_ID payment_attempted=false outgoing_spend=false"

      - name: Verify revenue truth remains settlement-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$X402_BASE_URL/stats?trace=${GITHUB_RUN_ID}" -o /tmp/stats.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/stats.json'))
          rule=s.get('revenueRule','')
          assert 'settled_verified' in rule and 'authorization alone never counts' in rule, s
          assert float(s.get('realizedRevenueUsd') or 0) >= 0
          print({'revenue_truth':'settlement_only','realizedRevenueUsd':s.get('realizedRevenueUsd'),'payment_attempted':False})
          PY
