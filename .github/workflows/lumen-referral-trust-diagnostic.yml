name: LUMEN Referral Trust Diagnostic

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-referral-trust-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Read trust records for current referral partners
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          curl --fail --show-error --silent --max-time 45             -H "x-lumen-admin: $ADMIN_TOKEN"             "$BASE_URL/trust/partners" -o /tmp/trust.json
          jq '{
            selected: [
              .partners[] |
              select(
                .partner_id == "PAR-47226E0A6A5412D0A381" or
                .partner_id == "PAR-7158FB51354055416E6F" or
                .partner_id == "PAR-6FFC7D6CE2EBD7E80030"
              ) |
              {
                partner_id,name,trust_score,trust_level,auth_required,
                manipulation_hits,card_fetch_status,https_card,https_endpoint,
                protocol_supported,runtime_failures,reasons
              }
            ]
          }' /tmp/trust.json
