name: LUMEN Recruitment Reconcile Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-recruitment-reconcile-smoke.yml'
  workflow_dispatch:

jobs:
  reconcile-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
    steps:
      - name: Wait for Recruitment Engine v1.0.1
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/recruitment/stats" || true)
            echo "$body"
            if echo "$body" | grep -q '1.0.1-partner-recruitment'; then
              exit 0
            fi
            sleep 5
          done
          echo 'RECRUITMENT_1_0_1_NOT_READY'
          exit 1
      - name: Verify acknowledgement reconciliation
        run: |
          set -euo pipefail
          echo '===== stats ====='
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/recruitment/stats"
          echo
          echo '===== latest ====='
          body=$(curl --fail --show-error --silent --max-time 20 "$BASE_URL/recruitment/next")
          echo "$body"
          if echo "$body" | grep -q '"response_text":null'; then
            echo "$body" | grep -Eq '"status":"SENT"|"status":"SENT_TASK"'
          fi
