name: LUMEN LeadFlow Safe Demo Deploy

on:
  push:
    branches: [lumen-leadflow-ai-mvp-20261022]
    paths:
      - '.github/workflows/lumen-leadflow-demo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-leadflow-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-demo-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.LUMEN_D1_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: leadflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if Cloudflare secrets are unavailable
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare token not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID not configured"; exit 1; }
      - name: Assert demo has no persistence or commercial calls
        run: |
          set -euo pipefail
          grep -q '^SUBMISSIONS_ENABLED = "false"$' wrangler.toml
          ! grep -q '^[[:space:]]*\[\[d1_databases\]\]' wrangler.toml
          npm test
      - name: Deploy separate non-persistent demo Worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml 2>&1 | tee /tmp/leadflow-deploy.log
          BASE=$(grep -Eo 'https://[a-z0-9.-]+[.]workers[.]dev' /tmp/leadflow-deploy.log | head -1)
          test -n "$BASE"
          printf '%s' "$BASE" > /tmp/leadflow-base
          echo "Preview URL: $BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed health, UI and disabled capture
        run: |
          set -euo pipefail
          BASE=$(cat /tmp/leadflow-base)
          HEALTH_READY=0
          for attempt in $(seq 1 15); do
            STATUS=$(curl -sS -o /tmp/leadflow-health.json -w '%{http_code}' --max-time 20 "$BASE/health" || true)
            echo "Health propagation attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "200" ] && grep -q '"ok":true' /tmp/leadflow-health.json; then
              HEALTH_READY=1
              break
            fi
            sleep 5
          done
          test "$HEALTH_READY" = "1"
          curl -fsS --max-time 20 "$BASE/" > /tmp/leadflow-page.html
          grep -q 'Simular con datos ficticios' /tmp/leadflow-page.html
          curl -fsS --max-time 20 "$BASE/api/status" > /tmp/leadflow-status.json
          grep -q '"submissionsEnabled":false' /tmp/leadflow-status.json
          STATUS=$(curl -sS -o /tmp/leadflow-post.json -w '%{http_code}' --max-time 20 -X POST "$BASE/api/leads" -H 'content-type: application/json' --data '{}')
          test "$STATUS" = "503"
          echo 'LeadFlow deployed DEMO_ONLY, no stored real leads.' >> "$GITHUB_STEP_SUMMARY"
