name: LUMEN Cloudflare deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/**'
      - '.github/workflows/lumen-cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-a2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$OPPORTUNITY_ADMIN_TOKEN" ]; then
            echo 'REQUIRED_SECRETS_MISSING'
            exit 2
          fi
          echo 'REQUIRED_SECRETS_PRESENT'
      - name: Deploy lumen-zero-a2a
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Restore protected opportunity admin secret
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
      - name: Verify Opportunity Factory and Portfolio Governor live
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ready=0
          for i in $(seq 1 18); do
            if curl -fsS "$BASE/opportunity-factory/policy" -o factory-policy.json && \
               curl -fsS "$BASE/portfolio-governor/policy" -o governor-policy.json; then
              if python - <<'PY'
import json
f=json.load(open('factory-policy.json'))
g=json.load(open('governor-policy.json'))
assert f.get('version') == '1.0-opportunity-factory-portfolio'
assert g.get('version') == '1.0-portfolio-governor'
PY
              then
                ready=1
                break
              fi
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo 'PORTFOLIO_RUNTIME_NOT_READY'
            exit 3
          fi

          curl -fsS -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/opportunity-factory/run" -o factory-run.json
          curl -fsS -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/portfolio-governor/recompute" -o governor-run.json
          curl -fsS "$BASE/opportunity-factory/stats" -o factory-stats.json
          curl -fsS "$BASE/portfolio-governor/state" -o governor-state.json

          python - <<'PY'
import json
factory=json.load(open('factory-run.json'))
governor=json.load(open('governor-run.json'))
stats=json.load(open('factory-stats.json'))
state=json.load(open('governor-state.json'))
assert factory.get('ok') is True
assert factory.get('version') == '1.0-opportunity-factory-portfolio'
assert factory.get('guardrails',{}).get('createsExternalMessages') is False
assert factory.get('guardrails',{}).get('autonomousSpend') is False
assert governor.get('ok') is True
assert governor.get('version') == '1.0-portfolio-governor'
assert governor.get('guardrails',{}).get('existingBusinessProtected') is True
assert governor.get('guardrails',{}).get('maxExternalMessagesPerCycle') == 1
assert governor.get('guardrails',{}).get('autonomousSpend') is False
assert state.get('initialized') is True
assert state.get('guardrails',{}).get('maxExternalMessagesPerCycle') == 1
assert stats.get('version') == '1.0-opportunity-factory-portfolio'
print(json.dumps({
  'factory_candidates': factory.get('activeCandidates'),
  'lane_counts': factory.get('laneCounts'),
  'recommended_lane': governor.get('recommendedLane'),
  'recommended_external_action': governor.get('recommendedExternalAction'),
  'verified_revenue_usd': governor.get('metrics',{}).get('verifiedRevenueUsd')
}, indent=2))
PY
