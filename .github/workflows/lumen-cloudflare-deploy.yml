name: LUMEN Cloudflare deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/**'
      - '.github/workflows/lumen-cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  group: lumen-zero-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy-a2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify required Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          test -n "$OPPORTUNITY_ADMIN_TOKEN"
          echo 'REQUIRED_SECRETS_PRESENT'

      - name: Capture observable revenue baseline before deployment
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl -fsS --max-time 20 "$BASE/portfolio-governor/state" -o sovereign-before.json
          jq '{phase:"before_deploy",verifiedRevenueUsd:.metrics.verifiedRevenueUsd,verifiedSettlements:.metrics.verifiedSettlements,activeCandidates:.metrics.activeCandidates}' sovereign-before.json

      - name: Verify core revenue guardrails before deploy
        run: |
          set -euo pipefail
          node .lumen/a2a-worker/test-paid-boost.mjs
          node .lumen/a2a-worker/test-sovereign-revenue.mjs
          node .lumen/a2a-worker/test-bounded-supplier-resale.mjs
          node .lumen/a2a-worker/test-intramodule-evolution-v1.mjs
          node .lumen/a2a-worker/test-unified-economic-brain-v1.mjs
          node .lumen/a2a-worker/test-opportunity-factory-commercial-truth.mjs
          node .lumen/a2a-worker/test-first-settlement-mission-v1.mjs
          node .lumen/a2a-worker/test-commercial-reply-dialogue.mjs
          node .lumen/a2a-worker/venture-hunter-v1.test.mjs

      - name: Deploy code and secrets atomically to Cloudflare
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
          TIENDANUBE_APP_ID: ${{ secrets.TIENDANUBE_APP_ID }}
          TIENDANUBE_CLIENT_SECRET: ${{ secrets.TIENDANUBE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          sed -i 's/^main = "opportunity-entry.js"$/main = "paid-boost-entry.js"/' wrangler.toml
          grep -q '^main = "paid-boost-entry.js"$' wrangler.toml
          SECRETS_FILE="$RUNNER_TEMP/lumen-worker-secrets.json"
          export SECRETS_FILE
          node - <<'NODE'
          const fs = require('fs');
          const secrets = { OPPORTUNITY_ADMIN_TOKEN: process.env.OPPORTUNITY_ADMIN_TOKEN };
          for (const key of ['TIENDANUBE_APP_ID', 'TIENDANUBE_CLIENT_SECRET']) {
            if (process.env[key]) secrets[key] = process.env[key];
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          npx --yes wrangler@latest deploy --config wrangler.toml --secrets-file "$SECRETS_FILE" --var "LUMEN_V4_RELEASE_ID:$GITHUB_SHA"
          rm -f "$SECRETS_FILE"
          trap - EXIT

      - name: Smoke test public safety and intermediary policies
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/supplier-launch/policy?probe=$attempt" -o supplier-policy.json && \
               curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/paid-boost/policy?probe=$attempt" -o paid-boost-policy.json && \
               curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/first-cash/policy?probe=$attempt" -o first-cash-policy.json && \
               curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/first-settlement/policy?probe=$attempt" -o first-settlement-policy.json && \
               curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/brain/policy?probe=$attempt" -o brain-policy.json; then
              if jq -e '.version == "1.1-supplier-market-launch-evolving" and .automaticBenchmarkHydration == true and .automaticBenchmarkRequiredCurrency == "ARS" and .connectedSupplierOnly == true and .supplierRightsRequired == true and .liveStockRevalidation == true and .positiveNetMarginRequired == true and .autonomousPublishing == false and .autonomousPurchasing == false and .autonomousSpendUsd == 0 and .autonomousContracts == false and .bindingActionsHumanGated == true and .explicitHumanApprovalRequired == true' supplier-policy.json >/dev/null && \
                 jq -e '.version == "1.0-lumen-paid-boost" and .autonomousSpendUsd == 0 and .extraAiSpendAuthorized == false and .workflowSendsMessages == false' paid-boost-policy.json >/dev/null && \
                 jq -e '.fastLaneVersion == "1.0-first-settlement-fast-lane" and .fastLane.enabled == true and .fastLane.objective == "first_verified_settlement_then_repeat_verified_winners" and .fastLane.maxExternalMessagesPerRun == 1 and .autonomousSpend == false and .autonomousContract == false and .bindingActionsHumanGated == true' first-cash-policy.json >/dev/null && \
                 jq -e '.version == "1.4-response-truth-rotation" and .rotateNonCommercialTransportResponses == true and .skipExplicitMoveOn == true and .penalizeWaitingSent == true and .rotateLowScoreDeadEnds == true and .autonomousSpendUsd == 0 and .bindingActionsHumanGated == true' first-settlement-policy.json >/dev/null && \
                 jq -e '.version == "1.2-entrepreneurial-adaptation" and .sentIsNotSuccess == true and .demandFirstWhenBuyerEvidenceZero == true and .persistentFunnelMemory == true and .strategyMemoryAffectsSelection == true and .strategyFatigueAvoidance == true and .zeroRewardAttemptsTriggerPivot == 3 and .hardPivotWhenAlternativesExist == true and .verifiedWinnerReplication == true and .cashPressurePrioritizesFastValidation == true and .monetizationFrontier == true and .distinctBusinessModelExploration == true and .frontierExplorationEscapesCurrentBottleneck == true and .maxAiHypotheses == 5 and .parallelMonetizationObservation == true and .travelAffiliateEconomicLearning == true and .clickIsWeakSignalNotRevenue == true and .confirmedBookingIsConversionNotCash == true and .verifiedAffiliatePayoutIsRevenue == true and .microincomeScaleEngine == true and .scaleRequiresEvidence == true and .projectedScaleIsNotRevenue == true and .targetScaleEvents == 10000 and .autonomousSpendUsd == 0 and .bindingActionsHumanGated == true' brain-policy.json >/dev/null; then
                echo 'PUBLIC_SAFETY_AND_INTERMEDIARY_POLICIES_OK'
                exit 0
              fi
            fi
            sleep 3
          done
          cat supplier-policy.json || true
          cat paid-boost-policy.json || true
          cat first-cash-policy.json || true
          cat first-settlement-policy.json || true
          cat brain-policy.json || true
          exit 1

      - name: Verify live zero-spend monetization rails
        run: |
          set -euo pipefail
          A2A='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          PUBLIC='https://lumen-zero-public.lumen-b2b.workers.dev'
          curl -fsS --retry 5 --retry-delay 3 --max-time 20 "$A2A/health/viator-affiliate" -o viator-affiliate.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 20 "$A2A/viator/api/status" -o viator-api.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 20 "$A2A/health/viator-conversions" -o viator-conversions.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 20 "$A2A/travel/acquisition/policy" -o travel-acquisition.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 30 "$PUBLIC/travel.json?q=Rio%20de%20Janeiro&source=web" -o travel-storefront.json
          jq -e '.ok == true and .provider == "viator" and .pidConfigured == true and .apiProductUrlPreserved == true' viator-affiliate.json >/dev/null
          jq -e '.provider == "viator" and .configured == true and .environment == "production" and .secretExposed == false and .bookingAuthority == false and .paymentAuthority == false' viator-api.json >/dev/null
          jq -e '.ok == true and .configured == true and .mode == "booking-event-attribution" and .autonomousSpendUsd == 0' viator-conversions.json >/dev/null
          jq -e '.ok == true and .paidAds == false and .autonomousSpendUsd == 0 and .publicationAuthority == false and .bindingActionsHumanGated == true' travel-acquisition.json >/dev/null
          jq -e '.ok == true and .affiliateDisclosure == true and .bookingAuthority == false and .paymentAuthority == false and .autonomousSpendUsd == 0' travel-storefront.json >/dev/null
          echo 'LIVE_ZERO_SPEND_MONETIZATION_RAILS_OK'

      - name: Verify commerce and source control planes
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl -fsS --retry 5 --retry-delay 3 "$BASE/market-hunter/policy" -o hunter-policy.json
          curl -fsS --retry 5 --retry-delay 3 "$BASE/source-intelligence/policy" -o source-policy.json
          curl -fsS --retry 5 --retry-delay 3 "$BASE/commerce-machine/policy" -o commerce-policy.json
          curl -fsS --retry 5 --retry-delay 3 "$BASE/commerce-ops/policy" -o commerce-ops-policy.json
          curl -fsS --retry 5 --retry-delay 3 "$BASE/tiendanube/policy" -o tiendanube-policy.json
          jq -e '.autonomousSpend == false and .autonomousPurchase == false and .autonomousContract == false and .bindingActionsHumanGated == true' hunter-policy.json >/dev/null
          jq -e '.autonomousSpendUsd == 0 and .autonomousPurchase == false and .autonomousContract == false and .verifiedRevenueOnly == true and .bindingActionsHumanGated == true' source-policy.json >/dev/null
          jq -e '.publicationAuthority == false and .purchaseAuthority == false and .autonomousSpendUsd == 0' commerce-policy.json >/dev/null
          jq -e '.autonomousPublishing == false and .autonomousPurchasing == false and .supplierOrdering == false and .priceWriteAuthority == false and .inventoryWriteAuthority == false and .autonomousSpendUsd == 0 and .humanApprovalRequired == true' commerce-ops-policy.json >/dev/null
          jq -e '.publicationExecution == "EXPLICIT_ADMIN_ONLY" and .autonomousPublishing == false and .autonomousPurchasing == false and .supplierOrdering == false and .autonomousSpendUsd == 0' tiendanube-policy.json >/dev/null
          echo 'COMMERCE_AND_SOURCE_CONTROL_PLANES_OK'

      - name: Start and verify durable deep cycle
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl -fsS --max-time 30 -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/paid-boost/deep/run" -o paid-boost-start.json
          jq -e '.ok == true and .hourlyDeduplication == true' paid-boost-start.json >/dev/null
          id=$(jq -r '.instanceId' paid-boost-start.json)
          for attempt in $(seq 1 15); do
            curl -fsS --max-time 20 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/paid-boost/status" -o paid-boost-status.json
            if jq -e --arg id "$id" '.workflowBindingsReady == true and any(.runs[]; .id == $id)' paid-boost-status.json >/dev/null; then
              echo 'PAID_BOOST_DURABLE_INSTANCE_STARTED'
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify production release identity and revenue truth
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for attempt in $(seq 1 15); do
            curl -fsS --max-time 20 -H 'cache-control: no-cache' "$BASE/sovereign/policy?release=$GITHUB_SHA&probe=$attempt" -o sovereign-policy.json
            if jq -e --arg release "$GITHUB_SHA" '.releaseId==$release and .version=="4.0-sovereign-revenue" and .autonomousSpendUsd==0 and .sendsMessages==false and .releasesDelivery==false' sovereign-policy.json >/dev/null; then
              break
            fi
            sleep 2
          done
          jq -e --arg release "$GITHUB_SHA" '.releaseId==$release' sovereign-policy.json >/dev/null
          curl -fsS --max-time 20 "$BASE/portfolio-governor/state" -o sovereign-after.json
          jq '{phase:"after_deploy",verifiedRevenueUsd:.metrics.verifiedRevenueUsd,verifiedSettlements:.metrics.verifiedSettlements,activeCandidates:.metrics.activeCandidates}' sovereign-after.json
          echo 'PRODUCTION_RELEASE_AND_REVENUE_TRUTH_OK'
