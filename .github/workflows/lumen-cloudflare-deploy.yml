name: LUMEN Cloudflare deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/**'
      - '.github/workflows/lumen-cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-a2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$OPPORTUNITY_ADMIN_TOKEN" ]; then
            echo 'REQUIRED_SECRETS_MISSING'
            exit 2
          fi
          echo 'REQUIRED_SECRETS_PRESENT'
      - name: Deploy lumen-zero-a2a with adaptive entrypoint
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.toml
          grep -q '^main = "adaptive-entry.js"$' wrangler.toml
          npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Restore protected opportunity admin secret
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-entry.js"/' wrangler.toml
          printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
      - name: Smoke test public portfolio endpoints
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS "$BASE/opportunity-factory/policy" -o factory-policy.json && curl -fsS "$BASE/portfolio-governor/policy" -o governor-policy.json && curl -fsS "$BASE/opportunity-factory/stats" -o factory-stats.json && curl -fsS "$BASE/portfolio-governor/state" -o governor-state.json; then
              if grep -q '1.0-opportunity-factory-portfolio' factory-policy.json && grep -q '1.0-portfolio-governor' governor-policy.json && grep -q 'maxExternalMessagesPerCycle' governor-policy.json && grep -q 'autonomousSpend' factory-policy.json; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" -eq 1
          grep -q '"autonomousSpend":false' factory-policy.json
          grep -q '"autonomousSpend":false' governor-policy.json
          grep -q '"maxExternalMessagesPerCycle":1' governor-policy.json
          echo 'PORTFOLIO_PUBLIC_SMOKE_OK'
      - name: Smoke test adaptive market hunter control plane
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 15 "$BASE/market-hunter/policy" -o hunter-policy.json && curl -fsS --max-time 15 "$BASE/market-hunter/pruning/policy" -o pruning-policy.json; then
              if grep -q '1.0-adaptive-market-hunter' hunter-policy.json && grep -q 'bounded_explore_exploit' hunter-policy.json && grep -q 'bounded_child_queries' hunter-policy.json && grep -q '1.0-market-hunter-pruner' pruning-policy.json; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" -eq 1
          jq -e '.version == "1.0-adaptive-market-hunter" and (.selectionPolicy | contains("bounded_explore_exploit")) and (.queryEvolution | contains("bounded_child_queries")) and .selfModifyingCode == false and .maxQueriesPerRun == 3 and .createsExternalMessages == false and .autonomousSpend == false and .autonomousPurchase == false and .autonomousContract == false and .verifiedRevenueOnly == true and .bindingActionsHumanGated == true' hunter-policy.json >/dev/null
          jq -e '.version == "1.0-market-hunter-pruner" and .seedStrategiesCanBeAutoPruned == false and .maxDeactivationsPerCycle == 2 and .minimumActiveStrategies == 8 and .createsExternalMessages == false and .autonomousSpend == false and .autonomousPurchase == false and .autonomousContract == false and .bindingActionsHumanGated == true' pruning-policy.json >/dev/null
          echo 'ADAPTIVE_MARKET_HUNTER_CONTROL_PLANE_OK'
      - name: Smoke test source intelligence control plane
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 15 "$BASE/source-intelligence/policy" -o source-policy.json && curl -fsS --max-time 15 "$BASE/source-intelligence/status" -o source-status.json; then
              if grep -q '1.0-source-intelligence' source-policy.json && grep -q 'bounded_source_explore_exploit' source-policy.json && grep -q 'ted_eu_public_procurement' source-status.json && grep -q 'uk_contracts_finder' source-status.json; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" -eq 1
          jq -e '.version == "1.0-source-intelligence" and .selectionPolicy == "bounded_source_explore_exploit" and .sourceLearning == "direct_opportunity_to_verified_settlement_attribution" and .maxExternalSourcesPerCycle == 2 and .maxResultsPerSource == 20 and .createsExternalMessages == false and .autonomousSpendUsd == 0 and .autonomousPurchase == false and .autonomousContract == false and .verifiedRevenueOnly == true and .bindingActionsHumanGated == true' source-policy.json >/dev/null
          jq -e '.version == "1.0-source-intelligence" and (.sources | length) >= 3 and (.sources | map(.source_id) | index("ted_eu_public_procurement")) != null and (.sources | map(.source_id) | index("uk_contracts_finder")) != null' source-status.json >/dev/null
          echo 'SOURCE_INTELLIGENCE_CONTROL_PLANE_OK'
      - name: Smoke test Commerce Machine and Operations control plane
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 15 "$BASE/commerce-machine/policy" -o commerce-policy.json && curl -fsS --max-time 15 "$BASE/commerce-ops/policy" -o commerce-ops-policy.json && curl -fsS --max-time 15 -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/commerce-ops/status" -o commerce-ops-status.json; then
              if grep -q '2.0-commerce-machine-shadow' commerce-policy.json && grep -q '3.0-commerce-operations' commerce-ops-policy.json; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" -eq 1
          jq -e '.publicationAuthority == false and .purchaseAuthority == false and .autonomousSpendUsd == 0' commerce-policy.json >/dev/null
          jq -e '.version == "3.0-commerce-operations" and .autonomousPublishing == false and .autonomousPurchasing == false and .supplierOrdering == false and .priceWriteAuthority == false and .inventoryWriteAuthority == false and .autonomousSpendUsd == 0 and .verifiedOrdersOnlyCanCreateFulfillment == true and .humanApprovalRequired == true' commerce-ops-policy.json >/dev/null
          jq -e '.version == "3.0-commerce-operations" and .authority.publish == false and .authority.purchase == false and .authority.autonomousSpendUsd == 0' commerce-ops-status.json >/dev/null
          echo 'COMMERCE_OPERATIONS_CONTROL_PLANE_OK'
      - name: Smoke test live B2B travel broker
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS "$BASE/travel/policy" -o travel-policy.json && curl -fsS "$BASE/travel/catalog" -o travel-catalog.json && curl -fsS "$BASE/travel/stats" -o travel-stats.json && curl -fsS "$BASE/travel/partners/stats" -o travel-partners.json; then
              if grep -q '1.0-travel-broker-referral' travel-policy.json && grep -q 'TRAVEL-CORPORATE-BROKER' travel-catalog.json && grep -q 'autonomousTravelBooking' travel-policy.json; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" -eq 1
          grep -q '"createsBooking":false' travel-policy.json
          grep -q '"autonomousSpend":false' travel-policy.json
          curl -fsS -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" "$BASE/travel/run" -o travel-run.json
          grep -q '"ok":true' travel-run.json
          grep -q '"b2bOnly":true' travel-run.json
          grep -q '"createsBooking":false' travel-run.json
          echo 'TRAVEL_BROKER_LIVE_SMOKE_OK'
