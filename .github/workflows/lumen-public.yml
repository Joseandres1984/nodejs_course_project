name: LUMEN Public Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-public.yml"

permissions:
  contents: read

concurrency:
  group: lumen-public-deploy
  cancel-in-progress: true

jobs:
  deploy-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "LUMEN public Worker deployment credentials configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LUMEN public Worker waiting for Cloudflare credentials."
          fi

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy public Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/public-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify public health, campaigns and unified storefront
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-public.lumen-b2b.workers.dev'
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/lumen-public-health.json -w '%{http_code}' "$base/health" || true)
            if [[ "$code" == "200" ]]; then
              cat /tmp/lumen-public-health.json
              break
            fi
            if [[ "$i" == "12" ]]; then
              echo "Public health check did not return 200 in time."
              exit 1
            fi
            sleep 5
          done

          # Existing campaign links must remain live.
          for token in D1A6FA819E21 4F11F08D4303; do
            code=$(curl -sS -L -o /tmp/lumen-campaign.html -w '%{http_code}' "$base/c/$token" || true)
            [[ "$code" == "200" ]]
            grep -q 'LUMEN' /tmp/lumen-campaign.html
          done

          # Human storefront must stay under the one public hostname.
          code=$(curl -sS -o /tmp/lumen-store.html -w '%{http_code}' "$base/store?src=deployment_canary&technical_canary=1" || true)
          [[ "$code" == "200" ]]
          grep -q 'LUMEN' /tmp/lumen-store.html
          grep -q 'Supplier Snapshot' /tmp/lumen-store.html

          # Starting checkout must redirect back to this same public hostname, never expose an internal Worker.
          curl -sS -o /dev/null -D /tmp/lumen-go.headers "$base/go/supplier-snapshot?src=deployment_canary&technical_canary=1" || true
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/lumen-go.headers)
          echo "PUBLIC_GATEWAY_LOCATION=$location"
          [[ "$location" == "$base/buy/supplier-snapshot"* ]]

          # Real x402 challenge through public gateway, without paying or spending funds.
          code=$(curl -sS -o /tmp/lumen-buy.body -D /tmp/lumen-buy.headers -w '%{http_code}' "$base/buy/supplier-snapshot?technical_canary=1" || true)
          echo "PUBLIC_X402_HTTP=$code"
          [[ "$code" == "402" ]]
          grep -Eiq '^payment-required:|^x-payment-required:' /tmp/lumen-buy.headers

          echo "LUMEN_UNIFIED_PUBLIC_GATEWAY=success"

# deploy trigger: unified public gateway 2026-09-21
