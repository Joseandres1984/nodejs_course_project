name: LUMEN Public Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-public.yml"

permissions:
  contents: read

concurrency:
  group: lumen-public-deploy
  cancel-in-progress: true

jobs:
  deploy-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "LUMEN public Worker deployment credentials configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LUMEN public Worker waiting for Cloudflare credentials."
          fi

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate public Worker syntax
        if: steps.preflight.outputs.ready == 'true'
        run: |
          node --check .lumen/public-worker/worker.js
          node --check .lumen/public-worker/gateway.js
          node --check .lumen/public-worker/revenue-storefront.js

      - name: Deploy public Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/public-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify public health, Revenue catalog, campaigns and unified storefront
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -u -o pipefail
          base='https://lumen-zero-public.lumen-b2b.workers.dev'
          failed=0

          for i in {1..12}; do
            code=$(curl -sS -o /tmp/lumen-public-health.json -w '%{http_code}' "$base/health" || true)
            echo "HEALTH_HTTP=$code"
            if [[ "$code" == "200" ]]; then
              cat /tmp/lumen-public-health.json
              break
            fi
            if [[ "$i" == "12" ]]; then failed=1; fi
            sleep 5
          done

          catalog_ok=0
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/lumen-revenue-catalog.html -w '%{http_code}' "$base/catalogo?technical_canary=1" || true)
            echo "REVENUE_CATALOG_ATTEMPT=$i HTTP=$code"
            if [[ "$code" == "200" ]] \
              && grep -q 'LUMEN Sourcing Success' /tmp/lumen-revenue-catalog.html \
              && grep -q 'Tender Radar Basic' /tmp/lumen-revenue-catalog.html \
              && grep -q 'Buyer Intent Feed' /tmp/lumen-revenue-catalog.html \
              && grep -q 'Machine Store' /tmp/lumen-revenue-catalog.html \
              && grep -q 'Enviar solicitud' /tmp/lumen-revenue-catalog.html; then
              catalog_ok=1
              break
            fi
            sleep 4
          done
          if [[ "$catalog_ok" != "1" ]]; then
            echo "Human Revenue catalog validation failed"
            head -100 /tmp/lumen-revenue-catalog.html || true
            failed=1
          fi

          code=$(curl -sS -o /tmp/lumen-revenue-catalog.json -w '%{http_code}' "$base/catalogo.json" || true)
          echo "REVENUE_CATALOG_JSON_HTTP=$code"
          if [[ "$code" != "200" ]]; then
            cat /tmp/lumen-revenue-catalog.json || true
            failed=1
          else
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/lumen-revenue-catalog.json'))
          assert data.get('version') == '1.0-revenue-expansion'
          assert (data.get('sourcing_success') or {}).get('id') == 'REV-SOURCING-SUCCESS'
          subs={x.get('id'):x.get('price_usd') for x in (data.get('subscriptions') or [])}
          assert subs.get('REV-TENDER-RADAR-BASIC') == 29
          assert subs.get('REV-BUYER-INTENT-FEED') == 99
          assert len(data.get('machine_offers') or []) == 6
          print({'public_revenue_catalog':'ok','subscriptions':len(subs),'machine_offers':len(data.get('machine_offers') or [])})
          PY
            if [[ "$?" != "0" ]]; then failed=1; fi
          fi

          for token in D1A6FA819E21 4F11F08D4303; do
            code=$(curl -sS -L -o /tmp/lumen-campaign.html -w '%{http_code}' "$base/c/$token" || true)
            echo "CAMPAIGN_${token}_HTTP=$code"
            if [[ "$code" != "200" ]] || ! grep -q 'LUMEN' /tmp/lumen-campaign.html; then failed=1; fi
          done

          code=$(curl -sS -o /tmp/lumen-store.html -w '%{http_code}' "$base/store?src=deployment_canary&technical_canary=1" || true)
          echo "STORE_HTTP=$code"
          if [[ "$code" != "200" ]]; then
            cat /tmp/lumen-store.html || true
            failed=1
          elif ! grep -q 'LUMEN' /tmp/lumen-store.html || ! grep -q 'Supplier Snapshot' /tmp/lumen-store.html; then
            echo "Storefront body missing expected content"
            failed=1
          fi

          curl -sS -o /dev/null -D /tmp/lumen-go.headers "$base/go/supplier-snapshot?src=deployment_canary&technical_canary=1" || true
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/lumen-go.headers)
          echo "PUBLIC_GATEWAY_LOCATION=$location"
          if [[ "$location" != "$base/buy/supplier-snapshot"* ]]; then failed=1; fi

          x402_ok=0
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/lumen-buy.body -D /tmp/lumen-buy.headers -w '%{http_code}' "$base/buy/supplier-snapshot?technical_canary=1&attempt=$i&deploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)
            echo "PUBLIC_X402_ATTEMPT=$i HTTP=$code"
            if [[ "$code" == "402" ]] && grep -Eiq '^payment-required:|^x-payment-required:' /tmp/lumen-buy.headers; then
              x402_ok=1
              break
            fi
            if [[ "$code" == "500" ]]; then cat /tmp/lumen-buy.body || true; fi
            sleep 4
          done
          if [[ "$x402_ok" != "1" ]]; then
            echo "x402 gateway challenge failed after retries"
            cat /tmp/lumen-buy.headers || true
            cat /tmp/lumen-buy.body || true
            failed=1
          fi

          iphone_ua='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'
          checkout_ok=0
          for i in {1..8}; do
            code=$(curl -sS -A "$iphone_ua" -H 'Accept: text/html,application/xhtml+xml' -o /tmp/lumen-checkout.html -w '%{http_code}' "$base/buy/supplier-snapshot?technical_canary=1&ui_attempt=$i" || true)
            echo "LUMEN_CHECKOUT_UI_ATTEMPT=$i HTTP=$code"
            if [[ "$code" == "402" ]] \
              && grep -q 'LUMEN Checkout' /tmp/lumen-checkout.html \
              && grep -q 'Elegir billetera' /tmp/lumen-checkout.html \
              && grep -q 'Conectar y pagar' /tmp/lumen-checkout.html \
              && grep -q 'Volver a LUMEN' /tmp/lumen-checkout.html \
              && grep -q 'USDC' /tmp/lumen-checkout.html \
              && grep -q 'Base' /tmp/lumen-checkout.html; then
              checkout_ok=1
              break
            fi
            sleep 3
          done
          if [[ "$checkout_ok" != "1" ]]; then
            echo "Branded Spanish checkout validation failed"
            head -120 /tmp/lumen-checkout.html || true
            failed=1
          fi

          if [[ "$failed" != "0" ]]; then
            echo "LUMEN_UNIFIED_PUBLIC_GATEWAY=failure"
            exit 1
          fi
          echo "LUMEN_PUBLIC_REVENUE_CATALOG=success"
          echo "LUMEN_CHECKOUT_UI=success"
          echo "LUMEN_UNIFIED_PUBLIC_GATEWAY=success"

# deploy trigger: human Revenue Expansion storefront 2026-09-22
