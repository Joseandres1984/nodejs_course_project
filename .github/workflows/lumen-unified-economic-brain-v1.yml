name: LUMEN Unified Economic Brain v1.2

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/unified-economic-brain-v1.js'
      - '.lumen/a2a-worker/test-unified-economic-brain-v1.mjs'
      - '.lumen/a2a-worker/paid-boost-entry.js'
      - '.lumen/a2a-worker/paid-boost-workflows.js'
      - '.github/workflows/lumen-unified-economic-brain-v1.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/unified-economic-brain-v1.js'
      - '.lumen/a2a-worker/test-unified-economic-brain-v1.mjs'
      - '.lumen/a2a-worker/paid-boost-entry.js'
      - '.lumen/a2a-worker/paid-boost-workflows.js'
      - '.github/workflows/lumen-unified-economic-brain-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unified brain demand-learning regressions
        run: |
          set -euo pipefail
          node .lumen/a2a-worker/test-unified-economic-brain-v1.mjs
          node .lumen/a2a-worker/test-intramodule-evolution-v1.mjs
          node .lumen/a2a-worker/test-bounded-supplier-resale.mjs
          node .lumen/a2a-worker/test-paid-boost.mjs
      - name: Syntax and authority guardrails
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/unified-economic-brain-v1.js
          node --check .lumen/a2a-worker/paid-boost-entry.js
          node --check .lumen/a2a-worker/paid-boost-workflows.js
          grep -q 'autonomousSpendUsd: 0' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'autonomousPurchase: false' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'autonomousContract: false' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'oneGlobalEconomicMission: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'openEndedBusinessModels: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'sentIsNotSuccess: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'demandFirstWhenBuyerEvidenceZero: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'persistentFunnelMemory: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'strategyMemoryAffectsSelection: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'strategyFatigueAvoidance: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'zeroRewardAttemptsTriggerPivot: 3' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'verifiedWinnerReplication: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'cashPressurePrioritizesFastValidation: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'monetizationFrontier: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'distinctBusinessModelExploration: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'frontierExplorationEscapesCurrentBottleneck: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'MAX_AI_HYPOTHESES = 5' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'parallelMonetizationObservation: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'travelAffiliateEconomicLearning: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'clickIsWeakSignalNotRevenue: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'confirmedBookingIsConversionNotCash: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'verifiedAffiliatePayoutIsRevenue: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'microincomeScaleEngine: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'scaleRequiresEvidence: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'projectedScaleIsNotRevenue: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'targetScaleEvents: 10000' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'microincomeScaleEngine: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'scaleRequiresEvidence: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'projectedScaleIsNotRevenue: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'targetScaleEvents: 10000' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'lumen_brain_funnel_memory' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'sentIsNotSuccess: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'demandFirstWhenBuyerEvidenceZero: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'persistentFunnelMemory: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'strategyMemoryAffectsSelection: true' .lumen/a2a-worker/unified-economic-brain-v1.js
          grep -q 'lumen_brain_funnel_memory' .lumen/a2a-worker/unified-economic-brain-v1.js
