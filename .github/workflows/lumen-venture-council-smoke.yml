name: LUMEN Venture Council Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-venture-council-smoke.yml'
  workflow_dispatch:

jobs:
  venture-council-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Venture Council v1.1
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/venture-council/stats" || true)
            echo "$body"
            if echo "$body" | grep -q '1.1-venture-council-engine'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Run quality-gated venture promotion
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/venture-council/run" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/run.json
          cat /tmp/run.json
          echo
          jq -e '.ok == true and .version == "1.1-venture-council-engine" and .sourceQualityGateRequired == true and .guardrails.autonomousSpend == false and .guardrails.autonomousContract == false and .guardrails.autonomousHiring == false and .guardrails.externalValidation == false and .guardrails.experimentsCostLimitUsd == 0' /tmp/run.json >/dev/null

      - name: Verify live safety and source gate
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/venture-council/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.1-venture-council-engine" and .sourceQualityGateRequired == true and .autonomousSpend == false and .externalValidation == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null
