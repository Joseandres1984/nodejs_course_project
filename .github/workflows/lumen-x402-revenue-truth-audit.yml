name: LUMEN x402 Revenue Truth Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumen-x402-revenue-truth-audit.yml'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumen-x402-revenue-truth-audit
  cancel-in-progress: false
jobs:
  read-only-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify official seller receipt totals without accessing private buyer or owner data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://lumen-zero-x402.lumen-b2b.workers.dev"
          def get(path):
              req=urllib.request.Request(base+path,
                  headers={"accept":"application/json","cache-control":"no-store",
                           "user-agent":"LUMEN-ReadOnly-Revenue-Audit/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as exc:
                  print("X402_PUBLIC_STATS_HTTP_ERROR",exc.code)
                  raise SystemExit(2)
          stats=get("/stats")
          policy=get("/approvals/policy")
          if policy.get("humanApprovalRequired") is not True or policy.get("defaultDeny") is not True or policy.get("oneTime") is not True:
              raise SystemExit("X402_HUMAN_APPROVAL_GUARDRAIL_MISSING")
          if policy.get("ownerCredentialConfigured") is not True:
              raise SystemExit("X402_OWNER_CREDENTIAL_NOT_CONFIGURED")
          if not isinstance(stats.get("payments"),int) or not isinstance(stats.get("realizedRevenueUsd"),(int,float)):
              raise SystemExit("X402_REVENUE_UNVERIFIABLE")
          if "Only settled_verified or redeemed_queued" not in str(stats.get("revenueRule")):
              raise SystemExit("X402_REVENUE_RULE_CHANGED_REVIEW_REQUIRED")
          print("X402_SETTLEMENTS_UNIQUE_VERIFIED",stats["payments"])
          print("X402_VERIFIED_REVENUE_USD",stats["realizedRevenueUsd"])
          print("X402_PENDING_PAYMENT_AUTHORIZATIONS",stats.get("pendingAuthorizations","not_available"))
          print("X402_PENDING_HUMAN_APPROVALS","NOT_ACCESSIBLE_WITH_CURRENT_PERMISSIONS")
          print("X402_OWNER_APPROVAL_REQUIRED_TRUE")
          print("X402_TRUTH_AUDIT_PUBLIC_READ_ONLY_NO_PAYMENTS_OK")
          PY
