name: LUMEN Sovereign Revenue v4 check
on:
  pull_request:
    branches: [lumen-zero]
    paths: ['.lumen/a2a-worker/**', '.github/workflows/lumen-sovereign*', '.github/scripts/lumen-sovereign*']
  push:
    branches: [lumen-zero]
    paths: ['.lumen/a2a-worker/**', '.github/workflows/lumen-sovereign*', '.github/scripts/lumen-sovereign*']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revenue, replay, scope, protocol and adversarial authority tests
        run: node .lumen/a2a-worker/test-sovereign-revenue.mjs
      - name: Existing runtime regression tests
        run: |
          node .lumen/a2a-worker/test-paid-boost.mjs
          node .lumen/a2a-worker/test-discovery.mjs
          node .lumen/a2a-worker/test-superautonomy-v3.mjs
          node .lumen/a2a-worker/test-growth-engine-foundry-v2.mjs
          node .lumen/a2a-worker/test-lumen-mind-v2-static.mjs
      - name: Bundle production entry and durable workflows
        working-directory: .lumen/a2a-worker
        run: npx --yes wrangler@latest deploy paid-boost-entry.js --dry-run --config wrangler.toml
