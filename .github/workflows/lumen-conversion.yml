name: LUMEN Conversion Loop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-conversion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-conversion-deploy
  cancel-in-progress: true

jobs:
  deploy-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      CONVERSION_BASE_URL: "https://lumen-zero-conversion.lumen-b2b.workers.dev"
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Worker syntax
        working-directory: .lumen/conversion-worker
        run: node --check worker.js

      - name: Deploy conversion Worker
        working-directory: .lumen/conversion-worker
        run: npx --yes wrangler@4 deploy

      - name: Verify live conversion loop without spending
        shell: bash
        run: |
          set -euo pipefail
          BASE="$CONVERSION_BASE_URL"
          X402="https://lumen-zero-x402.lumen-b2b.workers.dev"
          ready=0
          for i in {1..15}; do
            code=$(curl -sS -o /tmp/conversion-health.json -w '%{http_code}' "$BASE/health?deploy=${GITHUB_RUN_ID}-${i}" || true)
            if [[ "$code" == "200" ]] && [[ "$(jq -r '.version // ""' /tmp/conversion-health.json 2>/dev/null || true)" == "1.1-conversion-loop-crm" ]]; then
              ready=1
              break
            fi
            sleep 3
          done
          [[ "$ready" == "1" ]]
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ["CONVERSION_BASE_URL"]
          def get(path):
              req=urllib.request.Request(base+path,headers={"Accept":"application/json","User-Agent":"LUMEN-ConversionDeploy/1.1"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())
          for path in ("/health","/catalog.json","/stats"):
              data=get(path)
              assert data.get("ok") is True, (path,data)
          catalog=get("/catalog.json")
          assert len(catalog.get("products",[])) == 6
          assert catalog.get("paidMediaSpend") is False
          assert catalog.get("crmBridge") is True
          stats=get("/stats")
          assert stats.get("revenueRule") == "Only x402 receipts with status settled_verified count as realized revenue"
          assert (stats.get("crmTruth") or {}).get("qualifiedIntentCreatesCanonicalInquiry") is True
          print("CONVERSION_LIVE health=ok products=6 crm_bridge=ok revenue_truth=settled_only")
          PY
          CANARY_Q="src=technical-canary&medium=deploy&campaign=deploy-canary&technical_canary=1"
          curl -fsS -A "LUMEN-ConversionDeploy/1.1" "$BASE/offer/supplier-snapshot?$CANARY_Q" >/dev/null
          curl -fsS -A "LUMEN-ConversionDeploy/1.1" -X POST \
            -F 'email=technical-canary@example.invalid' \
            -F 'company=LUMEN Deployment Canary' \
            -F 'details=Technical deployment canary only; must not enter canonical CRM.' \
            "$BASE/intent/supplier-snapshot?$CANARY_Q" >/dev/null
          LOCATION=$(curl -sS -A "LUMEN-ConversionDeploy/1.1" -D - -o /dev/null "$BASE/go/supplier-snapshot?$CANARY_Q" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print substr($0,index($0,$2))}' | tail -1)
          echo "$LOCATION" | grep -F "$X402/buy/supplier-snapshot" >/dev/null
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ["CONVERSION_BASE_URL"]+"/stats",headers={"Accept":"application/json","User-Agent":"LUMEN-ConversionDeploy/1.1"})
          stats=json.loads(urllib.request.urlopen(req,timeout=30).read().decode())
          assert stats.get("qualifiedLeads",0) == stats.get("crmSyncedLeads",0), "Only real leads should be CRM-synced; technical canary is excluded from aggregates"
          print("CONVERSION_CANARY offer=200 intent=200 checkout_redirect=302 crm_pollution=false payment_attempted=false")
          PY
