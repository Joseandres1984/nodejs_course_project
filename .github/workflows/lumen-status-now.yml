name: LUMEN Status Now

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-status-now.yml'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Read live LUMEN state
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for path in health opportunities/stats commercial/stats outreach/stats outreach/next followup/stats followup/pipeline referrals/stats referrals/commissions/stats referrals/commissions/autopilot/stats partners/stats partners/top portfolio-governor/state travel/acquisition/status; do
            echo "===== /$path ====="
            curl --fail --show-error --silent --max-time 30 "$base/$path"
            echo
          done

      - name: Read protected referral ledger
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '===== /referrals/ledger ====='
          curl --fail --show-error --silent --max-time 30             -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN"             "$base/referrals/ledger"
          echo

      - name: Read protected affiliate revenue state
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for path in travel/acquisition/recommendations viator/conversions/status viator/revenue/status travelpayouts/finance/status; do
            echo "===== /$path ====="
            code=$(curl --show-error --silent --max-time 45 -o "/tmp/$(echo "$path" | tr '/' '-').json" -w '%{http_code}' \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              "$base/$path")
            echo "HTTP=$code"
            cat "/tmp/$(echo "$path" | tr '/' '-').json"; echo
            test "$code" -ge 200
            test "$code" -lt 300
          done

      - name: Force Travelpayouts finance diagnostic sync
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          code=$(curl --show-error --silent --max-time 60 -o /tmp/travelpayouts-sync.json -w '%{http_code}' \
            -X POST -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            "$base/travelpayouts/finance/sync")
          echo "TRAVELPAYOUTS_SYNC_HTTP=$code"
          cat /tmp/travelpayouts-sync.json; echo
          test "$code" = '202'
