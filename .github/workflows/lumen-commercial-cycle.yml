name: LUMEN Commercial Cycle

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-commercial-cycle.yml'

jobs:
  commercial-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live worker
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 30 "$base/health"
          echo

      - name: Hunt fresh public opportunities
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPPORTUNITY_ADMIN_TOKEN:-}" ]; then
            echo 'OPPORTUNITY_ADMIN_TOKEN_MISSING'
            exit 2
          fi
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'

          for endpoint in source-intelligence/cycle market-hunter/run; do
            body="/tmp/${endpoint//\//-}.json"
            code=$(curl --show-error --silent --max-time 90 -o "$body" -w '%{http_code}' \
              -X POST "$base/$endpoint" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "===== $endpoint HTTP $code ====="
            cat "$body"; echo
            test "$code" = '202'
          done

      - name: Reassess commercial opportunities
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          body='/tmp/reassess.json'
          code=$(curl --show-error --silent --max-time 90 -o "$body" -w '%{http_code}' \
            -X POST "$base/commercial/reassess" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json')
          echo "===== commercial reassess HTTP $code ====="
          cat "$body"
          echo
          test "$code" = '202'

      - name: Prioritize existing intent and due follow-up before cold outreach
        id: conversion
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          consumed=false

          # Use the single external commercial slot on the shortest verified path
          # to revenue: close intent, answer qualified replies, then due follow-up.
          # Only if none of those consumes the slot may fresh cold outreach proceed.
          for endpoint in first-cash/run commercial-reply/run followup/run; do
            body="/tmp/${endpoint//\//-}.json"
            code=$(curl --show-error --silent --max-time 60 -o "$body" -w '%{http_code}' \
              -X POST "$base/$endpoint" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "===== $endpoint HTTP $code ====="
            cat "$body"; echo
            test "$code" = '202'

            if jq -e '(.sent == true) or (.externalAttempted == true) or (.attempted == true) or (.status == "SEND_FAILED") or (.send.sent == true) or (.send.externalAttempted == true) or (.send.status == "SEND_FAILED")' "$body" >/dev/null 2>&1; then
              consumed=true
              echo "CONVERSION_SLOT_CONSUMED_BY=$endpoint"
              break
            fi
          done

          echo "CONVERSION_SLOT_CONSUMED=$consumed"
          echo "consumed=$consumed" >> "$GITHUB_OUTPUT"

      - name: Rotate candidates until one viable outreach consumes the external slot
        if: steps.conversion.outputs.consumed != 'true'
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          consumed=false

          for attempt in 1 2 3 4 5 6; do
            echo "===== revenue candidate rotation $attempt/6 ====="

            proposal="/tmp/proposal-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$proposal" -w '%{http_code}' \
              -X POST "$base/proposals/prepare-top" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "proposal HTTP $code"
            cat "$proposal"; echo
            test "$code" = '202'

            quality="/tmp/quality-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$quality" -w '%{http_code}' \
              -X POST "$base/quality/review-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "quality HTTP $code"
            cat "$quality"; echo
            test "$code" = '202'

            probe="/tmp/probe-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$probe" -w '%{http_code}' \
              -X POST "$base/outreach/probe-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "probe HTTP $code"
            cat "$probe"; echo
            test "$code" = '202'

            send="/tmp/send-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$send" -w '%{http_code}' \
              -X POST "$base/outreach/send-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "send HTTP $code"
            cat "$send"; echo
            test "$code" = '202'

            if jq -e '(.sent == true) or (.externalAttempted == true) or (.status == "SEND_FAILED")' "$send" >/dev/null 2>&1; then
              consumed=true
              echo "EXTERNAL_SLOT_CONSUMED_ON_ATTEMPT=$attempt"
              break
            fi
          done

          echo "EXTERNAL_SLOT_CONSUMED=$consumed"

      - name: Read hunt and revenue results
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for endpoint in \
            source-intelligence/status \
            market-hunter/state \
            commercial/stats \
            commercial/next \
            proposals/next \
            quality/stats \
            outreach/stats \
            outreach/next \
            commercial-reply/stats \
            first-cash/stats \
            followup/stats \
            agent-economy/stats \
            portfolio-governor/state; do
            echo "===== /$endpoint ====="
            curl --fail --show-error --silent --max-time 30 "$base/$endpoint"
            echo
          done
