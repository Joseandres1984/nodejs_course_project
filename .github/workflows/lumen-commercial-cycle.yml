name: LUMEN Commercial Cycle

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-commercial-cycle.yml'

jobs:
  commercial-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live worker
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 30 "$base/health"
          echo

      - name: Reassess commercial opportunities
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPPORTUNITY_ADMIN_TOKEN:-}" ]; then
            echo 'OPPORTUNITY_ADMIN_TOKEN_MISSING'
            exit 2
          fi
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          body='/tmp/reassess.json'
          code=$(curl --show-error --silent --max-time 60 -o "$body" -w '%{http_code}' \
            -X POST "$base/commercial/reassess" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json')
          echo "===== commercial reassess HTTP $code ====="
          cat "$body"
          echo
          test "$code" = '202'

      - name: Rotate candidates until one viable outreach consumes the external slot
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          consumed=false

          for attempt in 1 2 3 4 5 6; do
            echo "===== revenue candidate rotation $attempt/6 ====="

            proposal="/tmp/proposal-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$proposal" -w '%{http_code}' \
              -X POST "$base/proposals/prepare-top" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "proposal HTTP $code"
            cat "$proposal"; echo
            test "$code" = '202'

            quality="/tmp/quality-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$quality" -w '%{http_code}' \
              -X POST "$base/quality/review-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "quality HTTP $code"
            cat "$quality"; echo
            test "$code" = '202'

            probe="/tmp/probe-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$probe" -w '%{http_code}' \
              -X POST "$base/outreach/probe-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "probe HTTP $code"
            cat "$probe"; echo
            test "$code" = '202'

            send="/tmp/send-$attempt.json"
            code=$(curl --show-error --silent --max-time 60 -o "$send" -w '%{http_code}' \
              -X POST "$base/outreach/send-next" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'accept: application/json')
            echo "send HTTP $code"
            cat "$send"; echo
            test "$code" = '202'

            # One real external slot per cycle. Stop on a successful send or on
            # an actual failed send attempt. Pure probe blockers such as auth
            # requirements do not consume the slot and may rotate to the next
            # candidate.
            if jq -e '(.sent == true) or (.externalAttempted == true) or (.status == "SEND_FAILED")' "$send" >/dev/null 2>&1; then
              consumed=true
              echo "EXTERNAL_SLOT_CONSUMED_ON_ATTEMPT=$attempt"
              break
            fi
          done

          echo "EXTERNAL_SLOT_CONSUMED=$consumed"

      - name: Read revenue sprint results
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '===== /commercial/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/commercial/stats"
          echo
          echo '===== /commercial/next ====='
          curl --fail --show-error --silent --max-time 30 "$base/commercial/next"
          echo
          echo '===== /proposals/next ====='
          curl --fail --show-error --silent --max-time 30 "$base/proposals/next"
          echo
          echo '===== /quality/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/quality/stats"
          echo
          echo '===== /outreach/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/outreach/stats"
          echo
          echo '===== /outreach/next ====='
          curl --fail --show-error --silent --max-time 30 "$base/outreach/next"
          echo
          echo '===== /first-cash/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/first-cash/stats"
          echo
          echo '===== /agent-economy/stats ====='
          curl --fail --show-error --silent --max-time 30 "$base/agent-economy/stats"
          echo
          echo '===== /portfolio-governor/state ====='
          curl --fail --show-error --silent --max-time 30 "$base/portfolio-governor/state"
          echo
