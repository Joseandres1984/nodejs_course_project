name: LUMEN A2A Global Registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-a2a-registry.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-a2a-global-registry
  cancel-in-progress: true

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish current Cloudflare A2A manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          manifest = "https://lumen-zero-a2a.lumen-b2b.workers.dev/.well-known/agent-card.json"
          ingest = "https://api.a2a-registry.org/public/ingest"
          search = "https://api.a2a-registry.org/public/agents"

          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "LUMEN-B2B-Registry-Publisher/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return int(response.status), json.loads(response.read(300000).decode("utf-8", errors="replace") or "{}")

          # Fail closed if the canonical public card is not actually reachable or no longer identifies LUMEN.
          status, card = get_json(manifest)
          assert status == 200, f"agent_card_http_{status}"
          assert str(card.get("name") or "") == "LUMEN B2B Agent", "unexpected_agent_identity"
          assert str(card.get("protocolVersion") or "") == "1.0", "unexpected_a2a_protocol_version"
          endpoint = str(card.get("url") or "")
          assert endpoint.startswith("https://lumen-zero-a2a.lumen-b2b.workers.dev/"), "noncanonical_agent_endpoint"
          print("LUMEN_REGISTRY_PREFLIGHT card=ok protocol=1.0 canonical_cloudflare=true")

          body = json.dumps({"manifestUrl": manifest}).encode("utf-8")
          req = urllib.request.Request(
              ingest,
              data=body,
              method="POST",
              headers={"Accept": "application/json", "Content-Type": "application/json", "User-Agent": "LUMEN-B2B-Registry-Publisher/1.0"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(300000).decode("utf-8", errors="replace")
                  ingest_status = int(response.status)
                  print(f"LUMEN_REGISTRY_INGEST http={ingest_status} response={raw[:1200]}")
                  if ingest_status < 200 or ingest_status >= 300:
                      raise SystemExit(f"registry_ingest_http_{ingest_status}")
          except urllib.error.HTTPError as exc:
              raw = exc.read(300000).decode("utf-8", errors="replace")
              # Existing listings may be reported as a conflict by some registry revisions.
              print(f"LUMEN_REGISTRY_INGEST http={exc.code} response={raw[:1200]}")
              if exc.code != 409:
                  raise

          found = False
          found_rows = []
          for attempt in range(6):
              params = urllib.parse.urlencode({"q": "LUMEN B2B", "target": "Business"})
              try:
                  _, payload = get_json(search + "?" + params)
              except Exception as exc:
                  print(f"LUMEN_REGISTRY_VERIFY attempt={attempt+1} error={type(exc).__name__}")
                  time.sleep(10)
                  continue
              rows = payload if isinstance(payload, list) else payload.get("agents") or payload.get("results") or payload.get("data") or []
              if isinstance(rows, dict):
                  rows = rows.get("agents") or rows.get("results") or []
              for row in rows if isinstance(rows, list) else []:
                  text = json.dumps(row, ensure_ascii=False).lower()
                  if "lumen b2b" in text or "lumen-zero-a2a.lumen-b2b.workers.dev" in text:
                      found_rows.append(row)
              if found_rows:
                  found = True
                  break
              if attempt < 5:
                  time.sleep(10)

          print(f"LUMEN_REGISTRY_VERIFY visible_now={str(found).lower()} matches={len(found_rows)}")
          if found_rows:
              print("LUMEN_REGISTRY_MATCH " + json.dumps(found_rows[:3], ensure_ascii=False)[:4000])
          # Indexing may be asynchronous; a successful public ingest is the authoritative write result.
          PY
