name: LUMEN A2A Global Registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-a2a-registry.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-a2a-global-registry
  cancel-in-progress: true

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register canonical Cloudflare A2A agent
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = "https://lumen-zero-a2a.lumen-b2b.workers.dev"
          manifest = origin + "/.well-known/agent-card.json"
          public_search = "https://api.a2a-registry.org/public/agents"
          registry_origins = ("https://api.a2a-registry.org", "https://www.a2a-registry.org")
          user_agent = "LUMEN-B2B-Registry-Publisher/2.0"

          def request(url, method="GET", body=None, timeout=25):
              headers = {"Accept": "application/json", "User-Agent": user_agent}
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return int(response.status), response.read(500000).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read(500000).decode("utf-8", errors="replace")
              except Exception as exc:
                  return 0, f"{type(exc).__name__}: {str(exc)[:300]}"

          def decode(raw):
              try:
                  return json.loads(raw or "{}")
              except Exception:
                  return {}

          # Fail closed before any registry mutation if LUMEN's canonical public identity drifted.
          status, raw = request(manifest)
          card = decode(raw)
          assert status == 200, f"agent_card_http_{status}"
          assert card.get("name") == "LUMEN B2B Agent", "unexpected_agent_identity"
          assert str(card.get("protocolVersion") or "") == "1.0", "unexpected_protocol_version"
          assert str(card.get("url") or "").startswith(origin + "/"), "noncanonical_agent_endpoint"
          assert any(str((x or {}).get("id") or "") == "lumen-machine-store" for x in card.get("skills", []) if isinstance(x, dict)), "machine_store_skill_missing"
          print("LUMEN_REGISTRY_PREFLIGHT card=ok protocol=1.0 canonical_cloudflare=true")

          # The live Registry UI (verified 2026-09-22) uses POST /public/ingest/scan with {url}.
          registry_base = None
          scan_data = None
          for base in registry_origins:
              scan_status, scan_raw = request(base + "/public/ingest/scan", method="POST", body={"url": origin})
              payload = decode(scan_raw)
              print(f"LUMEN_REGISTRY_SCAN base={base} http={scan_status} success={bool(payload.get('success'))}")
              if scan_status in range(200, 300) and payload.get("success") and isinstance(payload.get("data"), dict) and payload["data"].get("found"):
                  registry_base = base
                  scan_data = payload["data"]
                  break
          if not registry_base:
              raise SystemExit("registry_scan_did_not_detect_lumen")

          safe_scan = {
              "found": bool(scan_data.get("found")),
              "package_name": scan_data.get("package_name") or scan_data.get("packageName"),
              "manifest_url": scan_data.get("manifest_url") or scan_data.get("manifestUrl"),
              "status": scan_data.get("status"),
          }
          print("LUMEN_REGISTRY_SCAN_DETECTED " + json.dumps(safe_scan, ensure_ascii=False)[:2000])

          # Same exact public flow used by the Registry's Submit Agent page.
          submit_status, submit_raw = request(
              registry_base + "/public/ingest/submit-and-claim",
              method="POST",
              body={"url": origin},
          )
          submit = decode(submit_raw)
          print(f"LUMEN_REGISTRY_SUBMIT base={registry_base} http={submit_status} success={bool(submit.get('success'))}")
          if submit_status not in range(200, 300) or not submit.get("success"):
              print("LUMEN_REGISTRY_SUBMIT_RESPONSE " + submit_raw[:3000])
              raise SystemExit(f"registry_submit_failed_{submit_status}")

          data = submit.get("data") if isinstance(submit.get("data"), dict) else {}
          print("LUMEN_REGISTRY_SUBMIT_RESULT " + json.dumps({
              "status": data.get("status"),
              "package_name": data.get("package_name") or data.get("packageName"),
              "message": data.get("message"),
              "claim_hint_present": bool(data.get("claimHint")),
          }, ensure_ascii=False)[:3000])

          # Public search is authoritative for discoverability. Allow a short indexing delay.
          visible = []
          for attempt in range(8):
              params = urllib.parse.urlencode({"q": "LUMEN B2B", "target": "Business"})
              q_status, q_raw = request(public_search + "?" + params)
              q = decode(q_raw)
              rows = q if isinstance(q, list) else q.get("agents") or q.get("results") or q.get("data") or []
              if isinstance(rows, dict):
                  rows = rows.get("agents") or rows.get("results") or []
              visible = [row for row in rows if isinstance(row, dict) and ("lumen b2b" in json.dumps(row, ensure_ascii=False).lower() or "lumen-zero-a2a.lumen-b2b.workers.dev" in json.dumps(row, ensure_ascii=False).lower())]
              if visible:
                  break
              if attempt < 7:
                  time.sleep(8)

          canonical = [row for row in visible if "lumen-zero-a2a.lumen-b2b.workers.dev" in json.dumps(row, ensure_ascii=False).lower()]
          print(f"LUMEN_REGISTRY_VERIFY visible={bool(visible)} matches={len(visible)} canonical_cloudflare={len(canonical)}")
          if visible:
              print("LUMEN_REGISTRY_PUBLIC_MATCH " + json.dumps(visible[:3], ensure_ascii=False)[:5000])
          if not visible:
              raise SystemExit("registry_submit_succeeded_but_public_search_not_visible_yet")
          PY
