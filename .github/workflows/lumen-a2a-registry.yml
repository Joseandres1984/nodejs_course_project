name: LUMEN A2A Global Registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-a2a-registry.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-a2a-global-registry
  cancel-in-progress: true

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish current Cloudflare A2A manifest
        shell: bash
        run: |
          python - <<'PY'
          import html.parser
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          manifest = "https://lumen-zero-a2a.lumen-b2b.workers.dev/.well-known/agent-card.json"
          documented_ingest = "https://api.a2a-registry.org/public/ingest"
          search = "https://api.a2a-registry.org/public/agents"
          submit_page = "https://www.a2a-registry.org/submit"
          user_agent = "LUMEN-B2B-Registry-Publisher/1.1"

          def request(url, method="GET", body=None, accept="application/json", timeout=25):
              headers = {"Accept": accept, "User-Agent": user_agent}
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return int(response.status), response.read(500000).decode("utf-8", errors="replace"), dict(response.headers)
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read(500000).decode("utf-8", errors="replace"), dict(exc.headers)

          def json_payload(url):
              status, raw, _ = request(url)
              return status, json.loads(raw or "{}")

          status, card = json_payload(manifest)
          assert status == 200, f"agent_card_http_{status}"
          assert str(card.get("name") or "") == "LUMEN B2B Agent", "unexpected_agent_identity"
          assert str(card.get("protocolVersion") or "") == "1.0", "unexpected_a2a_protocol_version"
          endpoint = str(card.get("url") or "")
          assert endpoint.startswith("https://lumen-zero-a2a.lumen-b2b.workers.dev/"), "noncanonical_agent_endpoint"
          print("LUMEN_REGISTRY_PREFLIGHT card=ok protocol=1.0 canonical_cloudflare=true")

          def find_lumen():
              params = urllib.parse.urlencode({"q": "LUMEN B2B", "target": "Business"})
              status, payload = json_payload(search + "?" + params)
              if status != 200:
                  return []
              rows = payload if isinstance(payload, list) else payload.get("agents") or payload.get("results") or payload.get("data") or []
              if isinstance(rows, dict):
                  rows = rows.get("agents") or rows.get("results") or []
              matches = []
              for row in rows if isinstance(rows, list) else []:
                  text = json.dumps(row, ensure_ascii=False).lower()
                  if "lumen b2b" in text or "lumen-zero-a2a.lumen-b2b.workers.dev" in text:
                      matches.append(row)
              return matches

          before = find_lumen()
          canonical_before = [x for x in before if "lumen-zero-a2a.lumen-b2b.workers.dev" in json.dumps(x, ensure_ascii=False).lower()]
          print(f"LUMEN_REGISTRY_BEFORE matches={len(before)} canonical_cloudflare={len(canonical_before)}")

          ingest_status, ingest_raw, _ = request(documented_ingest, method="POST", body={"manifestUrl": manifest})
          print(f"LUMEN_REGISTRY_INGEST documented_http={ingest_status} response={ingest_raw[:1000]}")

          if ingest_status == 404:
              # The public repository currently documents /public/ingest, but the live API can move ahead of docs.
              # Inspect only public submit-page assets to identify the live public submit route; do not guess-write to endpoints.
              page_status, page_html, _ = request(submit_page, accept="text/html")
              print(f"LUMEN_REGISTRY_SUBMIT_PAGE http={page_status} bytes={len(page_html)}")
              srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page_html, flags=re.I)
              candidates = set()
              for src in srcs[:30]:
                  asset = urllib.parse.urljoin(submit_page, src)
                  astatus, text, _ = request(asset, accept="*/*")
                  if astatus != 200:
                      continue
                  for pat in (
                      r'["\']([^"\']*(?:ingest|submit|register)[^"\']*)["\']',
                      r'["\']([^"\']*manifestUrl[^"\']*)["\']',
                  ):
                      for value in re.findall(pat, text, flags=re.I):
                          if len(value) <= 300:
                              candidates.add(value)
              safe = sorted(x for x in candidates if "secret" not in x.lower() and "token" not in x.lower())
              print("LUMEN_REGISTRY_ROUTE_DISCOVERY " + json.dumps(safe[:80], ensure_ascii=False)[:12000])
              print("LUMEN_REGISTRY_STATUS documented_endpoint_stale=true write_not_retried_without_verified_route=true")
          elif ingest_status in range(200, 300) or ingest_status == 409:
              for attempt in range(6):
                  after = find_lumen()
                  canonical = [x for x in after if "lumen-zero-a2a.lumen-b2b.workers.dev" in json.dumps(x, ensure_ascii=False).lower()]
                  if canonical:
                      print(f"LUMEN_REGISTRY_VERIFY visible_now=true matches={len(after)} canonical_cloudflare={len(canonical)}")
                      print("LUMEN_REGISTRY_MATCH " + json.dumps(canonical[:3], ensure_ascii=False)[:4000])
                      break
                  if attempt < 5:
                      time.sleep(10)
              else:
                  print("LUMEN_REGISTRY_VERIFY visible_now=false indexing_may_be_async=true")
          else:
              raise SystemExit(f"registry_ingest_http_{ingest_status}")
          PY
