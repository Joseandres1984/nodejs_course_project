name: LUMEN Redundancy Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-redundancy-smoke.yml'
  workflow_dispatch:

jobs:
  redundancy-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Redundancy Engine v1
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl --show-error --silent --max-time 10 "$BASE_URL/redundancy/stats" || true)
            echo "$body"
            if echo "$body" | grep -q '1.0-redundancy-engine'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Build benches with retry
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl --show-error --silent --max-time 60 -o /tmp/red.json -w '%{http_code}' \
              -X POST "$BASE_URL/redundancy/recompute" \
              -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
              -H 'content-type: application/json' \
              -d '{}' || true)
            cat /tmp/red.json 2>/dev/null || true
            echo
            if [ "$code" = '202' ] && grep -q '1.0-redundancy-engine' /tmp/red.json; then break; fi
            sleep 3
          done
          jq -e '.ok == true and .version == "1.0-redundancy-engine" and .benchEntries >= 1 and .guardrails.automaticInternalTeamReplacement == true and .guardrails.automaticExternalRedispatch == false and .guardrails.autonomousSpend == false and .guardrails.bindingAllowed == false and .guardrails.maxAlternatesPerRole == 2' /tmp/red.json >/dev/null

      - name: Verify no autonomous redispatch
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/redundancy/stats" > /tmp/stats.json
          cat /tmp/stats.json
          echo
          jq -e '.version == "1.0-redundancy-engine" and .benchEntries >= 1 and .externalRedispatches == 0 and .automaticExternalRedispatch == false and .autonomousSpend == false and .bindingActionsHumanGated == true' /tmp/stats.json >/dev/null
