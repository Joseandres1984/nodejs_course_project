name: LUMEN ChatGPT MCP deploy

on:
  push:
    branches: [lumen-chatgpt-plugin-v1]
    paths:
      - '.lumen/a2a-worker/chatgpt-mcp.js'
      - '.lumen/a2a-worker/adaptive-chatgpt-entry.js'
      - '.github/workflows/lumen-chatgpt-mcp-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          echo 'CLOUDFLARE_CREDENTIALS_PRESENT'
      - name: Deploy MCP on existing LUMEN worker
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.chatgpt-live.toml
          sed -i 's/^main = "opportunity-entry.js"$/main = "adaptive-chatgpt-entry.js"/' wrangler.chatgpt-live.toml
          grep -q '^name = "lumen-zero-a2a"$' wrangler.chatgpt-live.toml
          grep -q '^main = "adaptive-chatgpt-entry.js"$' wrangler.chatgpt-live.toml
          npx --yes wrangler@latest deploy --config wrangler.chatgpt-live.toml
      - name: Smoke test existing LUMEN plus MCP
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          live=0
          for i in $(seq 1 15); do
            if curl -fsS "$BASE/opportunity-factory/policy" -o factory.json && curl -fsS "$BASE/revenue-director/state" -o revenue.json; then
              live=1
              break
            fi
            sleep 4
          done
          test "$live" -eq 1
          jq -e '.autonomousSpend == false' factory.json >/dev/null

          mcp=0
          for i in $(seq 1 15); do
            if curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' -o init.json && jq -e '.result.serverInfo.name == "lumen-readonly"' init.json >/dev/null; then
              mcp=1
              break
            fi
            sleep 4
          done
          if [ "$mcp" -ne 1 ]; then
            echo 'MCP_INITIALIZE_NOT_READY'
            cat init.json 2>/dev/null || true
            exit 1
          fi

          curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -o tools.json
          jq -e '[.result.tools[].name] | index("lumen_status") != null and index("lumen_opportunities") != null and index("lumen_top_opportunities") != null and index("lumen_revenue_status") != null and index("lumen_pending_approvals") != null' tools.json >/dev/null
          curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"lumen_status","arguments":{}}}' -o status.json
          jq -e '.result.isError == false and .result.structuredContent.readOnly == true and .result.structuredContent.authority.sendsMessages == false and .result.structuredContent.authority.writesState == false and .result.structuredContent.authority.autonomousSpendUsd == 0' status.json >/dev/null
          echo 'LUMEN_EXISTING_RUNTIME_AND_MCP_OK'
