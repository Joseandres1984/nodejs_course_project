name: LUMEN ChatGPT MCP deploy

on:
  push:
    branches: [lumen-chatgpt-plugin-v1]
    paths:
      - '.lumen/a2a-worker/chatgpt-mcp.js'
      - '.lumen/a2a-worker/chatgpt-mcp-entry.js'
      - '.lumen/a2a-worker/wrangler.chatgpt.toml'
      - '.github/workflows/lumen-chatgpt-mcp-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          echo 'CLOUDFLARE_CREDENTIALS_PRESENT'
      - name: Deploy isolated read-only MCP
        working-directory: .lumen/a2a-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.chatgpt.toml
      - name: Smoke test health and MCP discovery
        run: |
          set -euo pipefail
          BASE='https://lumen-chatgpt-mcp.lumen-b2b.workers.dev'
          for i in $(seq 1 15); do
            if curl -fsS "$BASE/health" -o health.json; then break; fi
            sleep 4
          done
          jq -e '.ok == true and .readOnly == true and .authority.sendsMessages == false and .authority.writesState == false and .authority.autonomousSpendUsd == 0' health.json >/dev/null
          curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' -o init.json
          jq -e '.result.serverInfo.name == "lumen-readonly"' init.json >/dev/null
          curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -o tools.json
          jq -e '[.result.tools[].name] | index("lumen_status") != null and index("lumen_opportunities") != null and index("lumen_top_opportunities") != null and index("lumen_revenue_status") != null and index("lumen_pending_approvals") != null' tools.json >/dev/null
          echo 'LUMEN_CHATGPT_MCP_DEPLOY_OK'
