name: LUMEN International USD Conversion Deploy

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/conversion-worker/**'
      - '.github/workflows/lumen-international-usd-conversion-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/conversion-worker/**'
      - '.github/workflows/lumen-international-usd-conversion-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify human USD conversion path and no-charge truth
        run: |
          set -euo pipefail
          node --check .lumen/conversion-worker/worker.js
          node --check .lumen/public-worker/revenue-storefront.js
          node .lumen/conversion-worker/test-usd-human-intent.mjs
          node .lumen/conversion-worker/test-usd-owner-inbox.mjs
          node .lumen/conversion-worker/test-english-b2b-buyer.mjs
      - name: Check Cloudflare bundle without deployment
        working-directory: .lumen/conversion-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Cloudflare conversion storefront
        working-directory: .lumen/conversion-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Verify live industrial RFQ buyer intake landing
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-conversion.lumen-b2b.workers.dev'
          live=0
          for i in $(seq 1 12); do
            en=$(curl -fsS --max-time 15 "$BASE/en/industrial-rfq?src=technical-canary&campaign=live-smoke&technical_canary=1" || true)
            es=$(curl -fsS --max-time 15 "$BASE/industrial-rfq?src=technical-canary&campaign=live-smoke&technical_canary=1" || true)
            if printf '%s' "$en" | grep -q 'Industrial Supplier Quote Review' \
              && printf '%s' "$en" | grep -q 'USD 7' \
              && printf '%s' "$en" | grep -q 'name="next" value="invoice_usd"' \
              && printf '%s' "$en" | grep -q 'action="/intent/quote-sanity' \
              && printf '%s' "$es" | grep -q 'Revisión de cotizaciones industriales' \
              && printf '%s' "$es" | grep -q 'Pagar USDC / x402'; then
              live=1
              break
            fi
            sleep 3
          done
          test "$live" -eq 1
          echo 'INDUSTRIAL_RFQ_LIVE_BILINGUAL_USD_X402_INTAKE_OK_NO_PAYMENTS'
      - name: Bind existing owner-only admin secret to conversion Worker
        working-directory: .lumen/conversion-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPPORTUNITY_ADMIN_TOKEN"
          printf '%s' "$OPPORTUNITY_ADMIN_TOKEN" | npx --yes wrangler@latest secret put OPPORTUNITY_ADMIN_TOKEN --config wrangler.toml
      - name: Verify international USD inquiry option is live
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-conversion.lumen-b2b.workers.dev'
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 20 "$BASE/health" -o health.json \
              && curl -fsS --max-time 20 "$BASE/offer/sourcing-5" -o offer.html \
              && curl -fsS --max-time 20 "$BASE/catalog.json" -o catalog.json \
              && curl -fsS --max-time 20 "$BASE/en" -o english-catalog.html \
              && curl -fsS --max-time 20 "$BASE/en/offer/sourcing-5" -o english-offer.html \
              && jq -e '.ok == true and .version == "1.4-international-buyer-sales" and .paidSpend == false and .crmBridge == true' health.json >/dev/null \
              && grep -q 'Solicitar pago en USD (sin compromiso)' offer.html \
              && grep -q 'Pagar con USDC (x402)' offer.html \
              && grep -q 'no genera una factura automática, un cargo' offer.html \
              && grep -q 'Find better suppliers. Check quotes. Move faster.' english-catalog.html \
              && grep -q 'Request USD payment details (no charge)' english-offer.html \
              && grep -q 'USD 15 / report' english-offer.html \
              && jq -e '.ok == true and (.products|length) == 6' catalog.json >/dev/null; then
                ready=1
                break
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo 'LIVE_USD_CHECKOUT_SMOKE_FAILED'
            cat health.json || true
            exit 1
          fi
          UNAUTH_CODE="$(curl -sS --max-time 20 -o unauth.json -w '%{http_code}' "$BASE/sales/pending-usd")"
          test "$UNAUTH_CODE" = '403'
          AUTH_CODE="$(curl -sS --max-time 20 -o private.json -w '%{http_code}' "$BASE/sales/pending-usd" -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN")"
          test "$AUTH_CODE" = '200'
          jq -e '.ok == true and (.ownerOnly == true) and (.chargeCreated == false) and (.pending | type == "boolean")' private.json >/dev/null
          rm -f private.json unauth.json
          echo 'LIVE_USD_INVOICE_INQUIRY_READY_NO_AUTONOMOUS_CHARGES'
