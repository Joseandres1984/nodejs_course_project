name: LUMEN International USD Conversion Deploy

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/conversion-worker/**'
      - '.github/workflows/lumen-international-usd-conversion-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/conversion-worker/**'
      - '.github/workflows/lumen-international-usd-conversion-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify human USD conversion path and no-charge truth
        run: |
          set -euo pipefail
          node --check .lumen/conversion-worker/worker.js
          node .lumen/conversion-worker/test-usd-human-intent.mjs
      - name: Check Cloudflare bundle without deployment
        working-directory: .lumen/conversion-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Cloudflare conversion storefront
        working-directory: .lumen/conversion-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Verify international USD inquiry option is live
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-conversion.lumen-b2b.workers.dev'
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 20 "$BASE/health" -o health.json \
              && curl -fsS --max-time 20 "$BASE/offer/sourcing-5" -o offer.html \
              && curl -fsS --max-time 20 "$BASE/catalog.json" -o catalog.json \
              && jq -e '.ok == true and .version == "1.2-usd-human-checkout-request" and .paidSpend == false and .crmBridge == true' health.json >/dev/null \
              && grep -q 'Solicitar pago en USD (sin compromiso)' offer.html \
              && grep -q 'Pagar con USDC (x402)' offer.html \
              && grep -q 'no genera una factura automática, un cargo' offer.html \
              && jq -e '.ok == true and (.products|length) == 6' catalog.json >/dev/null; then
                ready=1
                break
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo 'LIVE_USD_CHECKOUT_SMOKE_FAILED'
            cat health.json || true
            exit 1
          fi
          echo 'LIVE_USD_INVOICE_INQUIRY_READY_NO_AUTONOMOUS_CHARGES'
