name: LUMEN Travel Affiliate production config smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/viator-api.js'
      - '.lumen/a2a-worker/viator-smart-recommend.js'
      - '.lumen/a2a-worker/wrangler.toml'
      - '.github/workflows/lumen-travel-affiliate-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production configuration without synthetic production API traffic
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl -fsS --max-time 15 "$BASE/viator/api/status" -o status.json
          curl -fsS --max-time 15 "$BASE/health/viator-affiliate" -o affiliate.json
          jq -e '.version == "1.0-viator-partner-api" and .provider == "viator" and .configured == true and .environment == "production" and .apiVersion == "2.0" and .authentication == "exp-api-key" and .secretExposed == false and .bookingAuthority == false and .paymentAuthority == false and .autonomousSpendUsd == 0' status.json >/dev/null
          jq -e '.ok == true and .provider == "viator" and .mode == "affiliate-link-generation" and .pidConfigured == true' affiliate.json >/dev/null
          echo 'VIATOR_PRODUCTION_CONFIGURATION_OK'
