name: LUMEN public worker deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/public-worker/**'
      - '.github/workflows/lumen-public-worker-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'REQUIRED_SECRETS_MISSING'
            exit 2
          fi
          echo 'REQUIRED_SECRETS_PRESENT'
      - name: Validate public worker
        working-directory: .lumen/public-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
      - name: Deploy lumen-zero-public
        working-directory: .lumen/public-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml
      - name: Smoke public health and storefront
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-public.lumen-b2b.workers.dev'
          ready=0
          for i in $(seq 1 20); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$BASE/health" || true)"
            if [ "$code" = '200' ] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" -eq 1
          root="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$root" -w '%{http_code}' "$BASE/" || true)"
          test "$code" = '200'
          echo 'PUBLIC_WORKER_LIVE_OK'
