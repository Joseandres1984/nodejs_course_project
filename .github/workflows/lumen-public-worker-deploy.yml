name: LUMEN Public Worker deploy

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/public-worker/**'
      - '.github/workflows/lumen-public-worker-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate public worker bundle
        working-directory: .lumen/public-worker
        run: |
          node --check discover.js
          node --check worker.js
          node --check gateway.js
          npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'PUBLIC_DEPLOY_SECRETS_MISSING_NO_LIVE_CHANGE'
            exit 2
          fi
          echo 'PUBLIC_DEPLOY_SECRETS_PRESENT'

      - name: Deploy lumen-zero-public
        working-directory: .lumen/public-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Smoke public health, home and Travel storefront
        run: |
          set -euo pipefail
          BASE='https://lumen-zero-public.lumen-b2b.workers.dev'
          ok=0
          for i in $(seq 1 20); do
            health_code="$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/health" || true)"
            home_code="$(curl -sS --max-time 20 -o home.html -w '%{http_code}' "$BASE/" || true)"
            discover_code="$(curl -sS --max-time 20 -o discover.html -w '%{http_code}' "$BASE/discover" || true)"
            guide_code="$(curl -sS --max-time 20 -o guide.html -w '%{http_code}' "$BASE/discover/comparar-precios-online-sin-falsas-ofertas" || true)"
            sitemap_code="$(curl -sS --max-time 20 -o sitemap.xml -w '%{http_code}' "$BASE/sitemap.xml" || true)"
            robots_code="$(curl -sS --max-time 20 -o robots.txt -w '%{http_code}' "$BASE/robots.txt" || true)"
            travel_code="$(curl -sS --max-time 30 -o travel.html -w '%{http_code}' "$BASE/travel?q=Rio%20de%20Janeiro&source=web" || true)"
            travel_json_code="$(curl -sS --max-time 30 -o travel.json -w '%{http_code}' "$BASE/travel.json?q=Rio%20de%20Janeiro&source=web" || true)"
            package_code="$(curl -sS --max-time 40 -o package.html -w '%{http_code}' "$BASE/travel/package?destination=GIG&duration=7&month=11&travelers=2&budget=2500&source=web" || true)"
            package_json_code="$(curl -sS --max-time 40 -o package.json -w '%{http_code}' "$BASE/travel/package.json?destination=GIG&duration=7&month=11&travelers=2&budget=2500&source=web" || true)"
            if [ "$health_code" = '200' ] && [ "$home_code" = '200' ] && [ "$discover_code" = '200' ] && [ "$guide_code" = '200' ] && [ "$sitemap_code" = '200' ] && [ "$robots_code" = '200' ] && [ "$travel_code" = '200' ] && [ "$travel_json_code" = '200' ] && [ "$package_code" = '200' ] && [ "$package_json_code" = '200' ] \
              && grep -q '"ok":true' health.json \
              && grep -q 'LUMEN' home.html \
              && grep -q 'LUMEN Discover' discover.html \
              && grep -q 'Cómo comparar precios online' guide.html \
              && grep -q '/discover/' sitemap.xml \
              && grep -q 'Sitemap:' robots.txt \
              && grep -q 'LUMEN Travel' travel.html \
              && grep -q 'Transparencia' travel.html \
              && grep -q 'Armá tu viaje' package.html \
              && jq -e '.ok == true and (.version == "4.0-lumen-travel-complete-trip" or .version == "3.0-lumen-travel-marketplace" or .version == "2.0-lumen-travel-site") and .affiliateDisclosure == true and .bookingAuthority == false and .paymentAuthority == false and .autonomousSpendUsd == 0' travel.json >/dev/null \
              && jq -e '.ok == true and .version == "4.0-lumen-travel-complete-trip" and .mode == "complete_trip" and .affiliateDisclosure == true and .bookingAuthority == false and .paymentAuthority == false and .autonomousSpendUsd == 0 and (.packageQuote.guardrails.createsBooking == false) and (.packageQuote.guardrails.createsCharge == false)' package.json >/dev/null; then
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            echo "PUBLIC_SMOKE_FAILED health=${health_code:-none} home=${home_code:-none} discover=${discover_code:-none} guide=${guide_code:-none} sitemap=${sitemap_code:-none} robots=${robots_code:-none} travel=${travel_code:-none} travel_json=${travel_json_code:-none} package=${package_code:-none} package_json=${package_json_code:-none}"
            cat health.json 2>/dev/null || true
            head -c 500 home.html 2>/dev/null || true
            head -c 800 travel.html 2>/dev/null || true
            head -c 800 package.html 2>/dev/null || true
            cat package.json 2>/dev/null || true
            exit 1
          fi
          echo 'PUBLIC_DISCOVER_TRAVEL_AND_COMPLETE_TRIP_SMOKE_OK'
