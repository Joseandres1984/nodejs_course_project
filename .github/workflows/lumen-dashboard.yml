name: LUMEN Zero Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lumen-dashboard.yml

permissions:
  contents: read

concurrency:
  group: lumen-zero-dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      LUMEN_DASHBOARD_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Dashboard deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$LUMEN_DASHBOARD_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Dashboard deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard code is ready but deployment is waiting for Cloudflare Workers token and dashboard password."
          fi

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate dashboard worker syntax
        if: steps.preflight.outputs.ready == 'true'
        run: |
          node --check .lumen/dashboard/pricing_worker.js
          node --check .lumen/dashboard/experiment_worker.js
          node --check .lumen/dashboard/stable_worker.js

      - name: Deploy unified command center
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/dashboard
        run: npx --yes wrangler@4 deploy

      - name: Install dashboard password
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/dashboard
        shell: bash
        run: printf '%s' "$LUMEN_DASHBOARD_PASSWORD" | npx --yes wrangler@4 secret put LUMEN_DASHBOARD_PASSWORD

      - name: Verify live command center, Experiment Engine, pricing, Machine Store and recovery
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          base='https://lumen-zero-dashboard.lumen-b2b.workers.dev'
          a2a='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          for i in {1..12}; do
            health_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-health.json -w '%{http_code}' "$base/health" || true)
            full_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-full.html -w '%{http_code}' "$base/full" || true)
            data_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-data.json -w '%{http_code}' "$base/api/data" || true)
            state_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-full-state.json -w '%{http_code}' "$base/api/full-state" || true)
            experiment_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-experiments.json -w '%{http_code}' "$base/api/experiments" || true)
            recovery_code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-recovery-state.json -w '%{http_code}' "$base/api/recovery-state" || true)
            machine_code=$(curl -sS -o /tmp/lumen-machine.json -w '%{http_code}' "$a2a/machine/catalog" || true)
            stats_code=$(curl -sS -o /tmp/lumen-machine-stats.json -w '%{http_code}' "$a2a/machine/stats" || true)
            if [[ "$health_code" == "200" && "$full_code" == "200" && "$data_code" == "200" && "$state_code" == "200" && "$experiment_code" == "200" && "$recovery_code" == "200" && "$machine_code" == "200" && "$stats_code" == "200" ]]; then
              python - <<'PY'
          import json
          from pathlib import Path

          html = Path('/tmp/lumen-full.html').read_text(errors='replace')
          runtime = json.loads(Path('/tmp/lumen-data.json').read_text())
          data = json.loads(Path('/tmp/lumen-full-state.json').read_text())
          experiments = json.loads(Path('/tmp/lumen-experiments.json').read_text())
          recovery = json.loads(Path('/tmp/lumen-recovery-state.json').read_text())
          machine = json.loads(Path('/tmp/lumen-machine.json').read_text())
          machine_stats = json.loads(Path('/tmp/lumen-machine-stats.json').read_text())

          for token in ('Centro de Comando Completo','Recuperación Railway','Servicios y precios','Desde USD 59','USD 249','LUMEN ahora','A2A · Machine Store','Productos que otros agentes pueden comprar','USD 5','Ingresos recurrentes','Experimentos','Experiment Engine','Aprender qué vende mejor'):
              assert token in html, token

          catalog = runtime.get('catalog') or {}
          services = catalog.get('services') or []
          prices = {str(x.get('id')): int(x.get('from_usd') or 0) for x in services}
          expected = {
              'SRV-QUOTECHECK': 59,
              'SRV-SUPPLIERCHECK': 79,
              'SRV-TENDER-HUNTER': 99,
              'SRV-SOURCING-EXPRESS': 149,
              'SRV-B2B-PROSPECTING': 199,
              'SRV-EXPORT-SCOUT': 249,
          }
          assert prices == expected, (prices, expected)
          assert int(catalog.get('floor_usd') or 0) == 59
          assert int(catalog.get('ceiling_usd') or 0) == 249
          assert float(catalog.get('average_usd') or 0) == 139.0

          assert experiments.get('policy') == '80_20_exploit_explore', experiments
          assert float(experiments.get('exploit_share') or 0) == 0.8
          assert float(experiments.get('explore_share') or 0) == 0.2
          exp_guard = experiments.get('guardrails') or {}
          assert float(exp_guard.get('monetary_budget_usd') or 0) == 0
          assert exp_guard.get('paid_media_authority_changed') is False
          assert exp_guard.get('binding_authority_changed') is False
          assert exp_guard.get('search_budget_increased') is False
          assert exp_guard.get('hard_bottleneck_override') is False

          products = machine.get('machineProducts') or []
          plans = machine.get('recurringPlans') or []
          assert len(products) == 6
          assert len(plans) == 4
          assert min(int(x.get('price_usd') or 0) for x in products) == 5
          assert machine.get('payments',{}).get('outgoingSpendEnabled') is False
          assert machine.get('payments',{}).get('x402',{}).get('status') in {'READY','SETUP_REQUIRED'}
          assert machine_stats.get('realizedRevenueUsd') is None

          assert int((data.get('meta') or {}).get('root_keys') or 0) > 0
          assert recovery.get('available') is True
          assert int((recovery.get('historical') or {}).get('accounts') or 0) == 580
          assert int((recovery.get('policy') or {}).get('auto_promoted') or 0) == 0
          assert int((recovery.get('policy') or {}).get('safe_for_outbound') or 0) == 0
          print('LUMEN_FULL_COMMAND_CENTER experiment_engine=80/20-zero-cost pricing=6/6 machine_products=6 recurring_plans=4 owner_summary=ok d1_state=ok recovery=ok')
          PY
              exit 0
            fi
            sleep 5
          done
          echo "LUMEN_UNIFIED_DASHBOARD verification=failed health=$health_code full=$full_code data=$data_code state=$state_code experiments=$experiment_code recovery=$recovery_code machine=$machine_code stats=$stats_code"
          exit 1

# deploy trigger: Experiment Engine v1 command-center promotion 2026-09-22
