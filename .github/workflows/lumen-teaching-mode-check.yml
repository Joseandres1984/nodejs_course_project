name: LUMEN Teaching Mode check

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/dashboard/unified_decision_center_worker.js'
      - '.lumen/dashboard/decision_center_worker.js'
      - '.lumen/dashboard/teaching_mode_worker.js'
      - '.lumen/dashboard/wrangler.toml'
      - '.github/workflows/lumen-teaching-mode-check.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/dashboard/unified_decision_center_worker.js'
      - '.lumen/dashboard/decision_center_worker.js'
      - '.lumen/dashboard/teaching_mode_worker.js'
      - '.lumen/dashboard/wrangler.toml'
      - '.github/workflows/lumen-teaching-mode-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check dashboard wrappers
        run: |
          node --check .lumen/dashboard/unified_decision_center_worker.js
          node --check .lumen/dashboard/decision_center_worker.js
          node --check .lumen/dashboard/teaching_mode_worker.js
      - name: Verify wrapper chain and teaching security bridge
        run: |
          set -euo pipefail
          grep -q '^main = "unified_decision_center_worker.js"$' .lumen/dashboard/wrangler.toml
          grep -q 'from "./decision_center_worker.js"' .lumen/dashboard/unified_decision_center_worker.js
          grep -q 'from "./teaching_mode_worker.js"' .lumen/dashboard/decision_center_worker.js
          grep -q '/api/owner-decisions' .lumen/dashboard/unified_decision_center_worker.js
          grep -q 'COMMERCIAL_CLOSE_SIMULATED' .lumen/dashboard/unified_decision_center_worker.js
          grep -q 'BUILD_TEST_ONLY' .lumen/dashboard/decision_center_worker.js
          grep -q 'production_deploy:false' .lumen/dashboard/decision_center_worker.js
          grep -q 'autonomous_spend_usd:0' .lumen/dashboard/decision_center_worker.js
          grep -q 'Modo enseñanza' .lumen/dashboard/teaching_mode_worker.js
          grep -q '/api/lumen-teacher-feedback' .lumen/dashboard/teaching_mode_worker.js
          grep -q '/api/lumen-self-critic-run' .lumen/dashboard/teaching_mode_worker.js
          grep -q 'x-lumen-admin' .lumen/dashboard/teaching_mode_worker.js
          grep -q 'OPPORTUNITY_ADMIN_TOKEN' .lumen/dashboard/teaching_mode_worker.js
          grep -q 'Tu aporte entra como una hipótesis provisional' .lumen/dashboard/teaching_mode_worker.js
          if grep -q 'x-lumen-admin.*teachInput' .lumen/dashboard/teaching_mode_worker.js; then
            echo 'ADMIN_TOKEN_MUST_NOT_BE_EXPOSED_TO_BROWSER'
            exit 1
          fi
          echo 'LUMEN_UNIFIED_DECISION_CENTER_TEACHING_WRAPPER_CHAIN_OK'
