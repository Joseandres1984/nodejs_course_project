name: LUMEN Instagram thematic prepare

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/runtime/zero_instagram_thematic_prepare_v2.py'
      - '.lumen/runtime/test_zero_instagram_thematic_prepare_v2.py'
      - '.lumen/runtime/instagram_content_dedupe_runtime.py'
      - '.lumen/runtime/test_instagram_content_dedupe_runtime.py'
      - '.github/workflows/lumen-instagram-thematic-prepare.yml'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Tema (travel, technology, construction, industry, import_export o texto libre)'
        required: false
        default: 'travel'
      goal:
        description: 'Objetivo comercial opcional'
        required: false
        default: ''
      notes:
        description: 'Notas opcionales'
        required: false
        default: ''
      request_id:
        description: 'ID opcional para idempotencia'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lumen-instagram-thematic
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUMEN_ZERO_COST_MODE: 'true'
      LIVE_OUTBOUND: 'false'
      LUMEN_INSTAGRAM_SEND_ENABLED: 'false'
      LUMEN_PUBLIC_BASE_URL: 'https://lumen-zero-public.lumen-b2b.workers.dev'
      LUMEN_D1_DATABASE_ID: 'e872694a-ed14-4a7f-b2c3-38b8e1bb498b'
      D1_ACCOUNT_PRIMARY: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      D1_TOKEN_PRIMARY: ${{ secrets.LUMEN_D1_API_TOKEN }}
      D1_ACCOUNT_FALLBACK: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_TOKEN_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LUMEN_INSTAGRAM_THEME: ${{ inputs.theme }}
      LUMEN_INSTAGRAM_THEME_GOAL: ${{ inputs.goal }}
      LUMEN_INSTAGRAM_THEME_NOTES: ${{ inputs.notes }}
      LUMEN_INSTAGRAM_THEME_REQUEST_ID: ${{ inputs.request_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: lumen-zero
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LUMEN runtime dependencies
        run: python -m pip install --disable-pip-version-check -r .lumen/runtime/requirements.txt

      - name: Validate Instagram title diversity and renderer tests
        working-directory: .lumen/runtime
        run: |
          python -m unittest -v \
            test_instagram_content_dedupe_runtime.py \
            test_zero_instagram_thematic_prepare_v2.py

      - name: Select D1 credentials without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          account="${D1_ACCOUNT_PRIMARY:-${D1_ACCOUNT_FALLBACK:-}}"
          token="${D1_TOKEN_PRIMARY:-${D1_TOKEN_FALLBACK:-}}"
          test -n "$account"
          test -n "$token"
          echo "LUMEN_D1_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "LUMEN_D1_API_TOKEN=$token" >> "$GITHUB_ENV"
          if [ -n "${D1_TOKEN_PRIMARY:-}" ]; then
            echo 'LUMEN_D1_CREDENTIAL_SOURCE=dedicated' >> "$GITHUB_ENV"
            echo 'LUMEN_ZERO_D1_CREDENTIALS=DEDICATED'
          else
            echo 'LUMEN_D1_CREDENTIAL_SOURCE=cloudflare_fallback' >> "$GITHUB_ENV"
            echo 'LUMEN_ZERO_D1_CREDENTIALS=CLOUDFLARE_FALLBACK'
          fi

      - name: Prepare pixel-safe non-repeating thematic Instagram post in canonical D1 state
        working-directory: .lumen/runtime
        run: |
          python - <<'PY'
          # Install the Zero watchdog adapter before importing app so this helper
          # cannot persist false Postgres failures into the canonical dashboard.
          import zero_watchdog_runtime  # noqa: F401
          import zero_instagram_thematic_prepare_v2 as thematic
          import instagram_content_dedupe_runtime as dedupe
          dedupe.patch_thematic_module(thematic)
          raise SystemExit(thematic.main())
          PY

      - name: Commit generated 4x5 Instagram asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LUMEN Zero'
          git config user.email 'lumen-zero@users.noreply.github.com'
          git add .lumen/public/instagram/
          if git diff --cached --quiet; then
            echo 'NO_NEW_ASSET'
            exit 0
          fi
          git commit -m "LUMEN: materialize pixel-safe thematic Instagram asset"
          git pull --rebase origin lumen-zero
          git push origin HEAD:lumen-zero
