name: LUMEN Instagram thematic prepare

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/runtime/zero_instagram_thematic_prepare.py'
      - '.lumen/runtime/test_zero_instagram_thematic_prepare.py'
      - '.github/workflows/lumen-instagram-thematic-prepare.yml'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Tema (travel, technology, construction, industry, import_export o texto libre)'
        required: false
        default: 'travel'
      goal:
        description: 'Objetivo comercial opcional'
        required: false
        default: ''
      notes:
        description: 'Notas opcionales'
        required: false
        default: ''
      request_id:
        description: 'ID opcional para idempotencia'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lumen-instagram-thematic
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUMEN_ZERO_COST_MODE: 'true'
      LIVE_OUTBOUND: 'false'
      LUMEN_INSTAGRAM_SEND_ENABLED: 'false'
      LUMEN_PUBLIC_BASE_URL: 'https://lumen-zero-public.lumen-b2b.workers.dev'
      LUMEN_D1_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LUMEN_D1_DATABASE_ID: 'e872694a-ed14-4a7f-b2c3-38b8e1bb498b'
      LUMEN_D1_API_TOKEN: ${{ secrets.LUMEN_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      LUMEN_INSTAGRAM_THEME: ${{ github.event.inputs.theme || 'travel' }}
      LUMEN_INSTAGRAM_THEME_GOAL: ${{ github.event.inputs.goal || 'Atraer agencias, alojamientos, operadores y proveedores turísticos a conversaciones comerciales por DM.' }}
      LUMEN_INSTAGRAM_THEME_NOTES: ${{ github.event.inputs.notes || 'Enfoque B2B: oportunidades, señales de demanda, proveedores y encaje comercial; no contenido turístico genérico.' }}
      LUMEN_INSTAGRAM_THEME_REQUEST_ID: ${{ github.event.inputs.request_id || format('run-{0}', github.run_id) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: lumen-zero
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LUMEN runtime dependencies
        run: python -m pip install --disable-pip-version-check -r .lumen/runtime/requirements.txt

      - name: Validate thematic preparation unit tests
        working-directory: .lumen/runtime
        run: python -m unittest -v test_zero_instagram_thematic_prepare.py

      - name: Verify D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LUMEN_D1_ACCOUNT_ID:-}"
          test -n "${LUMEN_D1_DATABASE_ID:-}"
          test -n "${LUMEN_D1_API_TOKEN:-}"
          echo 'LUMEN_ZERO_D1_CREDENTIALS_PRESENT'

      - name: Prepare thematic Instagram post in canonical D1 state
        working-directory: .lumen/runtime
        run: python zero_instagram_thematic_prepare.py

      - name: Commit generated 4x5 Instagram asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LUMEN Zero'
          git config user.email 'lumen-zero@users.noreply.github.com'
          git add .lumen/public/instagram/
          if git diff --cached --quiet; then
            echo 'NO_NEW_ASSET'
            exit 0
          fi
          git commit -m "LUMEN: materialize thematic Instagram asset"
          git pull --rebase origin lumen-zero
          git push origin HEAD:lumen-zero
