name: LUMEN Delegation Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-delegation-smoke.yml'
  workflow_dispatch:

jobs:
  delegation-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
      ROOM_ID: ROOM-4582354AD86443
    steps:
      - name: Verify protected token
        run: test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"

      - name: Wait for Delegation Quality Gates and Runtime v1.1
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            quality=$(curl --show-error --silent --max-time 10 "$BASE_URL/delegation/quality-stats" || true)
            result_quality=$(curl --show-error --silent --max-time 10 "$BASE_URL/delegation/result-quality-stats" || true)
            runtime=$(curl --show-error --silent --max-time 10 "$BASE_URL/delegation/runtime-stats" || true)
            echo "$quality"
            echo "$result_quality"
            echo "$runtime"
            if echo "$quality" | grep -q '1.0-delegation-quality-gate' && echo "$result_quality" | grep -q '1.0-delegation-result-quality' && echo "$runtime" | grep -q '1.1-delegation-runtime'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Confirm task quality gate is a hard dispatch barrier
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/delegation/quality-stats" > /tmp/quality.json
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/delegation/runtime-stats" > /tmp/runtime.json
          cat /tmp/quality.json
          echo
          cat /tmp/runtime.json
          echo
          jq -e '.version == "1.0-delegation-quality-gate" and .dispatchRequires == "APPROVED_FOR_DISPATCH" and .autonomousOutgoingSpend == false and .bindingActionsHumanGated == true' /tmp/quality.json >/dev/null
          jq -e '.version == "1.1-delegation-runtime" and .dispatchRequires == "APPROVED_FOR_DISPATCH" and .autonomousDelegation == false and .autonomousOutgoingSpend == false and .bindingActionsHumanGated == true' /tmp/runtime.json >/dev/null

      - name: Confirm result quality gate is a hard integration barrier
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "$BASE_URL/delegation/result-quality-stats" > /tmp/result-quality.json
          cat /tmp/result-quality.json
          echo
          jq -e '.version == "1.0-delegation-result-quality" and .integrationRequires == "RESULT_PASS" and .autonomousOutgoingSpend == false and .bindingActionsHumanGated == true' /tmp/result-quality.json >/dev/null

      - name: Confirm unsynthesized council cannot create delegation plan
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg room "$ROOM_ID" '{roomId:$room}')
          curl --fail --show-error --silent --max-time 30 \
            -X POST "$BASE_URL/delegation/plan" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d "$payload" > /tmp/plan.json
          cat /tmp/plan.json
          echo
          jq -e '.ok == true and .planned == false and (.reason == "room_not_synthesized" or .reason == "insufficient_quality_contributors")' /tmp/plan.json >/dev/null

      - name: Confirm dispatch remains disabled during pilot
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            -X POST "$BASE_URL/delegation/dispatch-next" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"force":false}' > /tmp/dispatch.json
          cat /tmp/dispatch.json
          echo
          jq -e '.ok == true and .sent == false and .reason == "autonomous_delegation_disabled" and .dispatchRequires == "APPROVED_FOR_DISPATCH"' /tmp/dispatch.json >/dev/null
