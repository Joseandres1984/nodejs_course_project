name: LUMEN Novel Tender Discovery Regression

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/tender-supplier-match.js'
      - '.lumen/a2a-worker/test-tender-discovery-rotation.mjs'
      - '.github/workflows/lumen-tender-discovery-regression.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/tender-supplier-match.js'
      - '.lumen/a2a-worker/test-tender-discovery-rotation.mjs'
      - '.github/workflows/lumen-tender-discovery-regression.yml'

permissions:
  contents: read

jobs:
  bounded-novel-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact supplier matching and rotating tender coverage
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/tender-supplier-match.js
          node .lumen/a2a-worker/test-tender-supplier-match.mjs
          node .lumen/a2a-worker/test-tender-discovery-rotation.mjs
