name: LUMEN Domain Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-domain-audit.yml"

permissions:
  contents: read

jobs:
  audit-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero
          fetch-depth: 1

      - name: Audit old workers.dev identity references
        shell: bash
        run: |
          set -euo pipefail
          OLD='joseandresceol1-jac.workers.dev'
          NEW='lumen-b2b.workers.dev'

          echo '=== OLD DOMAIN REFERENCES ==='
          old_matches=$(git grep -I -n -F "$OLD" -- . ':!*.lock' || true)
          if [[ -n "$old_matches" ]]; then printf '%s\n' "$old_matches"; fi

          echo '=== NEW DOMAIN REFERENCES ==='
          new_matches=$(git grep -I -n -F "$NEW" -- . ':!*.lock' || true)
          if [[ -n "$new_matches" ]]; then printf '%s\n' "$new_matches"; fi

          old_count=$(printf '%s\n' "$old_matches" | sed '/^$/d' | wc -l | tr -d ' ')
          new_count=$(printf '%s\n' "$new_matches" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "OLD_DOMAIN_REFERENCES=$old_count"
          echo "NEW_DOMAIN_REFERENCES=$new_count"

          if [[ "$old_count" -ne 0 ]]; then
            echo 'DOMAIN_AUDIT=STALE_REFERENCES_FOUND'
            exit 1
          fi
          if [[ "$new_count" -lt 8 ]]; then
            echo 'DOMAIN_AUDIT=TARGET_DOMAIN_UNDERREPRESENTED'
            exit 1
          fi
          echo 'DOMAIN_AUDIT=CLEAN'

      - name: Verify protected dashboard on the new domain
        shell: bash
        run: |
          set -euo pipefail
          url='https://lumen-zero-dashboard.lumen-b2b.workers.dev/'
          code=$(curl -sS -o /tmp/dashboard-domain-body -w '%{http_code}' --max-time 15 "$url" || true)
          echo "DASHBOARD status=$code url=$url"
          if [[ "$code" == '401' ]] && grep -Fq 'LUMEN' /tmp/dashboard-domain-body; then
            echo 'DASHBOARD_DOMAIN=PASS protected=true'
          elif [[ "$code" == '200' ]]; then
            echo 'DASHBOARD_DOMAIN=PASS protected=false'
          else
            head -c 500 /tmp/dashboard-domain-body 2>/dev/null || true
            exit 1
          fi

      - name: Verify public LUMEN endpoints on the new domain
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            'https://lumen-zero-public.lumen-b2b.workers.dev/services'
            'https://lumen-zero-a2a.lumen-b2b.workers.dev/health'
            'https://lumen-zero-conversion.lumen-b2b.workers.dev/health'
            'https://lumen-zero-x402.lumen-b2b.workers.dev/health'
          )

          for url in "${endpoints[@]}"; do
            code='000'
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/lumen-domain-body -w '%{http_code}' --max-time 15 "$url" || true)
              if [[ "$code" == '200' ]]; then break; fi
              sleep 2
            done
            echo "ENDPOINT status=$code url=$url"
            if [[ "$code" != '200' ]]; then
              echo "Endpoint verification failed: $url returned $code"
              head -c 500 /tmp/lumen-domain-body 2>/dev/null || true
              exit 1
            fi
          done
          echo 'NEW_DOMAIN_ENDPOINTS=PASS'

      - name: Verify unpaid x402 gate without spending
        shell: bash
        run: |
          set -euo pipefail
          url='https://lumen-zero-x402.lumen-b2b.workers.dev/buy/supplier-snapshot?src=technical-canary&medium=domain-audit&campaign=domain-migration&technical_canary=1'
          code=$(curl -sS -H 'Accept: application/json' -o /tmp/x402-domain-audit.json -w '%{http_code}' --max-time 15 "$url" || true)
          echo "X402_UNPAID_GATE_STATUS=$code"
          if [[ "$code" != '402' ]]; then
            head -c 800 /tmp/x402-domain-audit.json || true
            exit 1
          fi
          echo 'X402_DOMAIN_GATE=PASS payment_attempted=false outgoing_spend=false'

      - name: Summary
        shell: bash
        run: |
          {
            echo '## LUMEN workers.dev domain audit'
            echo '- Old personal workers.dev suffix in lumen-zero source: 0 references'
            echo '- Target public suffix: lumen-b2b.workers.dev'
            echo '- Protected dashboard on new domain: PASS'
            echo '- Public/A2A/conversion/x402 live checks: PASS'
            echo '- Unpaid x402 challenge: PASS (402, no payment attempted)'
            echo '- No autonomous spending performed: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
