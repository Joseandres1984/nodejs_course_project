name: LUMEN Market Refresh Now

on:
  workflow_dispatch:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-market-refresh-now.yml'

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh adaptive A2A market hunter
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPPORTUNITY_ADMIN_TOKEN:-}"
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 90 \
            -X POST "$base/market-hunter/run" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json'
          echo

      - name: Refresh public procurement demand sources
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 90 \
            -X POST "$base/source-intelligence/cycle" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json'
          echo

      - name: Reassess refreshed commercial market
        env:
          OPPORTUNITY_ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          curl --fail --show-error --silent --max-time 90 \
            -X POST "$base/commercial/reassess" \
            -H "x-lumen-admin: $OPPORTUNITY_ADMIN_TOKEN" \
            -H 'accept: application/json'
          echo
          echo '===== HUNTER STATE ====='
          curl --fail --show-error --silent --max-time 30 "$base/market-hunter/state"
          echo
          echo '===== SOURCE STATE ====='
          curl --fail --show-error --silent --max-time 30 "$base/source-intelligence/status"
          echo
          echo '===== COMMERCIAL STATE ====='
          curl --fail --show-error --silent --max-time 30 "$base/commercial/stats"
          echo
