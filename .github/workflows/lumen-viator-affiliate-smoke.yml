name: LUMEN Viator Affiliate Smoke

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - 'viator_affiliate_core.py'
      - 'lumen_viator_app.py'
      - 'tests/test_viator_affiliate.py'
      - 'railway-lumen.toml'
      - 'Dockerfile.lumen'
      - '.github/workflows/lumen-viator-affiliate-smoke.yml'
  push:
    branches: [lumen-zero-viator-affiliate-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lumen.txt
      - run: python -m unittest discover -s tests -p 'test_viator_affiliate.py' -v
      - run: python -c "from lumen_viator_app import app; assert any(r.path == '/api/affiliate/viator/link' for r in app.routes); print('affiliate routes ok')"
