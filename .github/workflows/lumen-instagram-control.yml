name: LUMEN Instagram Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-instagram-control.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: lumen-instagram-control-deploy
  cancel-in-progress: true

jobs:
  deploy-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      LUMEN_DASHBOARD_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
      CONTROL_URL: https://lumen-instagram-control.joseandresceol1-jac.workers.dev
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$LUMEN_DASHBOARD_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Instagram control deployment credentials configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Instagram control is prepared but waiting for an existing deployment secret."
          fi

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate control Worker syntax
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-control
        run: node --check worker.js

      - name: Deploy control Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-control
        run: npx --yes wrangler@4 deploy

      - name: Install control password
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-control
        shell: bash
        run: printf '%s' "$LUMEN_DASHBOARD_PASSWORD" | npx --yes wrangler@4 secret put LUMEN_DASHBOARD_PASSWORD

      - name: Verify authenticated health
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          for i in {1..12}; do
            code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -o /tmp/lumen-instagram-control-health.json -w '%{http_code}' "$CONTROL_URL/health" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok == true and .storage == "cloudflare-d1"' /tmp/lumen-instagram-control-health.json >/dev/null; then
              echo "INSTAGRAM_CONTROL health=ok auth=required"
              exit 0
            fi
            sleep 5
          done
          echo "INSTAGRAM_CONTROL health=failed"
          cat /tmp/lumen-instagram-control-health.json 2>/dev/null || true
          exit 1

      - name: Verify D1 command queue read write delete
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          code=$(curl -sS -u "socio:$LUMEN_DASHBOARD_PASSWORD" -X POST -o /tmp/lumen-instagram-control-canary.json -w '%{http_code}' "$CONTROL_URL/health/command-write" || true)
          cat /tmp/lumen-instagram-control-canary.json
          echo
          if [[ "$code" != "200" ]]; then
            echo "INSTAGRAM_CONTROL d1_canary=failed http=$code"
            exit 1
          fi
          jq -e '.ok == true and .d1_write == true and .d1_read == true and .d1_delete == true and .command_queue_schema == true' /tmp/lumen-instagram-control-canary.json >/dev/null
          echo "INSTAGRAM_CONTROL d1_canary=ok write=ok read=ok delete=ok"

      - name: Diagnose approved post projection
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/instagram-control
        shell: bash
        run: |
          echo "INSTAGRAM_CONTROL projection_diagnostic=start"
          npx --yes wrangler@4 d1 execute lumen-zero --remote --command "SELECT job_id, substr(fingerprint,1,16) AS fingerprint_prefix, state_status, approval_status, CASE WHEN last_error IS NULL OR last_error='' THEN NULL ELSE substr(last_error,1,120) END AS last_error FROM lumen_instagram_control_posts WHERE job_id IN ('DIST-3ADEE9154FA8','DIST-90AC7FE4D0F0','DIST-C9C06F669D70') ORDER BY job_id;"
          echo "INSTAGRAM_CONTROL projection_diagnostic=end"
