name: LUMEN Network Tower Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-network-tower-smoke.yml'
  workflow_dispatch:

jobs:
  network-tower-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-dashboard.lumen-b2b.workers.dev
      DASHBOARD_USER: socio
      DASHBOARD_PASSWORD: ${{ secrets.LUMEN_DASHBOARD_PASSWORD }}
    steps:
      - name: Verify dashboard credential exists
        run: test -n "${DASHBOARD_PASSWORD:-}"

      - name: Verify exclusive dashboard tabs and economic columns hook
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            -u "$DASHBOARD_USER:$DASHBOARD_PASSWORD" \
            "$BASE_URL/" > /tmp/dashboard.html
          test "$(grep -o 'data-tab="experiments"' /tmp/dashboard.html | wc -l)" -eq 1
          test "$(grep -o 'data-tab="controlv2"' /tmp/dashboard.html | wc -l)" -eq 1
          test "$(grep -o 'data-tab="networktower"' /tmp/dashboard.html | wc -l)" -eq 1
          ! grep -q 'data-p="experiments"' /tmp/dashboard.html
          ! grep -q 'data-p="controlv2"' /tmp/dashboard.html
          ! grep -q 'data-p="networktower"' /tmp/dashboard.html
          grep -q 'id="experiments"' /tmp/dashboard.html
          grep -q 'id="controlv2"' /tmp/dashboard.html
          grep -q 'id="networktower"' /tmp/dashboard.html
          grep -q 'Red de Agentes' /tmp/dashboard.html
          grep -q 'id="lumenEconomicPartnerColumns"' /tmp/dashboard.html
          grep -q 'Valor económico' /tmp/dashboard.html
          grep -q 'Revenue atribuible' /tmp/dashboard.html

      - name: Verify live Network Control API
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            -u "$DASHBOARD_USER:$DASHBOARD_PASSWORD" \
            "$BASE_URL/api/network-control-v1" > /tmp/network.json
          cat /tmp/network.json
          echo
          jq -e '
            .version == "1.0-network-control-tower" and
            (.modules | length) == 15 and
            .guardrails.outgoingBudgetUsd == 0 and
            .guardrails.outgoingSpendHardBlocked == true and
            .guardrails.autonomousOutgoingSpend == false and
            .guardrails.autonomousPurchase == false and
            .guardrails.autonomousContract == false and
            .guardrails.bindingActionsHumanGated == true and
            .guardrails.verifiedSettlementRequiredForIncome == true and
            (.economy.realizedIncomeUsd // 0) <= (.economy.potentialIncomeUsd // 0) and
            (.topPartners | type) == "array" and
            (.rooms | type) == "array" and
            (.gapRows | type) == "array" and
            (.partnerEconomic | type) == "object" and
            (.partnerEconomic.revenueProducingPartners // 0) >= 0 and
            (.partnerEconomic.totalPartnerAttributedRevenueUsd // 0) >= 0
          ' /tmp/network.json >/dev/null

      - name: Verify partner economic fields are complete and conservative
        run: |
          set -euo pipefail
          jq -e '
            ([.topPartners[]? | select((has("economic_score")|not) or (has("economic_confidence")|not) or (has("verified_revenue_usd")|not) or (has("verified_settlements")|not))] | length) == 0 and
            ([.topPartners[]? | select((.verified_settlements // 0) == 0 and ((.economic_confidence // 0) != 0 or (.verified_revenue_usd // 0) != 0))] | length) == 0 and
            ([.topPartners[]? | select((.verified_settlements // 0) > 0 and (.economic_score // 0) < 50)] | length) == 0
          ' /tmp/network.json >/dev/null
          detail=$(jq -r '.modules[] | select(.id == 4) | .detail' /tmp/network.json)
          echo "$detail" | grep -q 'revenue verificado'
          echo "$detail" | grep -q 'atribuible'

      - name: Verify redundancy metrics map to live engine
        run: |
          set -euo pipefail
          ready=$(jq -r '.redundancy.readyAlternates // 0' /tmp/network.json)
          weak=$(jq -r '.redundancy.weakAlternates // 0' /tmp/network.json)
          metric=$(jq -r '.modules[] | select(.id == 13) | .metric' /tmp/network.json)
          detail=$(jq -r '.modules[] | select(.id == 13) | .detail' /tmp/network.json)
          test "$metric" = "$ready fallbacks listos"
          test "$detail" = "$weak débiles"

      - name: Verify truth separation and safe economics
        run: |
          set -euo pipefail
          jq -e '
            ((.economy.realizedIncomeUsd // 0) >= 0) and
            ((.economy.potentialIncomeUsd // 0) >= (.economy.realizedIncomeUsd // 0)) and
            ((.economy.proposedExpenseUsd // 0) >= 0) and
            (.guardrails.outgoingBudgetUsd == 0) and
            ((.partnerEconomic.totalPartnerAttributedRevenueUsd // 0) >= 0)
          ' /tmp/network.json >/dev/null

      - name: Complete job
        run: echo "Network Control Tower live smoke passed with verified partner economics"
