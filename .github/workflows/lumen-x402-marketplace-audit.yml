name: LUMEN x402 Marketplace Compatibility Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumen-x402-marketplace-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-agentcash-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate marketplace discovery with no purchase or wallet
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://lumen-zero-x402.lumen-b2b.workers.dev'
          curl --fail --silent --show-error --max-time 20 "$TARGET/openapi.json" | jq -e '.openapi == "3.1.0" and (.paths | length) == 7' >/dev/null
          curl --fail --silent --show-error --max-time 20 "$TARGET/approvals/policy" | jq -e '.humanApprovalRequired == true and .defaultDeny == true' >/dev/null
          set +e
          timeout 180s npx --yes @agentcash/discovery@latest discover "$TARGET" > /tmp/agentcash-discover.out 2>&1
          discovery_code=$?
          timeout 180s npx --yes @agentcash/discovery@latest check "$TARGET/buy/supplier-snapshot" > /tmp/agentcash-check.out 2>&1
          check_code=$?
          set -e
          echo "AGENTCASH_ORIGIN_DISCOVERY_EXIT=$discovery_code"
          echo '----- origin discovery -----'
          tail -160 /tmp/agentcash-discover.out
          echo "AGENTCASH_PAID_ROUTE_CHECK_EXIT=$check_code"
          echo '----- paid route check -----'
          tail -160 /tmp/agentcash-check.out
          test "$discovery_code" -ne 124
          test "$check_code" -ne 124
          echo 'MARKETPLACE_AUDIT_NO_SIGNATURE_NO_WALLET_NO_PAYMENT'
