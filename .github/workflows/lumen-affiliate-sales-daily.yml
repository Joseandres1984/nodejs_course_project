name: LUMEN Affiliate Sales — daily safe cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '19 15 * * *'

permissions:
  contents: read

concurrency:
  group: lumen-affiliate-sales-daily
  cancel-in-progress: false

jobs:
  prepare-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lumen-zero
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify disclosure and commercial truth
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/affiliate-sales.js
          node --test .lumen/a2a-worker/test-affiliate-sales.mjs
      - name: Generate daily evidence-gated affiliate campaign proposals
        run: |
          set -euo pipefail
          node .lumen/a2a-worker/affiliate-campaign-cycle.mjs
