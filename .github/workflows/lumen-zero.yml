name: LUMEN Zero Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-zero.yml"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumen-zero-production
  cancel-in-progress: false

jobs:
  lumen-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUMEN_ZERO_COST_MODE: "true"
      LUMEN_D1_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      LUMEN_D1_DATABASE_ID: ${{ secrets.LUMEN_D1_DATABASE_ID }}
      LUMEN_D1_API_TOKEN: ${{ secrets.LUMEN_D1_API_TOKEN }}

      LUMEN_SMTP_HOST: ${{ secrets.LUMEN_SMTP_HOST }}
      LUMEN_SMTP_PORT: ${{ secrets.LUMEN_SMTP_PORT }}
      LUMEN_SMTP_USER: ${{ secrets.LUMEN_SMTP_USER }}
      LUMEN_SMTP_PASSWORD: ${{ secrets.LUMEN_SMTP_PASSWORD }}
      LUMEN_SMTP_FROM: ${{ secrets.LUMEN_SMTP_FROM }}
      LUMEN_SMTP_SSL: ${{ secrets.LUMEN_SMTP_SSL }}
      LUMEN_IMAP_HOST: ${{ secrets.LUMEN_IMAP_HOST }}
      LUMEN_IMAP_PORT: ${{ secrets.LUMEN_IMAP_PORT }}
      LUMEN_IMAP_SSL: ${{ secrets.LUMEN_IMAP_SSL }}
      LUMEN_IMAP_USER: ${{ secrets.LUMEN_IMAP_USER }}
      LUMEN_IMAP_PASSWORD: ${{ secrets.LUMEN_IMAP_PASSWORD }}
      LUMEN_LIVE_OUTBOUND: ${{ secrets.LUMEN_LIVE_OUTBOUND }}
      LUMEN_OUTBOUND_LIVE: ${{ secrets.LUMEN_LIVE_OUTBOUND }}
      LUMEN_DISCLOSE_AUTOMATION: ${{ secrets.LUMEN_DISCLOSE_AUTOMATION }}

      LUMEN_BREVO_API_KEY: ${{ secrets.LUMEN_BREVO_API_KEY }}
      LUMEN_BREVO_FROM_EMAIL: ${{ secrets.LUMEN_BREVO_FROM_EMAIL }}
      LUMEN_BREVO_FROM_NAME: ${{ secrets.LUMEN_BREVO_FROM_NAME }}
      LUMEN_RESEND_API_KEY: ${{ secrets.LUMEN_RESEND_API_KEY }}
      LUMEN_RESEND_FROM: ${{ secrets.LUMEN_RESEND_FROM }}

      # Instagram Login API. The token resolves account identity during preflight.
      LUMEN_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LUMEN_INSTAGRAM_ACCESS_TOKEN }}
      LUMEN_INSTAGRAM_APP_SECRET: ${{ secrets.LUMEN_INSTAGRAM_APP_SECRET }}
      LUMEN_INSTAGRAM_USER_ID: ${{ secrets.LUMEN_INSTAGRAM_USER_ID }}
      LUMEN_INSTAGRAM_USERNAME: ${{ secrets.LUMEN_INSTAGRAM_USERNAME }}
      LUMEN_META_GRAPH_VERSION: "v26.0"
      LUMEN_INSTAGRAM_GRAPH_VERSION: "v26.0"
      # Publishing is live, but instagram_publish_control still blocks every post without its
      # explicit immutable approval record and keeps the daily canary ceiling.
      LUMEN_SOCIAL_LIVE_OUTBOUND: "true"
      # Enables operator replies when a reply is explicitly dispatched; no automatic DM send is added.
      LUMEN_INSTAGRAM_SEND_ENABLED: "true"
      LUMEN_PUBLIC_BASE_URL: "https://lumen-zero-public.joseandresceol1-jac.workers.dev"
      LUMEN_COMMAND_CENTER_URL: "https://lumen-zero-dashboard.joseandresceol1-jac.workers.dev"

      # WhatsApp remains intentionally unconfigured until business verification is available.
      LUMEN_WHATSAPP_ACCESS_TOKEN: ${{ secrets.LUMEN_WHATSAPP_ACCESS_TOKEN }}
      LUMEN_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.LUMEN_WHATSAPP_PHONE_NUMBER_ID }}
      LUMEN_WHATSAPP_TO: ${{ secrets.LUMEN_WHATSAPP_TO }}

      # Argentine collection rails. Mercado Pago is the preferred dynamic ARS rail. The generic
      # bank-transfer fallback never stores CBU/CVU/alias data in Git or D1; those values enter
      # the process only as encrypted Actions secrets.
      LUMEN_MP_ACCESS_TOKEN: ${{ secrets.LUMEN_MP_ACCESS_TOKEN }}
      LUMEN_ARG_BANK_ARS_VERIFIED: ${{ secrets.LUMEN_ARG_BANK_ARS_VERIFIED }}
      LUMEN_ARG_BANK_ARS_DESTINATION_LABEL: ${{ secrets.LUMEN_ARG_BANK_ARS_DESTINATION_LABEL }}
      LUMEN_ARG_BANK_ARS_INSTRUCTIONS: ${{ secrets.LUMEN_ARG_BANK_ARS_INSTRUCTIONS }}
      LUMEN_ARG_BANK_ARS_AUTO_PREPARE: ${{ secrets.LUMEN_ARG_BANK_ARS_AUTO_PREPARE }}

      # Zero-cost discovery only. The shared governor preserves the hard bounded search policy.
      LUMEN_SCOUT_PROVIDER: "bing_rss_public"
      LUMEN_SCOUT_API_KEY: "zero-cost-no-secret-required"
      LUMEN_SCOUT_MARKET: "Argentina"
      LUMEN_SCOUT_GL: "ar"
      LUMEN_SCOUT_HL: "es"
      LUMEN_SCOUT_MAX_QUERIES: "2"
      LUMEN_SCOUT_DAILY_BUDGET: "24"
      LUMEN_PUBLIC_PROCUREMENT_MAX_QUERIES: "1"
      LUMEN_PUBLIC_PROCUREMENT_DAILY_CAP: "8"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check zero-cost adapters
        working-directory: .lumen/runtime
        run: python3 -m py_compile d1_persistence_runtime.py instagram_webhook_d1_bridge_runtime.py zero_public_inquiry_bridge_runtime.py zero_instagram_control_bridge_runtime.py zero_instagram_assets.py zero_watchdog_runtime.py zero_notification_runtime.py zero_scout_runtime.py payment_rails.py multicurrency_runtime.py mercadopago_checkout.py zero_entry.py

      - name: D1 preflight
        id: preflight
        shell: bash
        run: |
          if [[ -n "$LUMEN_D1_ACCOUNT_ID" && -n "$LUMEN_D1_DATABASE_ID" && -n "$LUMEN_D1_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "LUMEN Zero persistence credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LUMEN Zero is installed but waiting for the three D1 secrets; business cycle skipped safely."
          fi

      - name: Instagram connectivity preflight (no publish)
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.getenv("LUMEN_INSTAGRAM_ACCESS_TOKEN", "").strip()
          if not token:
              print("INSTAGRAM_PREFLIGHT auth=not_configured")
              raise SystemExit(0)

          version = os.getenv("LUMEN_INSTAGRAM_GRAPH_VERSION", "v26.0").strip() or "v26.0"
          params = urllib.parse.urlencode({"fields": "id,username", "access_token": token})
          url = f"https://graph.instagram.com/{version}/me?{params}"
          req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "LUMEN-B2B/1.0"})

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read(12000).decode("utf-8", errors="replace") or "{}")
              user_id = str(data.get("id") or data.get("user_id") or "").strip()
              username = str(data.get("username") or "").strip()
              if not user_id:
                  print("INSTAGRAM_PREFLIGHT auth=failed reason=identity_missing")
                  raise SystemExit(1)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                  fh.write(f"LUMEN_INSTAGRAM_USER_ID={user_id}\n")
                  if username:
                      fh.write(f"LUMEN_INSTAGRAM_USERNAME={username}\n")
              print("INSTAGRAM_PREFLIGHT auth=ok identity=resolved publish_attempted=false")
          except urllib.error.HTTPError as exc:
              print(f"INSTAGRAM_PREFLIGHT auth=failed http_status={exc.code} publish_attempted=false")
              raise SystemExit(1)
          except Exception as exc:
              print(f"INSTAGRAM_PREFLIGHT auth=failed type={type(exc).__name__} publish_attempted=false")
              raise SystemExit(1)
          PY

      - name: Mail connectivity preflight (no send)
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import imaplib
          import os
          import smtplib
          import ssl

          def truthy(name, default="false"):
              return os.getenv(name, default).strip().lower() == "true"

          smtp_host = os.getenv("LUMEN_SMTP_HOST", "").strip()
          smtp_user = os.getenv("LUMEN_SMTP_USER", "").strip()
          smtp_password = os.getenv("LUMEN_SMTP_PASSWORD", "")
          smtp_from = os.getenv("LUMEN_SMTP_FROM", "").strip()
          smtp_port_raw = os.getenv("LUMEN_SMTP_PORT", "587").strip() or "587"
          imap_host = os.getenv("LUMEN_IMAP_HOST", "").strip()
          imap_user = os.getenv("LUMEN_IMAP_USER", "").strip()
          imap_password = os.getenv("LUMEN_IMAP_PASSWORD", "")
          imap_port_raw = os.getenv("LUMEN_IMAP_PORT", "993").strip() or "993"

          print("MAIL_PREFLIGHT outbound_live=enabled" if truthy("LUMEN_LIVE_OUTBOUND") else "MAIL_PREFLIGHT outbound_live=disabled")
          print("MAIL_PREFLIGHT disclosure=enabled" if truthy("LUMEN_DISCLOSE_AUTOMATION", "true") else "MAIL_PREFLIGHT disclosure=disabled")
          smtp_ok = False
          imap_ok = False
          if all([smtp_host, smtp_user, smtp_password, smtp_from]):
              try:
                  context = ssl.create_default_context()
                  smtp_port = int(smtp_port_raw)
                  if truthy("LUMEN_SMTP_SSL"):
                      server = smtplib.SMTP_SSL(smtp_host, smtp_port, timeout=20, context=context)
                  else:
                      server = smtplib.SMTP(smtp_host, smtp_port, timeout=20)
                      server.ehlo(); server.starttls(context=context); server.ehlo()
                  server.login(smtp_user, smtp_password); server.quit()
                  smtp_ok = True
                  print("MAIL_PREFLIGHT smtp=ok")
              except Exception as exc:
                  print(f"MAIL_PREFLIGHT smtp=failed type={type(exc).__name__}")
          else:
              print("MAIL_PREFLIGHT smtp=not_configured")
          if all([imap_host, imap_user, imap_password]):
              try:
                  imap_port = int(imap_port_raw)
                  client = imaplib.IMAP4_SSL(imap_host, imap_port, timeout=20) if truthy("LUMEN_IMAP_SSL", "true") else imaplib.IMAP4(imap_host, imap_port, timeout=20)
                  client.login(imap_user, imap_password); client.logout()
                  imap_ok = True
                  print("MAIL_PREFLIGHT imap=ok")
              except Exception as exc:
                  print(f"MAIL_PREFLIGHT imap=failed type={type(exc).__name__}")
          else:
              print("MAIL_PREFLIGHT imap=not_configured")
          if not (smtp_ok and imap_ok):
              raise SystemExit(1)
          PY

      - name: Install runtime dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r .lumen/runtime/requirements.txt

      - name: Materialize Instagram media for approved pipeline
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/runtime
        run: python zero_instagram_assets.py

      - name: Publish generated Instagram media to zero-cost public branch
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "LUMEN Automation"
          git config user.email "93448743+Joseandres1984@users.noreply.github.com"
          git add .lumen/public/instagram || true
          if git diff --cached --quiet; then
            echo "INSTAGRAM_MEDIA changed=false"
          else
            git commit -m "Refresh LUMEN Instagram media"
            git push origin HEAD:lumen-zero
            echo "INSTAGRAM_MEDIA changed=true"
          fi

      - name: Run LUMEN Zero cycle
        if: steps.preflight.outputs.ready == 'true'
        working-directory: .lumen/runtime
        run: python zero_entry.py
