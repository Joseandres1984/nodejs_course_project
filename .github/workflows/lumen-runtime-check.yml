name: LUMEN runtime check

on:
  push:
    branches: [lumen-deploy]
    paths:
      - '.lumen/runtime/**'
      - '.github/workflows/lumen-runtime-check.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m compileall .lumen/runtime
