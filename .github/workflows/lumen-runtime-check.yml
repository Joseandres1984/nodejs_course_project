name: LUMEN runtime check

on:
  push:
    branches: [lumen-deploy, lumen-zero]
    paths:
      - '.lumen/runtime/**'
      - '.lumen/dashboard/**'
      - '.lumen/public-worker/**'
      - '.lumen/a2a-worker/**'
      - '.lumen/cognitive-worker/**'
      - '.lumen/cognitive-shadow-worker/**'
      - '.github/workflows/lumen-runtime-check.yml'
  pull_request:
    branches: [lumen-deploy, lumen-zero]
    paths:
      - '.lumen/runtime/**'
      - '.lumen/dashboard/**'
      - '.lumen/public-worker/**'
      - '.lumen/a2a-worker/**'
      - '.lumen/cognitive-worker/**'
      - '.lumen/cognitive-shadow-worker/**'
      - '.github/workflows/lumen-runtime-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile runtime
        run: python -m compileall .lumen/runtime
      - name: Verify Autonomous Director and Experiment Engine activation
        working-directory: .lumen/runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('worker_entry.py').read_text(encoding='utf-8')
          adaptive = source.index('import adaptive_operator_runtime')
          director = source.index('import autonomous_director_runtime')
          cognitive = source.index('import cognitive_director_learning_runtime')
          experiment = source.index('import experiment_engine_runtime')
          truth = source.index('import commercial_truth_repair_runtime')
          assert adaptive < director < cognitive < experiment < truth, 'Director/Cognitive/Experiment import order is not deterministic'
          import adaptive_operator_runtime
          import autonomous_director_runtime
          import cognitive_director_learning_runtime
          import experiment_engine_runtime
          assert adaptive_operator_runtime.adaptive_operator_tick.__module__ == 'autonomous_director_runtime'
          assert autonomous_director_runtime.director_tick.__module__ == 'experiment_engine_runtime'
          print('AUTONOMOUS_DIRECTOR_EXPERIMENT_ACTIVATION ok')
          PY
      - name: Validate Cloudflare workers syntax
        run: |
          node --check .lumen/dashboard/worker.js
          node --check .lumen/dashboard/full_worker.js
          node --check .lumen/dashboard/recovery_worker.js
          node --check .lumen/dashboard/refresh_worker.js
          node --check .lumen/dashboard/pricing_worker.js
          node --check .lumen/dashboard/stable_worker.js
          node --check .lumen/public-worker/worker.js
          node --check .lumen/public-worker/gateway.js
          node --check .lumen/public-worker/revenue-storefront.js
          node --check .lumen/a2a-worker/worker.js
          node --check .lumen/a2a-worker/worker-entry.js
          node --check .lumen/a2a-worker/revenue-expansion.js
          node --check .lumen/a2a-worker/discovery.js
          node --check .lumen/cognitive-worker/worker.js
          node --check .lumen/cognitive-shadow-worker/worker.js
      - name: Verify global A2A and LLM discoverability surfaces
        run: node .lumen/a2a-worker/test-discovery.mjs
      - name: Verify public Revenue storefront wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          gateway = Path('.lumen/public-worker/gateway.js').read_text(encoding='utf-8')
          storefront = Path('.lumen/public-worker/revenue-storefront.js').read_text(encoding='utf-8')
          wrangler = Path('.lumen/public-worker/wrangler.toml').read_text(encoding='utf-8')
          assert 'handleRevenueStorefront' in gateway
          assert '"/catalogo"' in storefront
          assert '"/catalogo/request"' in storefront
          assert '/revenue/catalog' in storefront
          assert '/revenue/request' in storefront
          assert 'binding = "A2A"' in wrangler
          assert 'service = "lumen-zero-a2a"' in wrangler
          assert 'No se genera ningún cargo' in storefront
          print('PUBLIC_REVENUE_STOREFRONT_WIRING ok')
          PY
      - name: Verify commercial catalog stays synchronized
        run: python -m unittest discover -s .lumen/runtime -p 'test_service_catalog_sync.py'
      - name: Verify A2A Machine Store and seller autonomy
        run: python -m unittest discover -s .lumen/runtime -p 'test_a2a_machine_store.py'
      - name: Verify global A2A sales conversion loop
        run: python -m unittest discover -s .lumen/runtime -p 'test_a2a_global_sales_runtime.py'
      - name: Verify every sold service has a live runtime path
        run: python -m unittest discover -s .lumen/runtime -p 'test_commercial_runtime_coverage.py'
      - name: Run LUMEN Zero adapter unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_lumen_zero_runtime.py'
      - name: Run market intelligence unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_market_intelligence_scout.py'
      - name: Run Revenue OS v3 unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_revenue_os_v3_runtime.py'
      - name: Run Revenue Capture v3 unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_revenue_capture_v3_runtime.py'
      - name: Run Revenue OS v3.1 alignment unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_revenue_os_v31_alignment_runtime.py'
      - name: Run Autonomous Director unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_autonomous_director_runtime.py'
      - name: Run Experiment Engine unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_experiment_engine_runtime.py'
      - name: Run Demand Recovery autonomy unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_demand_recovery_runtime.py'
      - name: Run Revenue Expansion unit tests
        run: python -m unittest discover -s .lumen/runtime -p 'test_revenue_expansion_runtime.py'
