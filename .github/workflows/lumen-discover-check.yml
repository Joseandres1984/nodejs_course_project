name: LUMEN Discover check

on:
  pull_request:
    paths:
      - '.lumen/public-worker/discover.js'
      - '.lumen/public-worker/test-discover.mjs'
      - '.lumen/public-worker/indexnow-submit.mjs'
      - '.lumen/public-worker/worker.js'
      - '.github/workflows/lumen-discover-check.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/public-worker/discover.js'
      - '.lumen/public-worker/test-discover.mjs'
      - '.lumen/public-worker/indexnow-submit.mjs'
      - '.lumen/public-worker/worker.js'
      - '.github/workflows/lumen-discover-check.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Discover
        working-directory: .lumen/public-worker
        run: |
          node --check discover.js
          node --check indexnow-submit.mjs
          node --check worker.js
          node test-discover.mjs
          INDEXNOW_DRY_RUN=true node indexnow-submit.mjs
