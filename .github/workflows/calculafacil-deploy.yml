name: CalculaFacil - Validate and deploy (Cloudflare free static assets)

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - 'calculafacil/**'
      - '.github/workflows/calculafacil-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - 'calculafacil/**'
      - '.github/workflows/calculafacil-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculafacil-static-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Calculator correctness and static security checks
        run: |
          set -euo pipefail
          node --check calculafacil/calculators.mjs
          node --check calculafacil/app.js
          node --test calculafacil/test-calculators.mjs
          grep -q 'id="herramientas"' calculafacil/index.html
          grep -q 'lang="es-AR"' calculafacil/index.html
          ! grep -Ei 'google-analytics|gtag\(|facebook\.com/tr|pixel\(' calculafacil/index.html calculafacil/app.js calculafacil/styles.css calculafacil/pro.html
          grep -Fq 'Comprar CalculaFácil PRO' calculafacil/pro.html
          grep -Fq 'Cómo calcular un precio de venta' calculafacil/calcular-precio-venta-emprendimiento.html
          grep -Fq 'Punto de equilibrio' calculafacil/punto-de-equilibrio-emprendimiento.html
          grep -Fq 'href="/calcular-precio-venta-emprendimiento.html' calculafacil/index.html
          grep -Fq 'href="/punto-de-equilibrio-emprendimiento.html' calculafacil/index.html
          grep -Fq '/punto-de-equilibrio-emprendimiento.html' calculafacil/sitemap.xml
          grep -Fq 'Ya pagué: verificar y descargar' calculafacil/pro.html
          grep -q 'href="/pro.html"' calculafacil/index.html
          node - <<'NODE'
          const fs=require("node:fs");
          const x=require("./calculafacil/payment-config.json");
          const html=fs.readFileSync("calculafacil/pro.html","utf8");
          const wrangler=fs.readFileSync("calculafacil/fulfillment/wrangler.toml","utf8");
          const pref="59348768-483e73d1-8b3f-450c-a610-b7ce39d70da9";
          const checkout="https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id="+pref;
          const claim="https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev/claim";
          if(x.checkout_enabled!==true || x.delivery.automated!==true || x.fulfillment_deployed!==true ||
             x.expected_amount!==9900 || x.currency!=="ARS" ||
             x.preference_id!==pref || x.payment_url!==checkout ||
             x.delivery.redemption_url!==claim ||
             !html.includes('href="'+checkout+'"') || !html.includes('href="'+claim+'"') ||
             !wrangler.includes('FULFILLMENT_ENABLED = "true"') ||
             !wrangler.includes('EXPECTED_PREFERENCE_ID = "'+pref+'"')) process.exit(1);
          console.log("PAID_CHECKOUT_CONFIG_MATCHES_VERIFIED_MP_PREFERENCE_AND_PRIVATE_DELIVERY");
          NODE

  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only public static files
        run: |
          set -euo pipefail
          mkdir -p calculafacil/dist
          cp calculafacil/index.html calculafacil/styles.css calculafacil/app.js calculafacil/calculators.mjs calculafacil/favicon.svg calculafacil/pro.html calculafacil/robots.txt calculafacil/sitemap.xml calculafacil/_headers calculafacil/calcular-precio-venta-emprendimiento.html calculafacil/punto-de-equilibrio-emprendimiento.html calculafacil/1dbf6671f85eb74a413f76fd2681d570.txt calculafacil/dist/
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 calculafacil/marketing/make_instagram.py calculafacil/dist/instagram-pro-launch.jpg
          test "$(find calculafacil/dist -maxdepth 1 -type f | wc -l)" -eq 13
          file calculafacil/dist/instagram-pro-launch.jpg | grep -Fq 'JPEG image data'
          grep -Fq 'https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id=59348768-483e73d1-8b3f-450c-a610-b7ce39d70da9' calculafacil/pro.html
          grep -Fq 'https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev/claim' calculafacil/pro.html
      - name: Verify Cloudflare access (no financial authority)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Gate public checkout on healthy private fulfillment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev'
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/fulfillment-preflight.json -w '%{http_code}' --max-time 12 "$BASE/health?site=$GITHUB_SHA&attempt=$attempt" || true)
            if [ "$code" = 200 ] && jq -e '
              .ok==true and .ready==true and .enabled==true and
              .privateWorkbookPresent==true and .storagePrivate==true
            ' /tmp/fulfillment-preflight.json >/dev/null 2>&1; then
              echo "BUYER_PAYMENT_DELIVERY_READY_BEFORE_STATIC_CHECKOUT_RELEASE"
              exit 0
            fi
            sleep 3
          done
          echo "BUYER_DELIVERY_NOT_READY_REFUSING_PUBLIC_CHECKOUT"
          exit 1
      - name: Deploy isolated static Worker
        working-directory: calculafacil
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify public site and assets
        run: |
          set -euo pipefail
          BASE='https://calculafacil.lumen-b2b.workers.dev'
          for attempt in $(seq 1 12); do
            echo "===== CALCULAFACIL LIVE SMOKE ATTEMPT $attempt ====="
            ok=1
            for endpoint in index.html calculators.mjs styles.css pro.html robots.txt sitemap.xml instagram-pro-launch.jpg calcular-precio-venta-emprendimiento.html punto-de-equilibrio-emprendimiento.html 1dbf6671f85eb74a413f76fd2681d570.txt; do
              file="/tmp/calculafacil-${endpoint//\//-}"
              status=$(curl --location --max-redirs 3 --proto-redir '=https' -sS --max-time 20 -H 'cache-control: no-cache' -o "$file" -w '%{http_code}' "$BASE/$endpoint?release=$GITHUB_SHA&attempt=$attempt" || true)
              echo "SMOKE_PATH=/$endpoint HTTP=${status:-ERR} BYTES=$(wc -c < "$file" 2>/dev/null || echo 0)"
              if [ "$status" != "200" ]; then
                ok=0
                if [ -s "$file" ]; then head -c 200 "$file"; echo; fi
              fi
            done
            if [ "$ok" = 1 ]; then
              if grep -Fxq '1dbf6671f85eb74a413f76fd2681d570' /tmp/calculafacil-1dbf6671f85eb74a413f76fd2681d570.txt && \
                 test "$(wc -c < /tmp/calculafacil-instagram-pro-launch.jpg)" -ge 40000 && \
                 grep -q 'Los números' /tmp/calculafacil-index.html && \
                 grep -Fq 'Cómo calcular un precio de venta' /tmp/calculafacil-calcular-precio-venta-emprendimiento.html && \
                 grep -Fq 'Unidades mínimas para cubrir esos costos' /tmp/calculafacil-punto-de-equilibrio-emprendimiento.html && \
                 grep -Fq 'Kit Excel PRO' /tmp/calculafacil-calcular-precio-venta-emprendimiento.html && \
                 grep -q 'export function margin' /tmp/calculafacil-calculators.mjs && \
                 grep -q 'tool-card' /tmp/calculafacil-styles.css && \
                 grep -Fq 'Comprar CalculaFácil PRO' /tmp/calculafacil-pro.html && \
                 grep -Fq 'https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id=59348768-483e73d1-8b3f-450c-a610-b7ce39d70da9' /tmp/calculafacil-pro.html && \
                 grep -Fq 'Ya pagué: verificar y descargar' /tmp/calculafacil-pro.html && \
                 grep -q 'sitemap.xml' /tmp/calculafacil-robots.txt && \
                 grep -q '/pro.html' /tmp/calculafacil-sitemap.xml && \
                 grep -q '/calcular-precio-venta-emprendimiento.html' /tmp/calculafacil-sitemap.xml && \
                 grep -q '/punto-de-equilibrio-emprendimiento.html' /tmp/calculafacil-sitemap.xml; then
                echo 'CALCULAFACIL_LIVE_SITE_AND_ASSETS_VERIFIED'
                exit 0
              fi
              echo "SMOKE_CONTENT_MISMATCH"
              for file in index.html calculators.mjs styles.css pro.html robots.txt sitemap.xml; do
                echo "$file: $(head -c 100 "/tmp/calculafacil-$file" | tr '\n' ' ')"
              done
            fi
            sleep 3
          done
          echo 'STATIC_DEPLOYMENT_NOT_CONFIRMED'
          exit 1
