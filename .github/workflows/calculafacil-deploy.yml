name: CalculaFacil - Validate and deploy (Cloudflare free static assets)

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - 'calculafacil/**'
      - '.github/workflows/calculafacil-deploy.yml'
  push:
    branches: [lumen-zero]
    paths:
      - 'calculafacil/**'
      - '.github/workflows/calculafacil-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculafacil-static-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Calculator correctness and static security checks
        run: |
          set -euo pipefail
          node --check calculafacil/calculators.mjs
          node --check calculafacil/app.js
          node --test calculafacil/test-calculators.mjs
          grep -q 'id="herramientas"' calculafacil/index.html
          grep -q 'lang="es-AR"' calculafacil/index.html
          ! grep -Ei 'google-analytics|gtag\(|facebook\.com/tr|pixel\(' calculafacil/index.html calculafacil/app.js calculafacil/styles.css calculafacil/pro.html
          grep -q 'El enlace de Mercado Pago ya está preparado' calculafacil/pro.html
          grep -q 'href="/pro.html"' calculafacil/index.html
          node -e 'const x=require("./calculafacil/payment-config.json"); if(x.checkout_enabled!==false||x.delivery.automated!==false||x.expected_amount!==9900||x.currency!=="ARS"||x.payment_url!=="https://mpago.li/1NuWTrY") process.exit(1); console.log("PAYMENT_LINK_RECORDED_CHECKOUT_STILL_DISABLED")'

  payment_link_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Inspect merchant-provided payment link (GET only, no charge)
        shell: bash
        run: |
          set -euo pipefail
          result=$(curl -L --max-redirs 4 --proto-redir '=https' -sS --max-time 20 -o /tmp/mercadopago-link.html -w '%{http_code} %{url_effective}' 'https://mpago.li/1NuWTrY' || true)
          python3 - "$result" <<'PY'
          import sys
          from urllib.parse import urlparse
          parts=sys.argv[1].split(' ',1)
          status=parts[0] if parts else '?'
          host=urlparse(parts[1]).hostname if len(parts)>1 else None
          print('PUBLIC_CHECKOUT_LINK_GET_ONLY', {'status':status,'redirect_host':host,'payment_attempted':False})
          if status not in {'200','302','303'} or not host or not (host.endswith('mercadopago.com.ar') or host=='mpago.li' or host.endswith('mercadopago.com')):
              print('LINK_NOT_PROVIDER_VERIFIED_BY_CI')
              raise SystemExit(1)
          PY

  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only public static files
        run: |
          set -euo pipefail
          mkdir -p calculafacil/dist
          cp calculafacil/index.html calculafacil/styles.css calculafacil/app.js calculafacil/calculators.mjs calculafacil/favicon.svg calculafacil/pro.html calculafacil/robots.txt calculafacil/sitemap.xml calculafacil/_headers calculafacil/dist/
          test "$(find calculafacil/dist -maxdepth 1 -type f | wc -l)" -eq 9
          ! grep -qi "mercadopago.com.ar/checkout/" calculafacil/pro.html
      - name: Verify Cloudflare access (no financial authority)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Deploy isolated static Worker
        working-directory: calculafacil
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify public site and assets
        run: |
          set -euo pipefail
          BASE='https://calculafacil.lumen-b2b.workers.dev'
          for attempt in $(seq 1 12); do
            echo "===== CALCULAFACIL LIVE SMOKE ATTEMPT $attempt ====="
            ok=1
            for endpoint in index.html calculators.mjs styles.css pro.html robots.txt sitemap.xml; do
              file="/tmp/calculafacil-${endpoint//\//-}"
              status=$(curl --location --max-redirs 3 --proto-redir '=https' -sS --max-time 20 -H 'cache-control: no-cache' -o "$file" -w '%{http_code}' "$BASE/$endpoint?release=$GITHUB_SHA&attempt=$attempt" || true)
              echo "SMOKE_PATH=/$endpoint HTTP=${status:-ERR} BYTES=$(wc -c < "$file" 2>/dev/null || echo 0)"
              if [ "$status" != "200" ]; then
                ok=0
                if [ -s "$file" ]; then head -c 200 "$file"; echo; fi
              fi
            done
            if [ "$ok" = 1 ]; then
              if grep -q 'Los números' /tmp/calculafacil-index.html && \
                 grep -q 'export function margin' /tmp/calculafacil-calculators.mjs && \
                 grep -q 'tool-card' /tmp/calculafacil-styles.css && \
                 grep -q 'El enlace de Mercado Pago ya está preparado' /tmp/calculafacil-pro.html && \
                 grep -q 'sitemap.xml' /tmp/calculafacil-robots.txt && \
                 grep -q '/pro.html' /tmp/calculafacil-sitemap.xml; then
                echo 'CALCULAFACIL_LIVE_SITE_AND_ASSETS_VERIFIED'
                exit 0
              fi
              echo "SMOKE_CONTENT_MISMATCH"
              for file in index.html calculators.mjs styles.css pro.html robots.txt sitemap.xml; do
                echo "$file: $(head -c 100 "/tmp/calculafacil-$file" | tr '\n' ' ')"
              done
            fi
            sleep 3
          done
          echo 'STATIC_DEPLOYMENT_NOT_CONFIRMED'
          exit 1
