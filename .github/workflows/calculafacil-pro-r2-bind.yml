name: CalculaFácil PRO — R2 private binding (delivery disabled)

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - "calculafacil/fulfillment/**"
      - ".github/workflows/calculafacil-pro-r2-bind.yml"
  push:
    branches: [lumen-zero]
    paths:
      - "calculafacil/fulfillment/**"
      - ".github/workflows/calculafacil-pro-r2-bind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculafacil-pro-private-r2-binding
  cancel-in-progress: false

jobs:
  safety-and-binding-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          node --check calculafacil/fulfillment/worker.mjs
          node --test calculafacil/fulfillment/worker.test.mjs
          grep -Fq 'FULFILLMENT_ENABLED = "false"' calculafacil/fulfillment/wrangler.toml
          grep -Fq 'bucket_name = "calculafacil-pro-private"' calculafacil/fulfillment/wrangler.toml
          grep -Fq 'FILE_KEY = "calculafacil-pro/CalculaFacil_PRO_Kit_v1.xlsx"' calculafacil/fulfillment/worker.mjs

  deploy-binding-only:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: safety-and-binding-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Deploy separate private delivery Worker (OFF by default)
        working-directory: calculafacil/fulfillment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify R2 object visibility without leaking workbook
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev'
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/cf-pro-private-health.json -w '%{http_code}' --max-time 12 "$BASE/health?verify=$GITHUB_SHA&attempt=$i" || true)
            if [[ "$code" == "200" ]] && jq -e '
              .ok==true and
              .service=="calculafacil-pro-fulfillment" and
              .privateWorkbookPresent==true and
              .ready==false and
              .enabled==false and
              .paymentsMadeByServer==false and
              .storagePrivate==true
            ' /tmp/cf-pro-private-health.json >/dev/null 2>&1; then
              echo "CF_PRO_R2_PRIVATE_OBJECT_PRESENT_DELIVERY_DISABLED_VERIFIED"
              exit 0
            fi
            echo "TRY=$i STATUS=$code SAFE_HEALTH=$(jq -c '{privateWorkbookPresent,ready,enabled}' /tmp/cf-pro-private-health.json 2>/dev/null || echo unavailable)"
            sleep 3
          done
          echo "PRIVATE_R2_BINDING_NOT_VERIFIED"
          exit 1

      - name: Authenticate Mercado Pago read-only via ephemeral private Worker probe
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets,sys,time,urllib.request,urllib.error
          token=os.getenv("CLOUDFLARE_API_TOKEN") or ""
          account=os.getenv("CLOUDFLARE_ACCOUNT_ID") or ""
          if not token or not account:
              sys.exit("CLOUDFLARE_CREDENTIALS_MISSING")
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/calculafacil-pro-fulfillment/secrets"
          name="PROVIDER_AUDIT_SECRET"
          # One-time, random access token never printed, committed, or persisted in Actions.
          ephemeral=secrets.token_hex(40)
          def cf(method,url,payload=None):
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if payload is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload is not None else None,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as exc:
                  return exc.code,{}
          put_status,put_data=cf("PUT",base,{"name":name,"text":ephemeral,"type":"secret_text"})
          if put_status not in (200,201) or not put_data.get("success"):
              sys.exit("EPHEMERAL_DIAGNOSTIC_KEY_INSTALL_FAILED_HTTP_"+str(put_status))
          error=None
          try:
              for n in range(16):
                  req=urllib.request.Request("https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev/__internal/provider-auth-check",
                    data=b"",method="POST",
                    headers={"X-LUMEN-AUDIT-KEY":ephemeral,"Content-Type":"application/octet-stream"})
                  try:
                      with urllib.request.urlopen(req,timeout=13) as response:
                          payload=json.load(response)
                          if response.status==200 and payload.get("ok") and payload.get("authenticated") and payload.get("siteIsArgentina") and not payload.get("testUser") and payload.get("deliveryEnabled") is False:
                              print("MERCADOPAGO_PRODUCTION_CREDENTIAL_AUTHENTICATED_READ_ONLY")
                              error=None
                              break
                          error="PROVIDER_IDENTITY_NOT_CONFIRMED"
                  except urllib.error.HTTPError as exc:
                      if exc.code==404:
                          error="PROBE_ROUTE_NOT_READY"
                      elif exc.code==503:
                          error="PROVIDER_AUTHENTICATION_NOT_CONFIRMED"
                          break
                      else:
                          error="PROVIDER_DIAGNOSTIC_HTTP_"+str(exc.code)
                  except Exception:
                      error="PROVIDER_DIAGNOSTIC_NETWORK_UNAVAILABLE"
                  time.sleep(2)
              if error:
                  print(error)
          finally:
              delete_status,_=cf("DELETE",base+"/"+name)
              if delete_status not in (200,204):
                  sys.exit("DIAGNOSTIC_SECRET_CLEANUP_NOT_CONFIRMED_HTTP_"+str(delete_status))
              print("TEMPORARY_PROBE_SECRET_REMOVED")
          if error:
              sys.exit(1)
          PY
