name: CalculaFácil PRO — verified production fulfillment health

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - "calculafacil/fulfillment/**"
      - ".github/workflows/calculafacil-pro-r2-bind.yml"
  push:
    branches: [lumen-zero]
    paths:
      - "calculafacil/fulfillment/**"
      - ".github/workflows/calculafacil-pro-r2-bind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculafacil-pro-private-r2-binding
  cancel-in-progress: false

jobs:
  safety-and-binding-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify payment authentication, signed downloads and expected preference
        shell: bash
        run: |
          set -euo pipefail
          node --check calculafacil/fulfillment/worker.mjs
          node --test calculafacil/fulfillment/worker.test.mjs
          grep -Fq 'FULFILLMENT_ENABLED = "true"' calculafacil/fulfillment/wrangler.toml
          grep -Fq 'EXPECTED_PREFERENCE_ID = "59348768-483e73d1-8b3f-450c-a610-b7ce39d70da9"' calculafacil/fulfillment/wrangler.toml
          grep -Fq 'bucket_name = "calculafacil-pro-private"' calculafacil/fulfillment/wrangler.toml
          grep -Fq '"checkout_enabled": true' calculafacil/payment-config.json

  deploy-verified-private-delivery:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: safety-and-binding-check
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Deploy verified private delivery Worker with exact preference match
        working-directory: calculafacil/fulfillment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify live health and deny invalid download before publishing checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://calculafacil-pro-fulfillment.lumen-b2b.workers.dev'
          for i in $(seq 1 15); do
            code=$(curl -sS -o /tmp/cf-pro-live-health.json -w '%{http_code}' --max-time 12 "$BASE/health?sha=$GITHUB_SHA&attempt=$i" || true)
            if [[ "$code" == "200" ]] && jq -e '
              .ok==true and .service=="calculafacil-pro-fulfillment" and
              .privateWorkbookPresent==true and .ready==true and .enabled==true and
              .paymentsMadeByServer==false and .storagePrivate==true
            ' /tmp/cf-pro-live-health.json >/dev/null 2>&1; then
              echo "VERIFIED_PRIVATE_DELIVERY_WORKER_READY"
              break
            fi
            if [[ "$i" == "15" ]]; then
              echo "PRIVATE_DELIVERY_NOT_READY"
              exit 1
            fi
            sleep 2
          done
          code=$(curl -sS -o /tmp/cf-pro-invalid.json -w '%{http_code}' --max-time 12 \
            "$BASE/download?payment_id=987654321000&until=9999999999999&sig=not-a-signature" || true)
          test "$code" = "403"
          jq -e '.error=="invalid_or_expired_download_link"' /tmp/cf-pro-invalid.json >/dev/null
          echo "UNAUTHENTICATED_DOWNLOAD_DENIED"
          code=$(curl -sS -o /tmp/cf-pro-claim.html -w '%{http_code}' --max-time 12 \
            "$BASE/claim?resultado=aprobado&payment_id=183642547454" || true)
          test "$code" = "200"
          grep -Fq 'Verificar pago y descargar Excel' /tmp/cf-pro-claim.html
          grep -Fq 'value="183642547454"' /tmp/cf-pro-claim.html
          echo "BUYER_CLAIM_READY_WITH_UNTRUSTED_RETURN_PREFILL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 -X POST \
            "$BASE/__internal/transport-test-download" || true)
          test "$code" = "404"
          echo "PRIVATE_FILE_DIAGNOSTIC_REMAINS_ACCESS_CONTROLLED"
          echo "WEBSITE_PURCHASE_BUTTON_NOT_YET_PUBLISHED"
