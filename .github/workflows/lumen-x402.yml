name: LUMEN x402 Checkout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-x402.yml"

permissions:
  contents: read

concurrency:
  group: lumen-x402-deploy
  cancel-in-progress: true

jobs:
  deploy-x402:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      X402_BASE_URL: "https://lumen-zero-x402.lumen-b2b.workers.dev"
      X402_PUBLIC_URL: "https://lumen-zero-public.lumen-b2b.workers.dev"
      X402_EXPECTED_RECIPIENT: "0x04285DE6A083CEb28fb0C254a2ed0F5fdB2eeD28"
      X402_FACILITATOR: "https://facilitator.xpay.sh"
      X402_EXPECTED_VERSION: "1.4-x402-human-paywall"
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Verify facilitator supports Base mainnet x402 v2
        shell: bash
        run: |
          curl -fsS "$X402_FACILITATOR/health" -o /tmp/facilitator-health.json
          curl -fsS "$X402_FACILITATOR/supported" -o /tmp/facilitator-supported.json
          python3 - <<'PY'
          import json
          supported=json.load(open('/tmp/facilitator-supported.json'))
          kinds=supported.get('kinds') or []
          assert any(k.get('x402Version') == 2 and k.get('scheme') == 'exact' and k.get('network') == 'eip155:8453' for k in kinds), supported
          print({'facilitator':'ok','base_mainnet':True,'network':'eip155:8453','x402Version':2,'scheme':'exact'})
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .lumen/x402-worker/package.json

      - name: Install x402 dependencies
        working-directory: .lumen/x402-worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker syntax
        working-directory: .lumen/x402-worker
        run: |
          node --check worker-v2.js
          node --check worker.js

      - name: Deploy x402 Worker
        working-directory: .lumen/x402-worker
        run: npx wrangler deploy

      - name: Wait for v1.4 edge propagation and verify public truth
        shell: bash
        run: |
          ready=0
          for i in {1..18}; do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}-$(date +%s)"
            health=$(curl -sS -o /tmp/x402-health.json -w '%{http_code}' "$X402_BASE_URL/health?deploy=$nonce" || true)
            catalog=$(curl -sS -o /tmp/x402-catalog.json -w '%{http_code}' "$X402_BASE_URL/catalog?deploy=$nonce" || true)
            stats=$(curl -sS -o /tmp/x402-stats.json -w '%{http_code}' "$X402_BASE_URL/stats?deploy=$nonce" || true)
            echo "attempt=$i health=$health catalog=$catalog stats=$stats"
            if [[ "$health" == "200" && "$catalog" == "200" && "$stats" == "200" ]]; then
              hv=$(jq -r '.version // ""' /tmp/x402-health.json 2>/dev/null || true)
              cv=$(jq -r '.version // ""' /tmp/x402-catalog.json 2>/dev/null || true)
              hp=$(jq -r '.humanPaywall // false' /tmp/x402-health.json 2>/dev/null || true)
              if [[ "$hv" == "$X402_EXPECTED_VERSION" && "$cv" == "$X402_EXPECTED_VERSION" && "$hp" == "true" ]]; then
                ready=1
                break
              fi
            fi
            sleep 4
          done
          [[ "$ready" == "1" ]]
          python3 - <<'PY'
          import json, os
          health=json.load(open('/tmp/x402-health.json'))
          catalog=json.load(open('/tmp/x402-catalog.json'))
          stats=json.load(open('/tmp/x402-stats.json'))
          recipient=os.environ['X402_EXPECTED_RECIPIENT']
          facilitator=os.environ['X402_FACILITATOR']
          version=os.environ['X402_EXPECTED_VERSION']
          assert health.get('ok') is True and health.get('version') == version, health
          assert health.get('x402') == 'LIVE' and health.get('resourceServerInitialized') is True, health
          assert health.get('humanPaywall') is True, health
          assert health.get('network') == 'eip155:8453' and health.get('asset') == 'USDC', health
          assert health.get('facilitator') == facilitator and health.get('outgoingSpendEnabled') is False, health
          assert health.get('conversionAttribution') is True, health
          assert catalog.get('version') == version, catalog
          settlement=catalog.get('settlement') or {}
          assert settlement.get('recipient') == recipient, settlement
          assert settlement.get('networkId') == 'eip155:8453' and settlement.get('asset') == 'USDC', settlement
          assert settlement.get('facilitator') == facilitator and settlement.get('outgoingSpendEnabled') is False, settlement
          assert len(catalog.get('products') or []) == 6, catalog
          assert stats.get('recipient') == recipient and stats.get('network') == 'Base' and stats.get('asset') == 'USDC', stats
          assert float(stats.get('realizedRevenueUsd') or 0) >= 0, stats
          print({'public_checkout':'v1.4-ready','products':6,'humanPaywall':True,'realizedRevenueUsd':stats.get('realizedRevenueUsd')})
          PY

      - name: Verify programmatic x402 challenge without spending
        shell: bash
        run: |
          success=0
          for i in {1..12}; do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-challenge-${i}-$(date +%s)"
            url="$X402_BASE_URL/buy/supplier-snapshot?conversion_event=CE-DEPLOY-CANARY&conversion_session=SID-DEPLOY-CANARY&campaign=deploy-canary&source=technical-canary&medium=deploy&creative=deploy-canary&deploy=$nonce"
            code=$(curl -sS -D /tmp/x402-headers.txt -o /tmp/x402-body.txt -w '%{http_code}' -H 'Accept: application/json' "$url" || true)
            echo "challenge_attempt=$i http=$code"
            if [[ "$code" == "402" ]]; then
              success=1
              break
            fi
            sleep 4
          done
          [[ "$success" == "1" ]]
          python3 - <<'PY'
          import base64, json
          headers=open('/tmp/x402-headers.txt',encoding='utf-8',errors='ignore').read().splitlines()
          line=next((x for x in headers if x.lower().startswith('payment-required:')),None)
          assert line, 'missing PAYMENT-REQUIRED header'
          raw=line.split(':',1)[1].strip(); raw += '=' * (-len(raw) % 4)
          data=json.loads(base64.b64decode(raw))
          assert data.get('x402Version') == 2, data
          req=(data.get('accepts') or [])[0]
          assert req.get('scheme') == 'exact' and req.get('network') == 'eip155:8453', req
          assert req.get('payTo','').lower() == '0x04285de6a083ceb28fb0c254a2ed0f5fdb2eed28', req
          assert int(req.get('amount') or 0) == 5000000, req
          print({'x402_challenge':'ok','payment_attempted':False})
          PY

      - name: Verify iPhone browser gets wallet paywall
        shell: bash
        run: |
          ok=0
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'
          for i in {1..12}; do
            code=$(curl -sS -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -o /tmp/x402-human.html -w '%{http_code}' "$X402_PUBLIC_URL/buy/supplier-snapshot?technical_canary=1&human_test=$i" || true)
            echo "human_paywall_attempt=$i http=$code"
            if [[ "$code" == "402" ]] && grep -Eiq 'wallet|connect' /tmp/x402-human.html && ! grep -Eiq 'Note to developers' /tmp/x402-human.html; then
              ok=1
              break
            fi
            sleep 4
          done
          if [[ "$ok" != "1" ]]; then
            echo "Human paywall did not render the wallet UI"
            head -80 /tmp/x402-human.html || true
            exit 1
          fi
          echo "LUMEN_HUMAN_PAYWALL=success payment_attempted=false"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "LUMEN x402: $X402_BASE_URL"
          echo "Public checkout: $X402_PUBLIC_URL"
          echo "Receiver: $X402_EXPECTED_RECIPIENT"
          echo "Facilitator: $X402_FACILITATOR"
          echo "Network: Base / eip155:8453"
          echo "Asset: USDC"
          echo "Human browser paywall: enabled"
          echo "Conversion attribution: enabled"
          echo "Outgoing spend: disabled"
