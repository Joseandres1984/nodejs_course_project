name: LUMEN x402 Checkout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-x402.yml"

permissions:
  contents: read

concurrency:
  group: lumen-x402-deploy
  cancel-in-progress: true

jobs:
  deploy-x402:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LUMEN_D1_ACCOUNT_ID }}
      X402_BASE_URL: "https://lumen-zero-x402.joseandresceol1-jac.workers.dev"
      X402_EXPECTED_RECIPIENT: "0x04285DE6A083CEb28fb0C254a2ed0F5fdB2eeD28"
      X402_FACILITATOR: "https://facilitator.xpay.sh"
    steps:
      - name: Checkout LUMEN Zero
        uses: actions/checkout@v4
        with:
          ref: lumen-zero

      - name: Deployment preflight
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi

      - name: Verify facilitator supports Base mainnet x402 v2
        shell: bash
        run: |
          curl -fsS "$X402_FACILITATOR/health" -o /tmp/facilitator-health.json
          curl -fsS "$X402_FACILITATOR/supported" -o /tmp/facilitator-supported.json
          cat /tmp/facilitator-health.json; echo
          cat /tmp/facilitator-supported.json; echo
          python3 - <<'PY'
          import json
          supported=json.load(open('/tmp/facilitator-supported.json'))
          kinds=supported.get('kinds') or []
          assert any(k.get('x402Version') == 2 and k.get('scheme') == 'exact' and k.get('network') == 'eip155:8453' for k in kinds), supported
          print({'facilitator':'ok','base_mainnet':True,'network':'eip155:8453','x402Version':2,'scheme':'exact'})
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .lumen/x402-worker/package.json

      - name: Install x402 dependencies
        working-directory: .lumen/x402-worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker syntax
        working-directory: .lumen/x402-worker
        run: node --check worker.js

      - name: Deploy x402 Worker
        working-directory: .lumen/x402-worker
        run: npx wrangler deploy

      - name: Verify public health catalog and zero revenue truth
        shell: bash
        run: |
          health=$(curl -sS -o /tmp/x402-health.json -w '%{http_code}' "$X402_BASE_URL/health" || true)
          catalog=$(curl -sS -o /tmp/x402-catalog.json -w '%{http_code}' "$X402_BASE_URL/catalog" || true)
          stats=$(curl -sS -o /tmp/x402-stats.json -w '%{http_code}' "$X402_BASE_URL/stats" || true)
          echo "health_http=$health"; cat /tmp/x402-health.json; echo
          echo "catalog_http=$catalog"; cat /tmp/x402-catalog.json; echo
          echo "stats_http=$stats"; cat /tmp/x402-stats.json; echo
          [[ "$health" == "200" && "$catalog" == "200" && "$stats" == "200" ]]
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/x402-health.json'))
          catalog=json.load(open('/tmp/x402-catalog.json'))
          stats=json.load(open('/tmp/x402-stats.json'))
          recipient='0x04285DE6A083CEb28fb0C254a2ed0F5fdB2eeD28'
          facilitator='https://facilitator.xpay.sh'
          assert health.get('ok') is True, health
          assert health.get('x402') == 'LIVE', health
          assert health.get('network') == 'eip155:8453', health
          assert health.get('asset') == 'USDC', health
          assert health.get('facilitator') == facilitator, health
          assert health.get('recipientConfigured') is True, health
          assert health.get('outgoingSpendEnabled') is False, health
          settlement=catalog.get('settlement') or {}
          assert settlement.get('recipient') == recipient, settlement
          assert settlement.get('networkId') == 'eip155:8453', settlement
          assert settlement.get('asset') == 'USDC', settlement
          assert settlement.get('facilitator') == facilitator, settlement
          assert settlement.get('outgoingSpendEnabled') is False, settlement
          assert len(catalog.get('products') or []) == 6, catalog
          assert stats.get('recipient') == recipient, stats
          assert stats.get('network') == 'Base', stats
          assert stats.get('asset') == 'USDC', stats
          assert stats.get('facilitator') == facilitator, stats
          assert float(stats.get('realizedRevenueUsd') or 0) >= 0, stats
          print({'public_checkout':'ok','products':6,'realizedRevenueUsd':stats.get('realizedRevenueUsd')})
          PY

      - name: Verify real x402 payment challenge without spending
        shell: bash
        run: |
          code=$(curl -sS -D /tmp/x402-headers.txt -o /tmp/x402-body.txt -w '%{http_code}' "$X402_BASE_URL/buy/supplier-snapshot" || true)
          echo "UNPAID_X402_HTTP=$code"
          cat /tmp/x402-headers.txt
          cat /tmp/x402-body.txt || true
          [[ "$code" == "402" ]]
          python3 - <<'PY'
          import base64, json
          headers=open('/tmp/x402-headers.txt',encoding='utf-8',errors='ignore').read().splitlines()
          line=next((x for x in headers if x.lower().startswith('payment-required:')),None)
          assert line, 'missing PAYMENT-REQUIRED header'
          raw=line.split(':',1)[1].strip()
          raw += '=' * (-len(raw) % 4)
          data=json.loads(base64.b64decode(raw))
          assert data.get('x402Version') == 2, data
          accepts=data.get('accepts') or []
          assert accepts, data
          req=accepts[0]
          assert req.get('scheme') == 'exact', req
          assert req.get('network') == 'eip155:8453', req
          assert req.get('payTo','').lower() == '0x04285de6a083ceb28fb0c254a2ed0f5fdb2eed28', req
          assert int(req.get('amount') or 0) == 5000000, req
          print({'x402_challenge':'ok','network':req.get('network'),'amount_atomic':req.get('amount'),'asset':req.get('asset'),'payTo':req.get('payTo')})
          PY

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "LUMEN x402: $X402_BASE_URL"
          echo "Catalog: $X402_BASE_URL/catalog"
          echo "Stats: $X402_BASE_URL/stats"
          echo "Receiver: $X402_EXPECTED_RECIPIENT"
          echo "Facilitator: $X402_FACILITATOR"
          echo "Network: Base / eip155:8453"
          echo "Asset: USDC"
          echo "Outgoing spend: disabled"
