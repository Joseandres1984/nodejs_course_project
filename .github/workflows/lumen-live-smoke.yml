name: LUMEN live smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live A2A worker
        shell: bash
        run: |
          set -u
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          check() {
            name="$1"
            path="$2"
            body="/tmp/${name}.body"
            code=$(curl --show-error --silent --max-time 20 -o "$body" -w '%{http_code}' "$base$path" || echo 'curl_error')
            echo "===== $path HTTP $code ====="
            cat "$body" 2>/dev/null || true
            echo
            echo "$name|$path|$code" | tee -a /tmp/results.txt
          }
          check health /health
          check stats /opportunities/stats
          check next /opportunities/next
