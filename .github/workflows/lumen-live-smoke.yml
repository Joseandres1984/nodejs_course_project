name: LUMEN live smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live A2A worker
        shell: bash
        run: |
          set -euo pipefail
          base='https://lumen-zero-a2a.lumen-b2b.workers.dev'
          echo '--- /health'
          curl --fail --show-error --silent --max-time 20 "$base/health" | tee /tmp/health.json
          echo
          echo '--- /opportunities/stats'
          curl --fail --show-error --silent --max-time 20 "$base/opportunities/stats" | tee /tmp/stats.json
          echo
          echo '--- /opportunities/next'
          curl --fail --show-error --silent --max-time 20 "$base/opportunities/next" | tee /tmp/next.json
          echo
          python - <<'PY'
          import json
          for path in ['/tmp/health.json','/tmp/stats.json','/tmp/next.json']:
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          print('LIVE_SMOKE_JSON_OK')
          PY
