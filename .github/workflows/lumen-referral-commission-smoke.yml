name: LUMEN Referral Commission Smoke

on:
  push:
    branches: [lumen-zero]
    paths:
      - '.github/workflows/lumen-referral-commission-smoke.yml'
      - '.lumen/a2a-worker/referral-commission-engine.js'
      - '.lumen/a2a-worker/referral-commission-autopilot.js'
      - '.lumen/a2a-worker/x402-revenue-bridge.js'
      - '.lumen/a2a-worker/opportunity-entry.js'
      - '.lumen/a2a-worker/wrangler.toml'
  workflow_dispatch:

jobs:
  referral-commission-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://lumen-zero-a2a.lumen-b2b.workers.dev
      ADMIN_TOKEN: ${{ secrets.OPPORTUNITY_ADMIN_TOKEN }}
    steps:
      - name: Verify protected token
        run: test -n "${ADMIN_TOKEN:-}"

      - name: Wait for commission close-to-cash runtime
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            policy=$(curl --show-error --silent --max-time 10 "$BASE_URL/referrals/commissions/policy" || true)
            autopilot=$(curl --show-error --silent --max-time 10 "$BASE_URL/referrals/commissions/autopilot/policy" || true)
            bridge=$(curl --show-error --silent --max-time 10 "$BASE_URL/x402-revenue-bridge/policy" || true)
            if echo "$policy" | jq -e '.version == "1.2-referral-commission-engine-final-value"' >/dev/null 2>&1 \
              && echo "$autopilot" | jq -e '.version == "2.0-commission-autopilot-close-to-cash"' >/dev/null 2>&1 \
              && echo "$bridge" | jq -e '.version == "1.1-x402-revenue-bridge-referral-aware"' >/dev/null 2>&1; then
              printf '%s' "$policy" > /tmp/commission-policy.json
              printf '%s' "$autopilot" > /tmp/autopilot-policy.json
              printf '%s' "$bridge" > /tmp/bridge-policy.json
              exit 0
            fi
            sleep 5
          done
          echo "commission close-to-cash runtime did not become ready" >&2
          exit 1

      - name: Verify commission truth guardrails
        run: |
          set -euo pipefail
          jq -e '
            .internalSuggestedRatePct == 5 and
            .rule == "commission_is_never_revenue_until_verified_settlement" and
            .estimatedValueRequiredForProposal == false and
            .finalDealValueRequiredForPercentageFee == true and
            .percentageFeeUsesFinalDealValue == true and
            .exactAmountCheckout == true and
            .exactAmountSettlement == true and
            .x402Settlement == true and
            .automaticContract == false and
            .automaticSpend == false and
            .explicitCounterpartyAcceptanceRequired == true and
            (.lifecycle | index("AGREED_PENDING_CLOSE")) != null and
            (.lifecycle | index("PAYMENT_DUE")) != null and
            (.lifecycle | index("SETTLED")) != null and
            (.lifecycle | index("CLOSED_LOST")) != null
          ' /tmp/commission-policy.json >/dev/null

          jq -e '
            .standardSuccessFeePct == 5 and
            .percentageFeeBasis == "final_confirmed_deal_value" and
            .estimatedDealValueRequiredForProposal == false and
            .explicitAcceptanceRequired == true and
            .exactAcceptancePhrase == true and
            .closeEvidenceRequired == true and
            .closeReportRequiresFinalValue == true and
            .checkoutRail == "x402" and
            .exactAmountCheckout == true and
            .revenueOnlyAfterVerifiedSettlement == true and
            .counteroffersAutoAccepted == false and
            .maxExternalMessagesPerRun == 1 and
            .autonomousSpend == false and
            .automaticContract == false and
            (.priority[0] == "PAYMENT_DUE_COLLECTION") and
            (.priority[1] == "CLOSE_TRACKING") and
            (.priority[2] == "NEW_COMMISSION_PROPOSAL")
          ' /tmp/autopilot-policy.json >/dev/null

          jq -e '
            .truthRule == "only_settled_verified_x402_receipts_become_verified_revenue_events" and
            .exactReferralAttribution == true and
            .referralCommissionProductId == "REFERRAL-COMMISSION" and
            .autonomousSpend == false
          ' /tmp/bridge-policy.json >/dev/null

      - name: Verify autonomous mutation endpoints stay protected
        run: |
          set -euo pipefail
          code=$(curl --output /tmp/unauthorized.json --write-out '%{http_code}' --show-error --silent --max-time 15 \
            -X POST "$BASE_URL/referrals/commissions/autopilot/run" \
            -H 'content-type: application/json' -d '{}')
          test "$code" = "403"
          jq -e '.ok == false and .error == "admin_token_required"' /tmp/unauthorized.json >/dev/null

      - name: Plan commission cases without external contact
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/referrals/commissions/plan" \
            -H "x-lumen-admin: $ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' > /tmp/plan.json
          cat /tmp/plan.json
          echo
          jq -e '
            .ok == true and
            .version == "1.2-referral-commission-engine-final-value" and
            .guardrails.proposalIsInternalOnly == true and
            .guardrails.counterpartyNotContacted == true and
            .guardrails.agreementRequiredBeforePayment == true and
            .guardrails.estimatedDealValueNotRequiredForPercentageProposal == true and
            .guardrails.finalDealValueRequiredBeforePaymentDue == true and
            .guardrails.autonomousSpend == false and
            .guardrails.automaticContract == false
          ' /tmp/plan.json >/dev/null

      - name: Verify live commission ledgers
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 "$BASE_URL/referrals/commissions/stats" > /tmp/stats.json
          curl --fail --show-error --silent --max-time 30 "$BASE_URL/referrals/commissions/autopilot/stats" > /tmp/autopilot-stats.json
          cat /tmp/stats.json
          echo
          cat /tmp/autopilot-stats.json
          echo
          jq -e '
            .version == "1.2-referral-commission-engine-final-value" and
            (.total | type) == "number" and
            (.proposalReady | type) == "number" and
            (.agreedPendingClose | type) == "number" and
            (.paymentDue | type) == "number" and
            (.settled | type) == "number" and
            (.closedLost | type) == "number" and
            (.outstandingCommissionUsd | type) == "number" and
            (.realizedCommissionRevenueUsd | type) == "number"
          ' /tmp/stats.json >/dev/null
          jq -e '
            .version == "2.0-commission-autopilot-close-to-cash" and
            (.total | type) == "number" and
            (.messages.total | type) == "number" and
            (.messages.proposals | type) == "number" and
            (.messages.closeChecks | type) == "number" and
            (.messages.paymentRequests | type) == "number" and
            (.messages.paymentFollowups | type) == "number"
          ' /tmp/autopilot-stats.json >/dev/null

      - name: Safe settlement reconciliation only
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/x402-revenue-bridge/sync" \
            -H "x-lumen-admin: $ADMIN_TOKEN" > /tmp/bridge-sync.json
          curl --fail --show-error --silent --max-time 45 \
            -X POST "$BASE_URL/referrals/commissions/sync" \
            -H "x-lumen-admin: $ADMIN_TOKEN" > /tmp/commission-sync.json
          cat /tmp/bridge-sync.json
          echo
          cat /tmp/commission-sync.json
          echo
          jq -e '.ok == true and .guardrails.settledVerifiedOnly == true and .guardrails.exactReferralAttribution == true and .guardrails.noUnverifiedRevenue == true' /tmp/bridge-sync.json >/dev/null
          jq -e '.ok == true and .guardrails.verifiedPaymentEventRequired == true and .guardrails.x402SettlementRequired == true and .guardrails.exactAmountRequired == true and .guardrails.underpaymentsNotRecognizedAsFullSettlement == true and .guardrails.overpaymentsNotAutoReconciled == true and .guardrails.autonomousSpend == false' /tmp/commission-sync.json >/dev/null

      - name: Upload safe commission snapshot
        uses: actions/upload-artifact@v4
        with:
          name: referral-commission-snapshot
          path: |
            /tmp/commission-policy.json
            /tmp/autopilot-policy.json
            /tmp/plan.json
            /tmp/stats.json
            /tmp/autopilot-stats.json
            /tmp/bridge-sync.json
            /tmp/commission-sync.json
          retention-days: 1
