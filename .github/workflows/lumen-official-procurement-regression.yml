name: LUMEN Official Procurement Research Regression

on:
  pull_request:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/source-intelligence.js'
      - '.lumen/a2a-worker/test-official-procurement-network.mjs'
      - '.github/workflows/lumen-official-procurement-regression.yml'
  push:
    branches: [lumen-zero]
    paths:
      - '.lumen/a2a-worker/source-intelligence.js'
      - '.lumen/a2a-worker/test-official-procurement-network.mjs'
      - '.github/workflows/lumen-official-procurement-regression.yml'

permissions:
  contents: read

jobs:
  official-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate public procurement and supplier research
        run: |
          set -euo pipefail
          node --check .lumen/a2a-worker/source-intelligence.js
          node .lumen/a2a-worker/test-procurement-buyer-contact-bridge.mjs
          node .lumen/a2a-worker/test-official-procurement-network.mjs
